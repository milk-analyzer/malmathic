[features.persistence_deleted_entry]
group = "persistence_tampering"
log_lr = 2.5
benign_rate = """
CUT FROM 5.0 TO 2.5 ON 2026-08-28, SECOND PASS. 18 benign carriers across
13 datasets and NOT ONE TRUE POSITIVE anywhere in this tree. The row has
never once landed on a file that turned out to be malware: not on either
njRAT stage in VM_TESTS/test_4, not on the UxCryptor dropper on
WIN11-LAB-000005, not on the quarantined sample in test_5. Every
firing it has ever had is benign.

  test_2 live 1/2,256 · test_2 winre 1/2,371 · test_3 2/2,448
  test_4 1/2,412 · test_5 1/2,415 · test_6 3/2,847
  chain base 0/935 · -000001 1/1,233 · -000002 1/2,707 · -000003 1/2,833
  -000004 2/2,846 · -000006 2/2,846 · -000005 2/2,868
  -- 18 of 31,017, 0.058%, precision 0 of 18

WHY 2.5 AND NOT SOMETHING SMALLER OR LARGER. The row rides on top of a
mechanism row that has ALREADY said an autostart entry names this file. Its
whole increment is the word REMOVED, and removal has one enormous benign
generator that nothing offline can tell from a dropper's cleanup: software
that updates, relocates or uninstalls itself rewrites its own registrations,
and rewriting one frees the old cell. So the increment must be worth LESS
than the mechanism row it rides on -- knowing an entry existed is better
evidence than knowing one was later rewritten. 2.5 sits below run key (3.2),
service (3.4) and scheduled task (3.6), and above nothing. 5.0 asserted a
likelihood ratio of 148 against a measured benign rate of 0.058%, which
would need 8.6% of real samples to carry the row; no positive observation
in this tree supports that, and 18 negatives argue against it.

WHAT THIS COSTS. Nothing that was ever detected. The only carriers on any
dataset are per-logon transient service keys at p = 0.009-0.02, and the
OneDrive supersession family, which `relabel_superseded_com_registrations`
now takes out of this row entirely.

The measurement that stood here before, for the history:

Re-run today (both freed-cell coherence checks in place):
  base "Clean win10"          0 of   935
  -000001 Pre-FLARE Hardened  1 of 1,233  (0.081%)  strongest 0.0214
  -000002 ready flare-VM      1 of 2,707  (0.037%)  strongest 0.9994
  -000003 CUSTOM ready        1 of 2,833  (0.035%)  strongest 0.9994
  -000004 Flare-VM READY      2 of 2,846  (0.070%)  strongest 0.9994
  -000005 MALWCRYPT           0 of 2,851
  -000006 live (UxCryptor)    0 of 2,860
  -- 5 of 16,265 across the chain, 0.031%

Frozen reports, as recorded (these volumes cannot be re-read):
  laptop live, rescored       0 of 17,847
  test_1 3,744 / test_2 live 2,256 / test_2 winre 2,371  1 each
  test_3 2 of 2,448 · test_4 1 of 2,412 · test_5 1 of 2,415
  test_6 (frozen -000004)     3 of 2,847

Two populations, and they are nothing alike:

  * per-user service instances Windows creates and destroys at every logon
    -- BcastDVRUserService_52e00, CDPUserSvc_1e3ce, DevicePickerUserSvc_*,
    PimIndexMaintenanceSvc_*. Their whole KEY really is freed, so the entry
    really was deleted; the file is svchost.exe. Every one of these scores
    below 0.03 and none of them is close to a finding. This is the
    population the previous measurement saw, and it is the harmless one.

  * an application that MOVED. OneDrive 21.220.1024.0005 registered
    CLSID {71DCE5D6-4B57-496B-AC21-CD5B54EB93FD}\\LocalServer32 per-user out
    of AppData; the machine-wide install 23.038.0219.0001 in Program Files
    superseded it and the old value's cell was freed. On -000002, -000003
    and -000004 that recovers as a deleted COM entry (+5.0 here), is
    promoted to ComHijack because it names a different binary from the
    machine-wide registration (+4.8), and collects executed_but_now_absent
    (+3.0) because the version directory is gone -- p = 0.9994 on three
    snapshots of a machine with nothing wrong with it.

The claim under `rationale` that benign software does not erase its own
persistence is therefore FALSE as stated, and OneDrive is the counterexample.
Software that relocates or self-updates rewrites its own autostart and COM
registrations, and rewriting one frees the old cell. What the row is really
detecting is "this entry was rewritten or removed", and an upgrade does that
as readily as an antivirus or a dropper covering its tracks.

The 5.0 is left where it is because the fix is not a smaller number: on the
FLARE-VM chain this row alone is 0.03% and it is the interaction with
persistence_com_hijack that manufactures the 0.9994. That is priced under
persistence_com_hijack, not here.

Removed by this re-measurement, and NOT counted above: one carrier at
p = 0.78 on -000005 and -000004 that was never a deleted value at all --
\\microsoft\\windows\\iecompatuacache. See the paragraph on it below.
"""
rationale = """
A persistence entry pointing at this file was found in DELETED registry cells.
What that shows is that the entry was REWRITTEN OR REMOVED after it was
written -- an antivirus cleaning up, or a dropper covering its tracks, and
also an application that relocated or updated itself. This rationale used to
say "benign software does not install persistence and then erase the record of
it"; OneDrive does exactly that every time it moves from a per-user AppData
install to a machine-wide one, and the measurement under `benign_rate` is that
counterexample scoring 0.9994 on three clean snapshots.

Recovering this depends on the hive parser reaching deleted cells, which is why
that capability was a requirement rather than a nicety.

WHAT COUNTS AS A DELETED CELL, AND THE FALSE POSITIVE THAT SETTLED IT. A hive
reuses freed cells, so "this cell holds a plausible value" and "this value was
deleted" are different questions, and the second one is answered by allocation
bits alone:

  * a value-list slot past the declared count is residue. It is worth reading
    because a deleted value's `vk` is usually still lying there -- and only
    while it is. Once the allocator hands that cell out, the slot goes on
    pointing at it, and what is at the far end is a live value of another key.
  * a freed `vk` whose DATA cell has been reallocated recovers the new
    occupant's bytes under the dead value's name.

Both are now refused in `mm_harvest::persistence::regf::Hive::values` and
`collect_deleted_values`. Before they were, on WIN11-LAB-000005 -- the
FLARE-VM snapshot taken BEFORE the ransomware was detonated -- the user hive's
Run key declared one value in a three-slot list, and slot 2 still held the
offset of `CacheRelativePath`, a LIVE value of
`...\\Internet Settings\\5.0\\Cache\\Extensible Cache\\iecompatua` whose data is
the WinINet cache directory `Microsoft\\Windows\\IECompatUaCache`. It is not a
file and nothing about it was deleted. This row fired on it at +5.0 and it was
the only finding on that snapshot, at p = 0.78. On -000006 the same four bytes
had been overwritten, so the same machine an hour later did not have it.

The second half of that false positive was in `mm_core::NormalizedPath`, which
treated a RELATIVE path as a located one and keyed it to the volume root."""

# --------------------------------------------------------------------------
# Anti-forensics and lifecycle
# --------------------------------------------------------------------------

[features.deleted_soon_after_execution]
group = "lifecycle"
log_lr = 5.3
benign_rate = """
NO LONGER ZERO, and re-measured twice. (a) 2026-08-26 across the six
reports in the tree: 0 of 17,847 rebuilt laptop candidates, 0 of 2,256
(VM live), 0 of 2,448 (test_3), 0 of 2,412 (test_4) -- and 1 of 2,371 on
VM_TESTS/test_2/winre, C:\\Windows\\SoftwareDistribution\\Download\\Install\\
AM_Delta.exe, Windows Defender's own signature-delta package, run and
deleted one second later by Windows Update. (b) 2026-08-28, when the USN
change journal was wired in and this row could reach a deletion time it
could not reach before: 1 NEW carrier over the seven links of the
WIN11-LAB chain, 16,262 candidates in total, of which 1,589 are
eligible (a timestamped execution and no live file). That carrier is
\\Users\\Alice\\AppData\\Local\\Microsoft\\OneDrive\\Update\\
OneDriveSetup.exe on the pre-FLARE link: OneDrive updating itself. So
1 of 16,262 candidates, 1 of 1,589 eligible, and the observed precision
of this row on real data is 0 correct out of 2
"""
rationale = """
The file ran and then disappeared within ten minutes. Self-deletion after
execution is close to definitional for a dropper and has few innocent analogues.

WHERE THE TWO TIMES COME FROM. The execution time is whatever Amcache, Prefetch,
PCA or ShimCache recorded. The deletion time now has TWO sources, and this
paragraph said for a long time that it had one and that the USN journal was not
it — true when it was written, because `mm_raw::usn` existed and nothing on the
`pipeline::run` path called it. Since 2026-08-28 both are wired:

  * $STANDARD_INFORMATION's MFT-entry-modified field on the deleted file's
    surviving record — `mm_harvest::filesystem::observations_for`. It needs the
    record to have survived, and it is a filesystem timestamp on a volume the
    attacker had.
  * the change journal's own FILE_DELETE row — `mm_harvest::usn_journal`,
    reading `\\$Extend\\$UsnJrnl:$J`. Written by the filesystem driver into an
    append-only stream, and NOT reachable from `SetFileTime`. It is the better
    of the two wherever it exists.

`mm_score::graph` joins execution and deletion on an equal path key, so both
halves must name the same located path; a Prefetch entry that recorded only a
module name cannot supply the execution half.

WHAT THE JOURNAL ACTUALLY DELIVERED, MEASURED RATHER THAN HOPED FOR. Across the
seven links of the WIN11-LAB chain — six of them clean or nearly so, one
after a ransomware detonation — the journals hold 1,341 to 25,251 FILE_DELETE
rows each, and wiring them changed exactly ONE candidate's score on ONE link, in
the wrong direction: OneDriveSetup.exe, 0.0215 -> 0.1795, under `benign_rate`
above. No verdict moved on any link.

On the ransomware link itself the journal dated NOTHING, and the reason is worth
writing down because it is the shape of the whole source: 25,251 deletion rows,
2,867 paths the run knew, 12 rows whose leaf name matched one of them, and all
12 refused. Six sat in a PowerShell module's `de` locale directory while the run
knew the `en` one; six named a parent directory record NTFS has since handed to
something that is not a directory. The incident's own files were never deleted —
dropper, cryptor and ransom note are all still on disk — and the earlier cryptor
that DID delete itself predates the journal's window. So this row's reach is
wider than it was and its score on this project's best dataset is unchanged.

FIRING RATE, MEASURED. This paragraph said "Zero on both clean machines" and
that is no longer true -- see `benign_rate` above, and read the two bullets
below as the history they are rather than as the current rate. The counts in
them were taken over a 20,263-candidate laptop and a 3,744-candidate VM, both of
which today's admission rules have replaced. What follows is still worth writing
down, because "it never fires" was for a long time a bug rather than a result:

  * Reference laptop, live, 20,263 candidates. 4,661 carry a timestamped
    execution; 13,012 carry a timestamped deletion; EXACTLY ONE carries both —
    `malmathic.exe` itself, deleted by `cargo build` 3,018 seconds (50.3 minutes)
    after its last run. Outside the ten-minute window, so this fires on 0 of
    20,263. An hour-long window would have fired on that rebuild, which is what
    the ten minutes are buying.

  * Windows 11 VM, from WinRE, 3,744 candidates. 1,289 timestamped executions,
    46 timestamped deletions, no overlap at all: the deleted set is 25 NGEN
    native-image temporaries under \\Windows\\assembly\\Temp, 18 browser-cache
    scripts, a Defender definition backup and two renamed recycle-bin files.
    None of them is a thing any execution artifact ever recorded running. 0 of
    3,744.

So on those two machines both timestamps were captured correctly and the overlap
was genuinely absent — which is the shape a 5.3 wants.

IS THE REASON GONE, OR IS THE WEIGHT WRONG? The reason is gone. That is the
honest answer and it is written here rather than left for the next reader to
rediscover.

The argument for 5.3 was "no innocent file on a clean machine does this". A
third clean run, VM_TESTS/test_2/winre, has one that does:
AM_Delta.exe, executed and unlinked one second later by Windows Update. Ran-then-
vanished is what a self-deleting dropper does and it is ALSO what a package
installer does when it tidies up after itself, and 5.3 prices only the first
reading. The observed precision of this row on real data is 0 correct out of 1
firing.

THE CONSEQUENCE, MEASURED RATHER THAN ARGUED. On that clean volume the file
carries +7.5 (this row, `executable_in_windows_directory` +1.2,
`name_unique_on_machine` +1.0) against a prior of -7.7711 — p = 0.4326, the
highest ceiling of any clean dataset in the tree, and close enough that the
renderer prints the escalated NOTHING CLEARED THE THRESHOLD — ONE CANDIDATE CAME
CLOSE heading. One stage failure closes the gap: replay the same volume with the
Amcache unreadable and it rebuilds to 1,415 candidates, where the same file
REPORTS at p = 0.5610. Windows Update deleting Defender's own definition package
becomes a detection on a clean machine.

It also breaks the close-call band outright. That clean run sits at a ratio of
0.7626, ABOVE the 0.6904 of the `programfiles-run` dropper the band exists to
catch, so no value of `CLOSE_CALL_RATIO` separates them. See
`the_close_call_band_cannot_separate_the_clean_winre_run_from_a_dropper` in
`mm-report/src/lib.rs`, which asserts the inversion.

WHY THE NUMBER IS STILL 5.3. Because lowering it costs a real detection and that
trade has to be made deliberately, not as a side effect of repairing the
antivirus weights. This row carries 5.3 of the 7.9 that makes
`a_downloads_sample_that_deleted_itself_scores_what_the_matrix_says` report at
0.545 — a Downloads sample that ran and self-deleted with NO persistence
anywhere, which is the one matrix shape held together by nothing else. Taking
this row to 4.4, the most that keeps AM_Delta.exe under the bar at the
750-candidate floor, takes that cell to 0.327 and it stops being reported.
Whoever makes that call should make it against a fresh dataset that contains
both patterns, and should record it here.

THE FRESH DATASET ARRIVED AND IT DOES NOT SETTLE IT. The journal wiring above is
the first new evidence this row has had since that paragraph was written, and
what it produced is one more benign carrier and no new true one — the ransomware
chain contains the negative pattern (a self-updating application) and does NOT
contain the positive one in a form the journal can date, because that machine's
malware did not delete itself inside the journal's window. So the number stays
at 5.3 for the reason it already stood at 5.3, not because anything confirmed
it, and the honest summary of this row's standing is: reachable from two
independent clocks now, 2 benign carriers over nine datasets, 0 true positives
observed on real data, and every true positive it has is synthetic.

The one near miss on the older machines is an ordinary rebuild fifty minutes
wide, and it is pinned as a negative test in `crate::scenario`, alongside the
positive one at forty seconds.
"""

[features.executed_but_now_absent]
group = "lifecycle"
log_lr = 3.0
benign_rate = """
RE-MEASURED 2026-08-26: 808 of 17,847 rebuilt laptop candidates (4.53%),
and 88-198 of 2,256-2,448 VM candidates (3.9-8.1%). This entry read
"7.46% and 19.04%, nearly one VM candidate in five" -- OVERSTATED, in
both columns, by roughly 2x. The wreckage/lost-files split is why: names
the walk could not place are no longer candidates carrying an execution
with nothing behind it. This is the one row in this file whose stated
benign rate was too PESSIMISTIC, so the weight is conservative rather
than unsafe. It is still the +3.0 at the top of most clean ceilings in
the tree, including the +6.6 stack that sets `SMALLEST_MACHINE`
"""
rationale = """
Execution artifacts record this file running, but it is no longer on disk and no
uninstall left a trace. Weaker than the timed case above because ordinary
uninstalls and cleanup tools produce the same pattern."""

[features.executed_but_now_absent_from_scratch_space]
group = "lifecycle"
log_lr = 1.0
benign_rate = """
20 of 20 laptop and 27 of 27 VM executed candidates in a \\Windows\\Temp
SUBDIRECTORY are gone; absence is what ordinarily happens there. 0 of 130
benign carriers across all six datasets sit immediately in a temp root
"""
rationale = """
The same observation as `executed_but_now_absent`, in the directories where that
observation is what ordinarily happens: a SUBDIRECTORY of `\\Windows\\Temp`
(with `SystemTemp`, `CbsTemp` and the service profiles' temp directories). It
STANDS IN FOR the +3.0 row rather than adding to it —
`mm_score::features::from_lifecycle` offers one or the other, never both, and
they share the `lifecycle` group so that a future third member cannot restore
the discount by another route.

THE BASE RATE, MEASURED IN BOTH DIRECTIONS ON BOTH CLEAN MACHINES. Of the
candidates in each zone that carry an execution artifact, the share that no
longer exists:

                    reference laptop        Windows 11 VM (WinRE)
  \\Windows\\Temp       20 of 20   100.0%      27 of 27   100.0%
  AppData\\Local\\Temp  101 of 139   72.7%      18 of 19    94.7%
  AppData (other)      306 of 581   52.7%       7 of 43    16.3%
  Program Files        264 of 2874   9.2%      77 of 560    13.8%
  ProgramData            4 of 22    18.2%       0 of 9       0.0%
  system directory       3 of 156    1.9%       0 of 157     0.0%
  ALL ZONES            756 of 4752  15.9%     161 of 1446   11.1%

Absence is not one event with one rate. In SYSTEM's scratch directory it is
UNIVERSAL — every executed candidate there, on both machines, is gone, because
that is what an installer's unpack directory is for: the twenty and the
twenty-seven are Chrome's updater unzipping installers, the Visual C++
redistributable bootstrappers, and Defender's `MpRecovery.exe` and
`MpSigStub.exe`. An event that happens to 100% of the benign population in a
zone cannot carry a positive likelihood ratio there.

WHERE THE 1.0 COMES FROM. The +3.0 row is an expert prior set against a
whole-machine benign absence rate of 11-16%. Conditioned on the zone, the benign
rate rises to ~1.0, which is 7.7x more common than the rate the +3.0 was chosen
against: 3.0 - ln(1.0 / 0.13) = 0.96. Rounded to 1.0, and deliberately not to
0.0 — a dropper does stage in scratch space, and the claim being made is "this
is weak here", not "this is nothing".

WHAT IT COSTS IN DETECTION: nothing at the threshold. In `examples/planted.rs`
at the VM's prior of -7.6700, the ran-and-vanished rows move

  AppData\\Local\\Temp   0.255 -> 0.049 with no persistence, 0.979 -> 0.873 with
                        a Run key, 0.986 -> 0.911 with a task, 0.983 -> 0.894
                        with a service
  Windows\\SystemTemp    0.338 -> 0.065 / 0.979 -> 0.873 / 0.986 -> 0.911 /
                        0.983 -> 0.894

Every cell that was reported is still reported; every cell that falls was
already below 0.50. The whole 2.0 log-odds comes out of the column where the
tool was distinguishing nothing anyway.

WHAT IT BUYS. Eleven `\\Windows\\Temp` and `SystemTemp` files were the Windows 11
VM's entire ceiling, tied at 0.3385 on exactly
`[executable_in_windows_temp +3.0, executed_but_now_absent +3.0,
name_unique_on_machine +1.0]` with 0.669 log-odds of headroom — at the time,
the thinnest margin on either dataset. BOTH NUMBERS ARE HISTORICAL: 0.3385 and
0.669 are over the 2,143-candidate rebuild of VM_TESTS/test_1. The thinnest
clean margin in the tree today is 0.2711 (AM_Delta.exe on
VM_TESTS/test_2/winre), so any reasoning elsewhere that treats 0.669 as the
tightest constraint is reasoning against 2.5x more room than exists. They fall to 0.0648 and stop being the machine's top
finding.

THE SUBDIRECTORY CONDITION, ADDED 2026-08-26, AND WHY IT IS NOT A HEDGE. The
discount above is correct and it was also being paid on the residue of a real
intrusion that an antivirus had cleaned up, which is the case this tool exists
for. `\\Windows\\Temp\\server.exe` -- a real njRAT stage that the previous run of
the same volume reported at p = 1.00 with a Run key, an $MFT record, four
artifact families and its bytes recovered -- came back after Defender's cleanup
carrying one ShimCache row and priced at

  -7.7911 (prior) + 3.0 (executable_in_windows_temp) + 1.0 (this row)
                  + 1.0 (name_unique_on_machine)  =  -2.7911  ->  p = 0.0578

So the question was asked properly: is there a FACT that separates "an installer
unpacked here and tidied up" from "something ran here and was removed"? Four
were considered -- the Defender log naming the path, a quarantine entry, a
recovered deleted registry entry, and the ShimCache timestamp against the $MFT
deletion time. None of them is available for this file: the Defender log's two
unmatched detections are not it, the quarantine store is absent from that
machine, the Run key's freed cell yields no owning key, and there is no $MFT
record at all, so there is no deletion time to compare against.

The fact that DOES separate them is where in the temp tree the file sat, and it
was measured rather than guessed. Every candidate carrying this row, on all six
reports:

                        carriers   immediately in a temp root
  test_1                    27                0
  test_2 (live)             16                0
  test_2 (WinRE)            19                0
  test_3                    24                0
  test_4                    22                0
  test_5                    23                1   <- \\Windows\\Temp\\server.exe
  --------------------------------------------------
  benign total             130                0

130 of 130. The reason is the idiom the base rate is made of: software that
unpacks into scratch space makes itself a directory, because it is unpacking
more than one file and wants to delete the lot with one call --
`{54106D84-...}\\.be\\VC_redist.x64.exe`,
`GoogleUpdater_chrome_Unpacker_BeginUnzipping3236_915766021\\UpdaterSetup.exe`,
`DBF1C200-...MpCommU\\UpdatePlatform.exe`, `69B4930B-...\\MpRecovery.exe`.
Dropping one bare executable in the temp root and running it is what something
does when it is not unpacking anything.

So the discount now applies where it was measured, and a file that ran from the
temp ROOT and is gone takes the general +3.0 again. MEASURED COST, by replaying
every dataset through `examples/rescore`:

                    carriers of this row      strongest candidate
                    before -> after           before -> after
  test_1              27 -> 27                0.3271 -> 0.3271
  test_2 (live)       16 -> 16                0.2458 -> 0.2458
  test_2 (WinRE)      19 -> 19                0.4326 -> 0.4326
  test_3              24 -> 24                0.2309 -> 0.2309
  test_4              22 -> 22                0.9973 -> 0.9973  (both njRAT stages)
  test_5              23 -> 22                0.9804 -> 0.9804

Not one candidate on any clean dataset changes by any amount, because not one of
them is in a temp root. The whole of the effect is `server.exe`, 0.0578 ->
0.3123. NOTE WHAT THAT IS AND IS NOT: 0.3123 is still under the 0.50 bar, and
deliberately so. This row is not the thing that should convict a file whose only
surviving evidence is one ShimCache entry, and raising it until it did would be
choosing a weight to reach a conclusion. What the change buys is that the file
is no longer priced as though it were a Chrome installer, and that it now sits
where an analyst reading the near-miss list will see it.

AND ON THE PLANTED MATRIX, which is where the DETECTION cost of a location
rule is read rather than its false-positive cost. `examples/planted.rs` now
carries the pair, at the VM's prior of -7.6700, ran-once-and-vanished:

                                none   Run key   Startup     task   service
  Windows\\SystemTemp          0.338    0.979*    0.979*   0.986*    0.983*
  Windows\\SystemTemp\\unpack   0.065    0.862*    0.862*   0.903*    0.884*

The two rows are the same shape in the same zone and differ only in whether
the file had a working directory of its own. Every cell that was reported is
still reported. They are kept as a PAIR deliberately: a single row could be
moved by a later change without anyone noticing which of the two populations
it had been moved for.

WHY NOT ALSO `AppData\\Local\\Temp`. The same condition could be applied there
and it is not, because the population is different: a user's temp directory
routinely holds bare executables that ran and were deleted -- browser download
staging, one-shot tools, `.cr`/`.be` bootstrappers that are themselves at the
root. The measurement above is over `\\Windows\\Temp` and its siblings, which
only SYSTEM writes to, and it may not be extended to a directory it was not
taken in.

WHAT WAS CONSIDERED AND REJECTED: raising absence in Program Files, on the
theory that software which uninstalls itself is rare. The table above refutes
it — 264 benign instances on the laptop and 77 on the VM, 9.2% and 13.8% of the
executed candidates in that zone. Worse, 34 of the laptop's 264 (12.9%) are not
absent at all: the file is on disk today and the `$MFT` pass simply produced no
`FileExists` for it, so the strongest Program Files absence claim on that
machine, `SamsungMagician.exe` at 0.0973 carrying a scheduled task, is a
measurement error. It reaches 0.518 at +5.3. There is no room above absence in
Program Files that is not already occupied by noise."""

[features.timestomped]
group = "antiforensic"
log_lr = 4.8
benign_rate = """
0 of 19,270 laptop candidates and 1 of 3,744 VM candidates carry a $SI/$FN
disagreement of the shape T1070.006 admits
"""
rationale = """
$STANDARD_INFORMATION and $FILE_NAME timestamps disagree in the way that
overwriting the former produces (T1070.006). This is an anti-forensic action,
not a side effect of anything legitimate."""

[features.created_in_incident_window]
group = "lifecycle"
log_lr = 1.8
benign_rate = """
9 of 20,241 laptop candidates fall inside a window built from the
machine's own lifecycle evidence
"""
rationale = """
Created within the burst of activity that other evidence points at. Corroborating
rather than independently incriminating — a great many innocent files are created
in any given hour.

THE GROUP IS THE POINT, and it used to be `timing`, which was wrong. The window
is computed from the timestamps of candidates that scored above the reporting
threshold, and those scores are largely made of `deleted_soon_after_execution`
(+5.3) and `executed_but_now_absent` (+3.0) — the two other members of
`lifecycle`. In a group of its own this weight added to theirs, which is one
fact about when a file appeared, counted twice. Sharing their group means a file
with real lifecycle evidence keeps the stronger weight and collects nothing
further for also being on the clock, while a file whose only temporal claim is
membership of the window collects the 1.8 on its own. That is what makes this
corroboration rather than a second accusation.

The producer is `mm_score::window`, which is where the three guards on it are
documented at length. Two measurements from this machine matter to the value:

  * SEEDING. The window forms only around candidates already above the reporting
    threshold on other evidence. On the reference Windows 11 machine — 19,270
    candidates once this project's own build output is excluded, 5,497 of them
    (27.2%) carrying an $SI creation time — the strongest candidate scores
    0.1282, so there is NO seed, no window, and this feature fires on 0 of them.
    That is not a tuned outcome; the bar is the same threshold the report already
    uses, and the machine misses it by 1.92 log-odds.

    The naive alternative was measured rather than argued about, and the
    measurement was REDONE on 2026-08-24 because the first one was taken on a
    contaminated dataset. It used to read: "seeding on the top candidate
    regardless of score builds a window around that candidate's own activity (a
    27-minute compiler run), fires on 9 of 20,241 — and lifts the seed itself
    from p = 0.247 to p = 0.665, turning NOTHING FOUND into a false accusation."
    Every word of that was true of `malmathic-case/report.json` — a file that
    no longer exists, destroyed 2026-08-27 by an `--image` run that defaulted
    `--out` into this repository, so the contaminated row in the table below
    can never be re-taken. The clean row can, and it is the row the guard rests
    on. The compiler run was THIS PROJECT'S: the reference laptop is the machine
    malmathic is developed on, and 993 of its candidates are the agents'
    harness binaries under AppData\\Local\\Temp\\claude\\...\\scratchpad and the
    repository's own target\\ directories. Two of them held the top of that
    ranking.

    Re-measured on `malmathic-case/report.self-excluded.json`, which is the same
    run with that tree removed:

        dataset                    strongest   naive rule takes it to   window
        report.json (contaminated)    0.2467                   0.6645        8
        report.self-excluded.json     0.1282                   0.4709        1

    The clean number does not cross 0.50. It lands one hundredth short of a coin
    toss on JetBrains' `EtwHostServiceUpdater.exe`, a file with nothing wrong
    with it — and rescored under today's weights the clean machine's top is
    `imdsksvc.exe` at 0.2364, which the naive rule takes to 0.6519, over the bar
    again. The rule therefore stands, on the weaker claim that survives the
    cleaning: a window seeded on whatever happens to be top puts an innocent
    file at or past the threshold. A candidate must never collect the weight for
    sitting in a window its own timestamps defined, and `window.rs` enforces
    that separately from the group. Pinned by `tests/reference_machine.rs`,
    which prints which case file it was handed.

  * DENSITY. Bulk file creation is ordinary on Windows. The busiest twenty
    minutes of this machine's candidate creation times holds 1,344 candidates —
    7.0% of all of them, 25% of those that have a creation time — and it is a
    servicing event, 147 files into \\Windows\\System32\\drivers inside one
    second. (Unchanged by the self-exclusion: the same 1,344 files, against
    19,270 candidates instead of 20,263, so the percentages move and the
    measurement does not. This project's build output all lands in user temp,
    not in a servicing burst.) Median occupancy of a 20-minute window anchored on a real creation
    time is 268 candidates (1.3%); the 75th percentile is 510. So even a
    legitimate incident window can put this sentence on hundreds of files, which
    is why the weight is small and why `window.rs` refuses a window covering
    more than 2% of the candidate set.

    What that density does NOT do on this machine is manufacture findings —
    but the reassurance this paragraph used to give was contaminated, and the
    clean version of it is weaker. It used to read: "of the 5,497 candidates
    with a creation time, exactly 2 sit within 1.8 log-odds of the threshold,
    and both are the compiler artifacts already at the top of the list [...]
    both of those are excluded by the seeding rule, because reaching them
    requires a window they themselves seeded." Those two files were this
    project's own harness binaries, and being the seed is exactly why they were
    harmless.

    RE-MEASURED with them removed. As the report was written, ZERO of the clean
    machine's candidates sit within 1.8 log-odds of the threshold — the
    strongest is 0.1282 and the bar is 0.1419 — so the old count of 2 was
    entirely this project's. Rescored under today's weights the answer is one,
    and it is not the seed: `%SystemRoot%\\system32\\imdsksvc.exe`, ImDisk's
    unsigned service, sits at 0.2364 with 1.17 log-odds of headroom, and
    `rescore --window` — which offers +1.8 to every candidate that has a
    creation time at all, a strict over-estimate — puts it at 0.6519 and reports
    1 candidate at or over 0.50 (3 on the contaminated file, the other two being
    the harness binaries at 0.6841).

    That is the honest exposure and it is stated rather than argued away: if a
    real sample opens a window on this laptop, a benign third-party service
    driver can be carried over the bar beside it. The seeding rule does not save
    it, because it is not the seed. The 1.8 is not changed for this — the clean
    measurement says the old reassurance was wrong, not that the number is —
    and `unsigned_in_system_zone`'s own rationale already records that nothing
    available offline separates this file from a planted one.

The 1.8 is unchanged and remains an expert prior. The measurements above bound
how often it fires and what it can do; they do not establish P(feature |
malicious), there being no malware corpus here, so there is nothing to fit."""

# --------------------------------------------------------------------------
# Content
# --------------------------------------------------------------------------

[features.yara_match]
group = "content"
log_lr = 0.4
benign_rate = """
2,559 of the 4,071 readable PE candidates in the laptop case file, 62.86%,
contain the string `IsDebuggerPresent` -- the archetypal generic
anti-analysis rule. A packer section-name rule anchored to the section
table fires on 1 of 4,071, 0.025%; the SAME rule as an unanchored byte
search fires on 322, 7.91%. One row cannot price both families, and this
row is priced for the loud one
"""
rationale = """
A bundled YARA rule matched the file's bytes.

NO PRODUCER. Nothing in this tree constructs `ObservationKind::YaraMatch`.
`mm_score::features` routes to this row, no harvester emits the observation, and
no rule set ships. It is listed in PRODUCERLESS in `mm-score/src/weights.rs`,
which fails the build the moment a producer appears.

REPRICED FROM 6.5 ON THE MEASUREMENT, and the arithmetic is the reason. At 6.5
this row was the largest loaded gun left in the table: a single hit lifts any
candidate already at p >= 0.0015 over the 0.50 reporting threshold, and the
laptop's clean ceiling is 0.2333 with sixteen of its top twenty above 0.03. One
generic rule would have turned a machine that reports NOTHING into a machine
that reports a dozen installers.

MEASURED over the 4,071 candidates in the laptop's own case file whose bytes are
still on disk and start `MZ` — the population the pipeline would actually offer
a rule set:

    `IsDebuggerPresent`                    2,559 of 4,071    62.86%
    `VirtualAlloc` AND `IsDebuggerPresent`   463 of 4,071    11.37%
    `CheckRemoteDebuggerPresent`              29 of 4,071     0.71%
    packer section NAME, read from the section table
                                               1 of 4,071     0.025%
    the same packer strings, unanchored byte search
                                             322 of 4,071     7.91%

Three things in that table, and each one decides something.

FIRST, the generic anti-analysis family — the family a bundled offline rule set
is mostly made of — fires on nearly two thirds of benign candidates. P(feature |
benign) = 0.6286 caps the log-LR at ln(1 / 0.6286) = +0.46 no matter what
P(feature | malicious) is, because a probability cannot exceed 1. 6.5 asserted a
likelihood ratio of 665 where no probability can produce more than 1.59. That is
the same defect this project already fixed once, in a different row.

SECOND, the packer-section family is 0.025% — 1 file, a VPN client's daemon,
which is genuinely UPX-packed and is the same file `high_entropy_code_section`
already names. Taken alone that family would support far more than +0.46. One
row cannot price both families any more than one row could price unsigned in
`\\System32` and unsigned in `Program Files`, and splitting requires a rule set
to split BY. There is none, so there is one row and it is priced for the loud
family. A future packer-family row is a separate entry with its own measurement
against the rules that actually ship.

THIRD, the anchoring is worth more than the rule. The identical packer strings
searched as raw bytes rather than read from the section table fire on 322 files
instead of 1 — a factor of 322 between a rule and a sloppy version of the same
rule. A rule set is not one weight; that is why this row cannot be trusted to
stand in for whatever arrives later.

0.4 sits just under the +0.46 ceiling the measurement establishes. It is enough
to order two otherwise identical candidates in a ranked list and not enough to
report either, which is the correct behaviour for a signal nobody has counted on
the malicious side."""

[features.high_entropy_code_section]
group = "packing"
log_lr = 2.1
benign_rate = """
12 of 5,816 PE candidates in the laptop's own case file, 0.206%, and 4 of
11,467 PE images over a 1-in-8 sample of the machine, 0.035%; 0 of 669
installer-shaped executables
"""
rationale = """
The executable's code section is near-random, indicating packing or encryption.
Genuinely common in malware — and also in commercial installers and protected
software, which keeps this from being worth more.

Produced by `mm_harvest::pe`: Shannon entropy over the raw bytes of every
section marked IMAGE_SCN_CNT_CODE or IMAGE_SCN_MEM_EXECUTE, highest one wins,
fires at >= 7.2 bits/byte on a section of at least 16 KB.

NOW WIRED. `verify_signatures` in `pipeline.rs` runs `mm_harvest::pe::harvest`
on the bytes it has already read for the Authenticode digest, so the feature
costs no extra I/O and the run reports a "PE section entropy (N images)"
coverage line. Before that it was declared, routed and unreachable — the weight
existed and nothing on a real machine could produce it.

MEASURED TWICE, over two different populations, and the difference is the point.

  (a) Over a 1-in-8 sample of the machine's 199,242 executables — 24,851 files
      read, 11,467 PE images with a code section or a CLI header:

          fires on 4 of 11,467                                    0.035%
          installer-shaped .exe (setup/install/update/vcredist),
            all 669, no sampling: fires on 0                      0.000%

  (b) Over the population the pipeline ACTUALLY scores: the 19,530 located
      candidates in this machine's own case file, of which 5,818 still exist and
      5,816 are PE images. Same shipped code, no sampling:

          fires on 12 of 5,816 PE candidates                      0.206%
          of all 19,530 located candidates                        0.061%

(b) is six times (a). Candidates are not a random sample of installed files —
they are the executables something already pointed at — so the rate that matters
for false positives is the conditional one, and it is the one quoted here. The
twelve: six games from one storefront's library at a flat 8.00 bits/byte, which
is commercial DRM and genuinely is encryption; three Microsoft Software
Protection binaries (`sppsvc.exe`, `clipup.exe`, `sppextcomobj.exe`), likewise
deliberately obfuscated; one VPN client's helper daemon, genuinely UPX-packed;
and
ffmpeg's `ffmpeg/ffplay/ffprobe.exe`, whose `.rodata` is marked executable by the
toolchain and holds compressed tables. That last one is the only firing where
the sentence the report prints is wrong about the file rather than merely
unhelpful about it.

WHAT IT COSTS THIS MACHINE'S VERDICT: nothing, and for a reason worth writing
down. The pipeline reads candidate bytes only for the signature shortlist — 116
files on the last run — so the feature is offered 116 files, not 5,816, and
NONE OF THE TWELVE IS IN THAT SHORTLIST. It fires on 0 of 116. Even if one had
been, the arithmetic is unthreatening: the highest-scoring of the twelve is
`clipup.exe` at p = 0.0018, and +2.1 takes it to p = 0.0146 — an order of
magnitude below the 0.50 reporting threshold. The other eleven end below 0.004.

Two design choices carry that number, and both were measured rather than
assumed:

  * CODE SECTIONS ONLY. This is what keeps installers out, and it matters more
    than the threshold does. An NSIS, Inno or wrapper installer puts its
    compressed payload in `.rsrc` or in an overlay past the last section, never
    in `.text` — hence 0 of 669. The roadmap's worry that "installers are packed
    too" is true of the FILE and false of its code section.

  * MANAGED ASSEMBLIES EXCLUDED. 6,017 of the 11,467 (52.5%) are .NET, where
    `.text` is not machine code but the CLI header, IL, metadata tables and
    usually embedded compressed resources. Including them takes the rate from
    0.035% to 0.218% and 21 of the 25 firings become Visual Studio satellite
    resource DLLs and the like — a sentence claiming their code is packed would
    simply be false. The blind spot this buys is real and named: a .NET assembly
    protected by ConfuserEx will not fire here, and catching that needs a
    CLI-aware check or a YARA rule, not a byte histogram.

The 16 KB floor is there because the estimator is biased upward on small
samples: three 6-7 KB `.no_bbt` thunk sections in Windows Media codecs measured
7.74-7.76 for no reason but their size, and a section that small cannot hide a
payload worth recovering anyway.

The threshold itself buys little, which is why it is not fussed over. Highest
code-section entropy across the same 11,467 files: >= 6.5 on 6.13%, >= 7.0 on
0.31%, >= 7.2 on 0.24%, >= 7.5 on 0.18%. Compiler output stops before 7.0 and
the tail past it is a fixed handful of files.

The WEIGHT is unchanged at 2.1, and deliberately so. Taken at face value the
measurement argues for far more — a 0.035% base rate against any plausible
share of packed malware gives a log-LR near 7 — and that number would be
invented twice over. P(feature | malicious) has not been measured here at all,
there being no malware corpus; and the 0.035% denominator is a clean machine's
INSTALLED files, while the candidates this tool scores are the recently
arrived, once-run, temp-directory ones, which are far likelier to be packed. The
measurement establishes that the feature is quiet enough to keep. It does not
establish how loud it should be, and until it does the expert prior stands."""

[features.pe_structural_anomaly]
group = "packing"
log_lr = 2.8
benign_rate = """
0 of 125,988 files on the reference laptop declare an entry point outside
every section they themselves declare
"""
rationale = """
The PE is malformed in a way real linkers do not produce. Typical of hand-built
or hand-edited binaries.

WAS DEAD UNTIL NOW, and the way it was dead is worth recording. The weight was
declared, `mm_score::features` routed to it, and NOTHING IN THE TREE COULD EMIT
IT: `ObservationKind::PeAnomaly` carries three different findings and they are
told apart by the ATT&CK identifier the harvester embeds in the detail, so this
row was the `else` arm of a match whose two other arms covered every observation
the tree actually produced. It was also the only row in this table with no
measurement behind it at all — three sentences of description, no benign rate,
no population. That combination is the dangerous one: a weight nobody measured,
sitting one harvester change away from shipping.

NOW REACHABLE, on exactly one condition, and that one is measured.
`mm_harvest::pe::entry_point_is_inside_a_section` answers `Some(false)` when the
image declares an `AddressOfEntryPoint` that lies inside none of the sections it
itself declares. Measured through the shipped reader over 125,988 files on the
reference laptop — everything under `\\Windows`, both Program Files trees,
`\\Users`, `\\ProgramData` and `\\Windows\\Temp`:

    entry point outside every section          0 of 125,988      0.000%

Zero, in every zone. It fires on neither clean dataset and cannot: neither
report contains the observation, and no file on the machine that produced one of
them has the property.

A zero entry point is NOT this finding and never reaches the row. A DLL with
`AddressOfEntryPoint` of zero is ordinary, so the reader answers `None` — UNKNOWN
— rather than `Some(false)`, and UNKNOWN emits nothing.

The other two shapes the old text named — overlapping sections, a wildly
oversized declared image — are still NOT emitted by anything, and are still
unmeasured. They are left out rather than guessed at. `code_sections` already
refuses to walk overlapping sections for an unrelated reason (a 96-section
overlapping image cost 13.6 seconds before it was budgeted), so the fact is
available cheaply if a later round wants to measure how often a legitimate image
has it.

The WEIGHT is unchanged at 2.8 and is still an expert prior. A benign rate of 0
in 125,988 bounds P(feature | benign) below 1/125,988 and taken at face value
would support far more; P(feature | malicious) is unmeasured, as everywhere else
in this table, and a broken entry point is a mistake a packer makes rather than
something malware sets out to do. 2.8 is what the row already claimed, and the
measurement does not argue for raising it — only for it no longer being
unreachable and unexamined."""

# --------------------------------------------------------------------------
# Binary identity — what the file says about itself
#
# Its own group, and not a member of `signature`, because on the population
# where this feature is offered the two were MEASURED to be independent. In
# `\System32` and `\SysWOW64`, 148 of 9,157 SIGNED native PE images carry no
# version resource and 0 of the 12 UNSIGNED ones do; across both offered zones,
# ALL 496 of the binaries missing a version resource are signed. Knowing a file
# there is unsigned does not raise the chance it is also missing its version
# resource, so the two facts are allowed to add.
#
# That is the opposite of what the same question answers machine-wide — 62.3% of
# unsigned native binaries in Program Files have no version resource against
# 8.7% of the signed ones — and that discrepancy is the entire reason this
# feature is zone-restricted rather than offered everywhere and weighted down.
# --------------------------------------------------------------------------

[features.no_version_resource]
group = "binary_identity"
log_lr = 2.5
benign_rate = """
496 of 27,496 native images in the two zones this feature is offered in,
1.80% -- 148 of 9,212 in System32/SysWOW64 and 348 of 18,284 in WinSxS
"""
rationale = """
The binary carries no version resource at all: no `RT_VERSION` entry in its
resource directory, and therefore no CompanyName, no ProductName and no
FileVersion. Offered ONLY in the system directory and the component store.

Produced by `mm_harvest::pe::has_version_resource`, from the bytes the signature
pass has already read. It walks the first level of the resource directory
looking for type 16 and stops: the type is an integer id at level one, so
nothing below has to be visited, and the walk is a single node for almost every
image.

WHAT IT IS FOR. The reference laptop's clean ceiling is `imdsksvc.exe` — ImDisk's
genuinely unsigned service — at three features and +8.6: unsigned in the system
zone, installed as a service, a name nothing else on the machine shares. A
sample planted at `\\System32\\svcupdate.exe` and registered as a service
collects THE SAME THREE and lands at exactly +8.6 as well. Byte for byte tied,
which is why the previous round concluded correctly that no threshold and no
prior could ever separate them: the tool was collecting the same three facts
about both. This is a fourth fact, from bytes already in hand, that they do not
share. ImDisk's service carries a full version resource naming
`Olof Lagerkvist`, product `imdisk`, version 3.0.0.24, with an OriginalFilename
matching the file it sits in.

MEASURED, on the reference laptop, THROUGH THE SHIPPED READER — `verpop` calls
`mm_harvest::pe::has_version_resource` and nothing else. 125,988 files read
whole, no sampling: everything under `\\Windows` and both Program Files trees,
and everything under `\\Users`, `\\ProgramData` and `\\Windows\\Temp`. Native
images only; managed assemblies are counted apart because `harvest` says nothing
else about one.

  zone                                     native   no version resource
  \\Windows\\System32, \\Windows\\SysWOW64     9,212       148     1.61%
  \\Windows\\WinSxS  (component store)      18,284       348     1.90%
   -- the two zones this feature is offered in, together --
                                           27,496       496     1.80%

  \\Program Files, \\Program Files (x86)     10,665     2,030    19.03%
  \\ProgramData                              9,536       512     5.37%
  \\Users\\<u>\\AppData\\Local\\Temp            2,094       653    31.18%
  \\Users\\<u>\\AppData  (elsewhere)           3,894     1,230    31.59%
  \\Users\\<u>  (elsewhere in the profile)     2,203     1,290    58.56%
  -- everything, native --                 55,888     6,211    11.11%

THE ZONE RESTRICTION IS THE FEATURE. Windows' own build stamps every binary it
ships, so a missing version resource is genuinely unusual in the two directories
Windows services. Nowhere else is it unusual at all: a third of the benign
native executables in a user's temp directory have none, and more than half of
those elsewhere in a profile do. MinGW, autotools, Go and Rust builds simply do
not stamp one — the reference laptop's own `target\\debug\\deps` contributes 310
of them, `\\Program Files\\Git\\usr\\bin` another 307, and OpenSSL's test tree
316. Offering this feature in a user zone would be paying for the ordinary case,
and on a developer's machine it would be paying for it thousands of times. It is
therefore NOT OFFERED there — not discounted, not weighted down, not offered.
`mm_score::features` checks `Zone::SystemDir | Zone::WinSxs` before this row can
be reached, and `packed_binary.rs` asserts both halves of that from outside
`mm-score`.

ProgramData was the near miss, and it is recorded because it was decided by a
number rather than by taste. 5.37% is low enough to be interesting, and the
`programdata-service` plant needs exactly +1.68 to be reported on the laptop.
But the VM's highest-scoring candidate whose bytes are on the volume is
`\\ProgramData\\Microsoft\\Windows Defender\\platform\\...\\MsMpEng.exe` at +6.0
against a threshold of +7.67, so any weight above +1.67 offered in ProgramData
would have to be argued against a file this project can no longer read. +1.68 is
above +1.67. The plant misses by one hundredth of a nat and the honest thing is
to say so and not offer the feature there.

WHAT IT COSTS THE TWO CLEAN DATASETS.

  * Reference laptop, MEASURED rather than argued. All 6,211 absences the reader
    found were injected into the case file with `rescore --noversion`; 1,058 of
    them attached to paths the report already held. Twelve candidates fire the
    row. The strongest reaches p = 0.0248 — `\\System32\\UCConfigTask.exe`, a
    signed Microsoft scheduled-task binary that genuinely ships without a
    version resource, at +3.6 + 2.5 = +6.1 against a threshold of +9.7725. The
    other eleven are below p = 0.021, mostly third-party drivers. The machine's
    ceiling does not move: `imdsksvc.exe` carries a version resource, does not
    fire, and stays at 0.2364. NOTHING FOUND, as before.

    The margin is 3.67 nats. The weight could have been +6.1 before this machine
    reported anything.

    The conjunction that would actually worry — unsigned AND no version resource
    — is 0 of 27,496 in the offered zones. All 496 binaries there without one
    are signed (254 with an embedded signature, 242 by catalog).

  * VM. This dataset survives only as a `report.json`; its volume is gone, so a
    byte-derived feature CANNOT be re-measured on it and this row does not
    pretend otherwise. What can be established is a bound. Of its 2,143 rescored
    candidates, 706 have bytes on the volume, and their evidence totals run
    +7.0, +6.0, +5.8, +5.0, +4.8, +4.8, then +3.6 and below against a threshold
    of +7.67. The two above +5.5 are Defender's own binaries in ProgramData,
    where this feature is not offered. The highest in an offered zone is +3.6 —
    `SecureBootEncodeUEFI.exe`, `sc.exe` and `UCPDMgr.exe`, all signed Microsoft
    scheduled-task targets. +3.6 + 2.5 = +6.1 < +7.67, so THE VM STAYS AT ZERO
    FINDINGS EVEN UNDER THE ASSUMPTION THAT THE FEATURE FIRES ON EVERY
    SYSTEM-ZONE CANDIDATE IT HAS. That is the strongest statement available
    without the volume, and the bound does not depend on any file being read.

    All three of those binaries are also present on the reference laptop, where
    they were read directly, and all three carry a version resource.

WHAT IT BUYS. The plant matrix on the reference laptop, which reported 0 of 8
shapes before this row existed:

  shape                   stamped   bare
  appdata-temp-run         0.4570   0.4570
  appdata-roaming-run      0.2022   0.2022
  programdata-service      0.1581   0.1581
  programfiles-task        0.1118   0.1118
  programfiles-run         0.0778   0.0778
  downloads-selfdelete     0.1332   0.1332
  downloads-absent         0.0152   0.0152
  system32-service         0.2364   0.7904   <- REPORTED

"stamped" is a planted sample that carries a version resource; "bare" is one
that does not (`rescore --plants-lack-version-resource`). Seven of the eight are
identical in both columns, because six sit in zones where the feature is not
offered and the eighth has no bytes to read. **1 of 8, and it is the shape the
whole exercise was about** — the one the previous round proved was unreachable
by any prior or threshold. `imdsksvc.exe` is still at 0.2364 in the same run, so
the separation is 0.7904 against 0.2364 on two files that were tied.

THE WEIGHT. +2.5, and the two halves of it are not the same kind of number.
P(feature | benign) is MEASURED: 1.80%, over 27,496 files. P(feature | malicious)
is NOT measured — there is no malware corpus here and there will not be one — so
+2.5 is an expert prior, stated as the assumption it is: it is what the measured
benign rate gives if fewer than a quarter of planted binaries omit their version
resource (0.22 / 0.018 = 12.2, ln 12.2 = 2.50). The measurement on its own would
support +4.0, which is what a P(feature | malicious) of 1.0 would buy. It is
deliberately not taken.

WHAT THIS FEATURE DOES NOT ESTABLISH, stated plainly because the temptation to
overclaim here is large:

  * A version resource is fifteen lines in a `.rc` file, and copying
    `svchost.exe`'s costs an attacker nothing. This catches the sample that did
    not bother. It does not catch, and must never be described as catching, one
    that did — which is exactly why the matrix above has two columns rather than
    one, and why the harness makes the assumption a flag instead of a property
    of the plant.
  * It is not offered on managed assemblies. The rate there is not the problem
    (0 of the 135 signed managed images in the system zone lack one); the reason
    is that `mm_harvest::pe::harvest` returns `ManagedAssembly` and stops,
    because the signature arm reads that observation and nothing may arrive in
    front of it.
  * An unreadable file is not a file with its version resource stripped.
    `has_version_resource` returns `None` for anything that does not parse as a
    PE and `None` emits NO observation. This is load-bearing twice over. The VM's
    top on-volume candidate is Compact-OS compressed and the signature pass
    already records it as `not a PE image this build can parse`; and 13,648 of
    the component store's files are PA31/DCS reverse-differential payloads
    rather than PE images at all. Counting UNKNOWN as absence would have turned
    the component store's measured 1.90% into 43%, and would have invented
    13,648 findings out of Windows servicing data.
  * IT CANNOT LIFT A CANDIDATE THE PIPELINE NEVER READ. `select_for_verification`
    admits a candidate whose logit is within `max_log_lr_in_group("signature")`
    = 4.2 of the threshold, plus the top `verify_top` and the out-of-band
    admissions. This row lives in a different group, so the reachable total is
    really 4.2 + 2.5 = 6.7 and the band is 2.5 narrower than it should be. On the
    reference laptop 775 candidates sit in that gap; four of them are in an
    offered zone and measured to have no version resource, and the highest would
    reach +6.1 — still 3.67 below the threshold — so THE GAP COSTS THIS MACHINE
    NO FINDING. It would cost one on a machine where such a candidate sits above
    +7.2725. Widening the band is a change to how much of the volume gets read
    and belongs to its own measurement, not to this row; it is named here so the
    next round does not have to rediscover it. (The `packing` group's +2.8 has
    the same gap and predates this feature.)

COST. 0.092 microseconds per file, measured by `mm-harvest/examples/vercost.rs`
on bytes already in memory — version resource and entry point together, 2,000
images, twenty rounds. Scaled to the laptop's 116-file signature shortlist that
is 0.01 ms; to the shortlist plus all 861 out-of-band admissions, 0.09 ms. For
contrast, `code_sections` — the entropy histogram already in the pipeline — costs
1,075 microseconds per file on the same images, eleven thousand times more. The
claim that anything learnable from bytes already in hand is nearly free survives
being timed."""

# --------------------------------------------------------------------------
# The same absence, asked of a different population.
#
# `no_version_resource` above is conditioned on a ZONE: Windows' own build
# stamps every binary it ships, so the absence is rare in the two directories
# Windows services and ordinary everywhere else. That row took the reference
# laptop from 0 of 8 plant shapes reported to 1 of 8 -- the `system32-service`
# shape, which had been tied with ImDisk's unsigned service at exactly +8.6
# with the same three features.
#
# The other seven shapes are not in those zones, so the zone-conditioned row
# cannot reach them, and marginally the fact is worth nothing where they live:
# 19.03% of native images in Program Files carry no version resource, 31.59% in
# a user's AppData, 31.18% in a user's temp directory.
#
# This row conditions on the MACHINE instead. The question is not "is a missing
# version resource unusual here" but "is it unusual for a file this machine has
# arranged to start by itself", and the two answers are nothing like each
# other. It is the same move `persistence_targets_user_profile` made -- 22% of
# executables live in AppData, but only 1.3% of autostart entries point there --
# and this project has now measured that conditional rates beat marginal ones
# three times.
# --------------------------------------------------------------------------

[features.autostart_target_without_version_resource]
group = "binary_identity"
log_lr = 1.9
benign_rate = """
2 of 62 binaries that a clean machine starts by itself outside the two
Windows-serviced zones carry no version resource -- 3.23%. 1 of 40 on the
reference laptop, 1 of 22 on the clean VM control
"""
rationale = """
The machine has an autostart entry pointing at this file -- a service, a
scheduled task, a Run key, a Startup folder entry, Winlogon, IFEO, an LSA
package, a COM class redirection -- and the file carries no `RT_VERSION`
resource at all: no CompanyName, no ProductName, no FileVersion. Offered
everywhere EXCEPT the two zones `no_version_resource` already covers, the one
zone that has none of the conventions this row relies on, and the pseudo-zones
that name no location.

Same observation, same reader, same bytes: `mm_harvest::pe::has_version_resource`
run on the bytes the signature pass already holds. Nothing new is read and
nothing new is parsed; this row is a second question asked of an answer the
pipeline already had, and its whole content is the population it asks about.

WHAT IT IS FOR. Seven of the eight plant shapes sat at or below the reference
laptop's clean evidence ceiling, and six of the seven live in Program Files,
ProgramData or a user zone where the zone-conditioned row is not offered. A
planted dropper is registered for persistence: that is what makes it a finding
at all, and it is also the fact that puts it in a population where an unstamped
binary is rare. Somebody wrote a service registration or a scheduled task for
every benign file in this population, and whoever goes to that trouble ships a
version resource.

MEASURED, THROUGH THE SHIPPED READER, on both machines whose volumes this
project still has.

  * REFERENCE LAPTOP (`malmathic-case/report.self-excluded.json`, 17,847
    rebuilt candidates, threshold +9.79). Every candidate carrying a
    persistence observation other than a plain COM server registration: 817.
    798 still on the volume and readable; `mm_harvest::pe` answers `managed`
    for 8 and `native` for 790, and failed to parse none of them.

      zone                                    native   no version resource
      \\System32, \\SysWOW64 (existing row)       750        9     1.20%
      Program Files                               32        1     3.12%
      ProgramData                                  4        0     0.00%
      \\Windows (elsewhere)                        1        0     0.00%
      user AppData                                 3        0     0.00%
      -- the zones THIS row is offered in --      40        1     2.50%

    The one is `C:\\Program Files\\VMware\\VMware Workstation\\vmware-autostart.exe`,
    a genuine signed VMware binary, and it carries +0.50 of evidence. With this
    row it reaches +2.40 against a threshold of +9.79. NOTHING FOUND, as before.

  * CLEAN VM CONTROL (`WIN11-LAB-000004.vmdk`, the `test_6` dataset,
    2,845 candidates, threshold +7.95), read offline from the host with
    `malmathic/examples/verimage.rs` -- the image-side twin of `verpop`, same
    reader, no boot and no mount. 678 autostart-target candidates, 668 on the
    volume, 661 native, 4 managed, 3 not parsable as a PE.

      zone                                    native   no version resource
      \\System32, \\SysWOW64 (existing row)       637        1     0.16%
      Program Files                               17        1     5.88%
      ProgramData                                  4        0     0.00%
      \\Windows (elsewhere)                        1        0     0.00%
      -- the zones THIS row is offered in --      22        1     4.55%
      outside every standard zone (NOT offered)    2        1    50.00%

    The one offered is `C:\\Program Files\\BinDiff\\bin\\bindiff_config_setup.exe`
    at +0.30 of evidence, reaching +2.20 against +7.95. The `-000005.vmdk`
    ransomware image gives the identical 1 of 22 -- the two snapshots differ by
    the malware, not by their autostart population.

  * TOGETHER: 2 of 62, 3.23%.

THE ZONE THAT IS EXCLUDED, AND WHY IT IS A MEASUREMENT AND NOT A DODGE. The row
is not offered for `Zone::Other` -- anywhere outside every standard zone -- and
that exclusion costs a real detection, so it is argued from numbers:

      native images outside every standard zone, no version resource
      clean VM control (`\\Tools`, mostly FLARE-VM)   1,514 of 2,439   62.07%
      reference laptop                                     3 of    47    6.38%

    62% is the highest rate this project has measured anywhere, higher than a
    user's own profile (58.56%), because that zone is where a person unzips a
    tool by hand. The autostart conditioning does not rescue it: the same act
    that unzipped the tool wrote its scheduled task, so the two facts are not
    independent there the way they are in a directory an installer maintains.

    The file that decides this is
    `C:\\Tools\\internet_detector\\internet_detector.exe` on the clean VM
    control -- unsigned, no version resource, launched by a scheduled task, a
    name nothing else on the volume shares: +6.70 of evidence, the highest of
    any file on that machine whose bytes are on the volume, against a threshold
    of +7.95. Offering this row there at any weight above +1.25 would report it,
    and it is a FLARE-VM tool rather than malware. It is named here rather than
    quietly avoided, because it is also the honest statement of what this row
    does not catch: a dropper written to `C:\\Tools` and started by a scheduled
    task collects nothing from it.

WHAT IT BUYS, on the reference laptop, measured by injecting the absence into
the plant rather than by adding weights up. "stamped" is a planted sample that
carries a version resource; "bare" is one that does not
(`rescore --plants-lack-version-resource`), and every number is that harness's
output at the laptop's real prior of -9.7896:

  shape                   stamped     bare
  appdata-temp-run         0.4527   0.8469   <- REPORTED
  appdata-roaming-run      0.1995   0.6249   <- REPORTED
  programdata-service      0.1558   0.5524   <- REPORTED
  system32-service         0.2333   0.7876   <- REPORTED (the row above, unchanged)
  programfiles-task        0.1101   0.4527
  programfiles-run         0.0766   0.3567
  downloads-selfdelete     0.1313   0.1313
  downloads-absent         0.0149   0.0149

4 of 8, against 1 of 8 before this round, and the three new ones are three of
the seven shapes the prior study proved no threshold and no prior could reach.

The two Program Files shapes miss by 0.19 nats and the honest reading is that
the measurement does not pay for the weight that would close it: 2 of 62
supports +1.92 and no more, and +2.1 would need a P(feature | malicious) of
0.26. The two Downloads shapes are out of this row's reach in principle rather
than by a margin -- they ran once and vanished, so there are no bytes to ask the
question of and no persistence entry to condition on. Nothing in this round
reaches a file that is gone.

WHAT IT COSTS THE THREE DATASETS WHOSE ANSWER CAN BE MEASURED RATHER THAN
BOUNDED, replayed through `rescore --noversion <every measured absence>`:

  dataset                          candidates  fires on  strongest carrier  findings
  reference laptop                     17,847         1           p = 0.0006       0
  clean VM control (-000004)            2,847         1           p = 0.0032       0
  ransomware image (-000005)            2,868         1           p = 0.0031       3

The laptop's absences are the whole volume's, re-measured for this round through
the shipped reader: 151,168 files read, 6,478 absences, of which 1,058 attach to
a path the report already holds. It reproduces the figure the row above was
priced on -- 496 of 27,450 native images in the two Windows-serviced zones,
1.81% against the 1.80% recorded there -- so the reader answers today what it
answered then. The two VM datasets were read out of the `.vmdk` files with
`malmathic/examples/verimage.rs`, over every candidate path each report holds.

Run with `--zero autostart_target_without_version_resource` all three are
identical, to four decimal places and in the count of findings. This row changes
nothing on any real dataset in this tree: it fires twice in 23,562 candidates,
both times on a signed vendor binary two log-odds below anything that matters
(`vmware-autostart.exe`, `bindiff_config_setup.exe`), and the ransomware
dataset's findings are the findings it already had.

THE THREE DATASETS WHOSE VOLUME IS GONE (`test_1`, `test_2` live and WinRE,
`test_3`, `test_5` -- all one VM, serial 5f4e3d2c1b0a9988) get a BOUND instead,
and the bound is not vacuous, so it is worked rather than asserted. Assume the
absence is true of EVERY candidate the row could be offered to -- 81 on
`test_1`, 27 on `test_2` live, 26 on the WinRE run and on `test_3`, 27 on
`test_5`:

  dataset            offered  findings, row zeroed  findings, absence assumed
  test_1                  81                     0                          3
  test_2 live             27                     0                          1
  test_2 WinRE            26                     0                          0
  test_3                  26                     0                          0
  test_5 (njRAT)          27                     1                          1

So the assumption is load-bearing on two of them, and it is FALSE, checked file
by file. The six candidates that cross are Windows Defender's platform binaries
(`MpDefenderCoreService.exe`, `MsMpEng.exe`, `NisSrv.exe`, `MpCmdRun.exe`),
Google's `updater.exe`, and Chromium's `elevation_service.exe`. Every one of the
six is a shipping build of a product that is also on the reference laptop, where
its bytes were read directly this round, and every one of the six carries a
version resource -- the Defender four at 0 of 4, `updater.exe` in both its
machine-wide and per-user installs, and `elevation_service.exe` in the Edge
build of the same Chromium source. The four Defender binaries are also on the
clean VM control, read out of the image, and carry one there too.

That is a weaker statement than a measurement on those volumes and it is
labelled as one. What it establishes is that the two datasets which the bound
cannot clear are cleared by reading the same six products somewhere else.

THE WEIGHT. +1.9, and the two halves are not the same kind of number.
P(feature | benign) is MEASURED at 3.23% over 62 files. P(feature | malicious)
is NOT measured -- there is no malware corpus here and there will not be one --
so +1.9 is an expert prior stated as the assumption it is: it is what the
measured rate gives if fewer than a quarter of planted binaries omit their
version resource (0.22 / 0.0323 = 6.81, ln 6.81 = 1.92). It is the SAME
assumption `no_version_resource` above already makes, deliberately, so that the
two rows differ only in the population they were measured over.

  * The measurement alone would support +3.43 at a P(feature | malicious) of
    1.0, and the clean datasets would afford far more than that: the strongest
    clean candidate that fires this row anywhere is +0.50, so the weight could
    have been +9.2 on the laptop and +7.6 on the VM before either machine
    reported anything. The binding constraint is the denominator, not the
    ceiling. 62 is a thin denominator and this row is worth revisiting on the
    first machine that adds to it.
  * A wider denominator was measured and NOT used. Counting plain COM server
    registrations as well takes it to 3 of 219 (1.37%), which would support
    +2.78 and would carry the two Program Files shapes over the bar. It is
    refused because 157 of those 219 are shell extensions and preview handlers
    that the pipeline DEFERS -- they never become candidates, so they cannot
    fire this row, and pricing a row on a population it never meets is exactly
    the flattery the benign-rate rule exists to stop.

WHAT IT DOES NOT ESTABLISH.

  * A version resource is fifteen lines in a `.rc` file. This catches the
    sample that did not bother, and never the one that did. That is why the
    plant matrix is run in two columns -- a stamped plant and a bare one -- and
    why the assumption is a flag on the harness rather than a property of the
    plant.
  * It is not offered on managed assemblies, for the same mechanical reason the
    zone-conditioned row is not: `mm_harvest::pe::harvest` returns
    `ManagedAssembly` and stops, so no `NoVersionResource` observation is ever
    produced for one. 8 of the laptop's 798 autostart targets are managed --
    including `Discord\\Update.exe` and `EtwHostServiceUpdater.exe`, the two
    strongest clean on-disk candidates in a user zone -- and none of them can
    fire this row.
  * UNKNOWN is not absence. A file whose bytes could not be produced, or which
    does not parse as a PE, emits no observation at all. 3 of the VM's
    autostart targets are `.bat` files and answer `None`.
  * IT CANNOT LIFT A CANDIDATE THE PIPELINE NEVER READ, and the gap is the same
    one `no_version_resource` records: `select_for_verification` admits a
    candidate within `max_log_lr_in_group("signature")` = 4.2 of the threshold,
    and this row lives in a different group, so the reachable total is 4.2 +
    1.9 = 6.1 and the band is 1.9 narrower than it should be. Every plant shape
    this row is meant to reach carries +7.7 or more and is inside the band; the
    two clean files it fires on carry +0.50 and +0.30 and are far outside it,
    which is why they were measured by reading them directly rather than by
    replaying a report.
"""

