Scored at almost nothing, because this is not a hijack. It is how every shell
extension, preview handler and context-menu entry on Windows is installed:
6,673 machine-wide registrations on a clean VM, 11,112 on a clean laptop.

It was 5.7 until a healthy Windows 11 machine was scanned: PowerToys, Discord,
A VPN client and a Java runtime took thirteen of the eighteen reported findings
