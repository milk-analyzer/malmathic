# Evidence weights for malmathic.
#
# Each entry is a log-likelihood ratio:
#
#     log_lr = ln( P(feature | file is the malicious sample)
#                / P(feature | file is benign) )
#
# Positive values incriminate, negative values exonerate. Because log-odds are
# additive, every value here means the same thing regardless of what else fires,
# and each one can be argued about on its own. That is the point of the format:
# these numbers are meant to be challenged, edited, and eventually replaced.
#
# ---------------------------------------------------------------------------
# HONESTY NOTE — read before trusting a probability this file produces.
#
# These values are EXPERT PRIORS, not measurements. They were reasoned from
# published incident-response experience and from how often each condition holds
# on ordinary Windows installs. They have NOT been calibrated against a labelled
# corpus. A reported 0.9 therefore means "the evidence here is about as strong
# as the author judged a 0.9 to be", not "nine out of ten such files were
# malicious in a study".
#
# Replacing this table with values fitted to a corpus of clean installs plus
# malware sets requires no code change — only this file. Until that happens, the
# reasoning shown next to each score matters more than the score.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# BENIGN RATE. Every row carries a `benign_rate` field, and the table does not
# parse without one. It is the DENOMINATOR of the ratio the `log_lr` claims to
# be: P(feature | benign), stated as absolute counts over a named population.
#
# The numerator is an expert prior almost everywhere, and the note above says
# so. That is honest. What was not honest, and went unnoticed for the whole
# life of this file, is a row whose denominator nobody had ever counted:
# `pe_structural_anomaly` carried three sentences of description, no benign
# rate and no population, while sitting one harvester change away from paying
# +2.8 to whatever fired it. It was found by reading the file. Nothing failed.
#
# So the field is required rather than encouraged, and it takes one of exactly
# two shapes, which `mm_score::weights::check_benign_rate` enforces:
#
#   * a measurement, which must contain digits;
#   * `UNMEASURED: <what would have to be counted, and why it was not>`.
#
# `UNMEASURED` is a legitimate answer — seven rows use it, and each says what
# would close it. Silence is not an answer, and a sentence with no number in it
# is a description rather than a denominator.
#
# A row that nothing in the tree can produce is a separate hazard and has a
# separate guard: see PRODUCERLESS in `mm-score/src/weights.rs`.
# ---------------------------------------------------------------------------
#
# GROUPS. Naive Bayes assumes features are conditionally independent, and these
# are not: "unsigned" and "unsigned executable in a temp directory" describe one
# fact twice, and adding both would double-count it into false confidence. Every
# feature therefore names a group, and scoring emits at most ONE feature per
# group — whichever applies most specifically. Groups are how this table stays
# honest about its own assumption.
#
# ---------------------------------------------------------------------------
# WHICH CLEAN DATASET A RATIONALE HERE MAY QUOTE — added 2026-08-24,
# RE-MEASURED 2026-08-26.
#
# READ THIS FIRST. The block below used to state populations that had stopped
# being true, and because every rationale in this file inherits its authority
# from here, fourteen of the fifty-six rows below still quote denominators from
# machines that no longer exist. That is not a cosmetic problem. A weight
# argued against "0.67 log-odds of headroom" was argued against 2.5x more room
# than the machine actually has, and one weight — `quarantined_by_av` at +8.0 —
# had quietly become able to convict a file on its own on every VM dataset in
# the tree while a test asserted that it could not. See
# `mm-score/src/machine.rs` for that whole account.
#
# So: THE POPULATIONS BELOW ARE MEASURED, DATED, AND CHECKED BY A TEST.
# `mm-score/tests/measured_machines.rs` opens each of these reports and fails
# if the counts here drift from the files on disk.
#
# Six reports back the numbers in this file. Every one was re-measured on
# 2026-08-26 with `cargo run --release --example rescore -- <report>`, which
# rebuilds the candidate graph under TODAY's admission rules. Two columns
# matter and they are not the same number: "as written" is what the file on
# disk records, "rebuilt" is what a re-run produces now.
#
#   report                                     as written        rebuilt      ceiling
#   malmathic-case/report.self-excluded.json   19,270 / -9.9166  17,847 / -9.7896  0.2333
#                                              USE THIS ONE for a laptop figure.
#                                              Ceiling is %SystemRoot%\system32#                                              imdsksvc.exe, ImDisk's unsigned service.
#   malmathic-case/report.json                 20,263 / -9.9166  18,840 / -9.8437  0.2604
#                                              CONTAMINATED — see below — and
#                                              DESTROYED 2026-08-27: an --image
#                                              run with no --out defaulted its
#                                              case directory into this
#                                              repository and wrote over it.
#                                              The row is a record of what was
#                                              measured, not a re-runnable one.
#                                              `cargo run --example rescore`
#                                              cannot reproduce it and neither
#                                              can the laptop: it has been used
#                                              since. Nothing in this file rests
#                                              on the row; every laptop figure
#                                              quoted below is from the
#                                              self-excluded file above.
#   VM_TESTS/test_1/report.json                 3,744 / -8.2279   2,256 / -7.7213  0.3271
#   VM_TESTS/test_2/live/report.json            2,256 / -7.7213   2,256 / -7.7213  0.2458
#   VM_TESTS/test_2/winre/report.json           2,371 / -7.7711   2,371 / -7.7711  0.4326
#   VM_TESTS/test_3/report.json                 2,448 / -7.8047   2,448 / -7.8030  0.2309
#   VM_TESTS/test_4/report.json                 2,412 / -7.7899   2,412 / -7.7882  0.9990
#                                              NOT CLEAN — njRAT planted, 2 findings.
#
# THE DIRECTION OF TRAVEL, WHICH IS THE THING TO INTERNALISE. test_1 was
# written at 3,744 candidates and rebuilds to 2,256. Deferring ordinary COM
# registrations did that. Separating deleted wreckage from lost files did the
# same to the laptop. EVERY IMPROVEMENT TO THIS TOOL MAKES THE MACHINES
# SMALLER, a smaller machine has a HIGHER prior, and a higher prior means LESS
# ROOM under every weight in this file. A rationale that quotes a headroom is
# quoting a number that shrinks without anyone touching it.
#
# The thinnest clean headroom in the tree today is 0.2711 — AM_Delta.exe on
# VM_TESTS/test_2/winre, carrying +7.5 against that machine's -7.7711. Several
# rationales below still say the thinnest is 0.669 or "exactly 7.67 - 7.0 =
# 0.67". Those are dead and are marked where they appear.
#
# WHERE THE PRIOR COMES FROM, EXACTLY. `prior = -ln(effective population)`, and
# the effective population is NOT always the candidate count:
#   * `Enumeration::effective_population` is `admitted + files_lost`, so
#     test_3 lists 2,448 candidates and priors over 2,452;
#   * report.self-excluded.json had 993 of this project's own build artefacts
#     removed AFTER scoring, so it lists 19,270 and priors over 20,263.
#
# THE FLOOR. No guard in this tree may assume a machine larger than
# `mm_score::machine::SMALLEST_MACHINE` — 750 candidates, ln = 6.6201. It is
# measured, not rounded: two independent degradations of a real volume both
# bottom out there (765 with every hive dead, 753 with everything BUT the hives
# dead), and 750 sits just above e^6.6 = 735, the population at which the clean
# VM's own strongest innocent stack reaches even odds. A row whose weight
# exceeds `ln(750) - 1.0 = 5.6201` can convict a file with no corroboration
# beyond one row that fires on a third of the volume, and `Weights::parse`
# REFUSES TO LOAD THE TABLE unless such a row carries a `convicts_alone` field
# saying why. Three rows do: `persistence_ifeo`, `unbacked_executable_memory`
# and `system_binary_name_outside_system_dir`.
#
# THE CONTAMINATION. The reference laptop is the machine malmathic is DEVELOPED
# on. 993 of its candidates (5.4%) are this project's own build output: 847 in
# the agents' scratchpad under
# AppData\Local\Temp under the agent harness's scratch directory, 146 in the
# repository's own target\ directories. They held ranks 1, 2 and 4 of the
# rescored ranking — two harness binaries at 0.2636 and one at 0.1065 — which
# means the "ceiling of a clean Windows machine" that several rationales below
# were argued against was partly a `cargo build`.
#
# A rationale that quotes a laptop ceiling, a headroom, or a candidate count
# must take it from the self-excluded file. Where a rationale below still
# quotes the contaminated number, it says so and gives the clean one beside it.
# ---------------------------------------------------------------------------

[meta]
version = 1
calibrated = false

# --------------------------------------------------------------------------
# Anti-virus already had an opinion
# --------------------------------------------------------------------------

[features.quarantined_by_av]
group = "antivirus"
log_lr = 5.0
benign_rate = """
0 of 17,847 rebuilt laptop candidates, 0 of 2,256 (VM live), 0 of 2,371
(VM WinRE) and 0 of 2,448 (VM clean, test_3). It fires on exactly 1 of
2,412 on VM_TESTS/test_4, and that one is the njRAT sample. Re-measured
2026-08-26 through rescore; the rate has never been seen above zero on a
clean machine, which bounds it below 1 in 17,847 and establishes nothing
about its size
"""
rationale = """
Defender quarantined this exact file. An AV product committing to a detection
and then ACTING on it is the strongest single signal available offline, and it
is rarely wrong in the incriminating direction.

WHY 5.0 AND NOT 8.0. It carried 8.0 until 2026-08-26, and at 8.0 it convicted
alone. The threshold is even odds, so `an AV verdict alone cannot convict` is
exactly `log_lr < ln(N)`; 8.0 demands a machine of more than e^8 = 2,981
candidates, and no machine in this tree except the laptop reaches that. Measured
on the reports as they stand, a single quarantine entry with NO other evidence
scored 0.5692 (VM live), 0.5570 (VM WinRE), 0.5523 (test_4) and 0.5487
(test_3). A resolved past detection was a present accusation on every VM
dataset.

The guard that was supposed to stop this was green throughout, because it
compared against a prior of -8.22 taken from a 3,744-candidate run that no
longer existed. Every improvement to the admission rules had made the machine
smaller and the prior higher, and nobody re-read the guard. That story is
written out in `mm-score/src/machine.rs`, and the bound is now derived from
`SMALLEST_MACHINE` rather than remembered.

WHAT 5.0 BUYS. The property holds on any machine above e^5 = 149 candidates
alone, and above e^(5+1) = 404 when the file also carries
`name_unique_on_machine` (+1.0) — the realistic companion, since it fires on a
third of every VM volume. Against the 750-candidate floor that is 0.62 of
headroom.

WHAT 5.0 COSTS, MEASURED RATHER THAN ESTIMATED. On VM_TESTS/test_4 the
quarantined njRAT copy in Downloads also carries `random_looking_name` (+2.4),
`executable_rare_for_zone_on_this_machine` (+2.2), `unsigned_in_user_zone`
(+1.1) and `name_unique_on_machine` (+1.0) — +6.7 of evidence that is not this
row. Against that machine's prior of -7.7882 the break-even weight for this row
is 7.7882 - 6.7 = 1.0882, so the whole band 1.09 < w < 6.62 keeps the finding.
The measured cost of 8.0 -> 5.0 is that this file moves from p = 0.9990 to
p = 0.9804 and from rank 1 to rank 2, behind `C:\\Windows\\TEMP\\server.exe`
(0.9973), which carries no AV row at all. Both njRAT findings survive; nothing
on any clean dataset moves, because the row fires on nothing there.

It stops short of certainty because we are ranking which file is THE sample, and
quarantined items include long-resolved past infections unrelated to the
incident at hand. That is the reason the number is bounded at all, and it is the
user's framing of this whole feature: an antivirus verdict is a hint, not a
verdict."""

[features.av_detection_logged]
group = "antivirus"
log_lr = 2.5
benign_rate = """
4 distinct file paths out of 267 Defender detection events in the
reference machine's 9,764-record log; 3 of those 4 are false positives
against software the user chose to have, and 0 became candidates on the
volume under analysis. Re-checked 2026-08-26: the row fires on 0 of
17,847 laptop, 0 of 2,256, 0 of 2,371, 0 of 2,448 and 0 of 2,412 VM
candidates — its firing behaviour on real data is therefore entirely
unmeasured, and the four files above come from a Defender event log
rather than from any report in this tree
"""
rationale = """
Defender's own event log names this file as a threat and does NOT record having
dealt with it — a 1116 detection with no remediation, or a 1118/1119 where the
remediation was attempted and failed. Unlike `quarantined_by_av` this says the
file may still be sitting where it was, which is the more actionable of the two
and the less certain.

MEASURED, on the reference machine's real 10 MB log:

  9,764 records
    267 detection events (261x 1116, 6x 1117, and zero 1118/1119)
      4 distinct file paths, after locator parsing
      1 of those 4 still exists anywhere
      0 candidates on the volume under analysis

Each narrowing is a different trap. 253 of the 267 events are detections INSIDE
one Kali Linux ISO the user downloaded on purpose, and 2 more name a command
line rather than a file — `powershell.exe`, which Defender removed as
`Trojan:Win32/PowhidSubExec.B`. Reading the `Path` field as a path would have
handed a signed Microsoft binary an AV conviction. The harvester's module docs
carry that arithmetic.

Of the four files that survive, three are Defender false positives against
software the user chose to have: `capa-v9.4.0-windows.zip` (the FLARE analysis
tool) flagged `Trojan:Win32/Suschil!rfn`, its `.crdownload` partial, and a
`sample.apk`. So on a clean machine three of the four files Defender named are
benign. "An AV product committed to a detection" is not the ~1.0-precision
signal it sounds like.

WHY 2.5 AND NOT 4.5. That measurement is the argument, and for a long time this
row did not follow it. A signal whose observed precision on the only machine it
was ever measured against is one in four does not support a likelihood ratio of
e^4.5 = 90:1. 2.5 is e^2.5 = 12:1, which is still real evidence and still says
"Defender named this file", without pricing a FLARE tool and a deliberately
downloaded APK at ninety to one. It sits 2.5 below `quarantined_by_av` (5.0)
rather than the 0.5 it would have had if only the quarantine row had been
brought down, so the ordering the test below asserts keeps real margin instead
of surviving on a rounding.

Lowering it costs nothing measurable: the row fires on zero candidates in all
six reports in this tree, so there is no dataset on which the change moves a
score.

The last step from 1 to 0 is the pipeline's, not this table's: the one file that
still exists is on drive W:, and `defer_defender_log` in `pipeline.rs` refuses to
let a log entry introduce a candidate the volume under analysis does not
independently have. The log corroborates; it does not introduce.

Even without that, 2.5 cannot convict alone, and this is now said in a way that
cannot go stale. The threshold is even odds, so the property is exactly
`log_lr < ln(N)`; asserted against `mm_score::machine::SMALLEST_MACHINE` — 750
candidates, ln = 6.6201 — less the +1.0 companion row that fires on a third of
every volume, the ceiling is 5.6201 and this row sits 3.12 below it.

The previous version of this paragraph quoted priors of -9.92 and -8.23 as the
two clean datasets. Both were dead: the laptop rebuilds to -9.7896 and the VM to
-7.7213, and the -8.23 was a 3,744-candidate run that the COM deferral had long
since replaced. `no_single_av_verdict_can_convict_on_its_own` in
`mm-score/src/features.rs` was comparing against that dead number and passing.
It now derives its bound from `SMALLEST_MACHINE` and additionally checks every
dataset in the tree, and `Weights::parse` refuses to load a table where any row
exceeds the ceiling without a `convicts_alone` justification — so this cannot
rot again by standing still.

1118/1119 — a threat Defender could not remove — is the strongest sub-case here
and is deliberately NOT given a weight of its own. Neither clean dataset holds a
single 1118 or 1119 event, so any number chosen for it would be an unmeasured
guess, and unmeasured guesses about features nobody has seen fire is precisely
how this project acquired its false-positive history. It folds into this entry,
which makes the same claim: named, and still there."""

# For the record, since this entry was once deleted for being unproducible:
# `av_detection_logged` (5.5) was removed when no offline route to a Defender
# detection existed, and came back with the EVTX pass in
# `mm-harvest/src/defender_log.rs`. The other route considered and still
# rejected is `\ProgramData\Microsoft\Windows Defender\Support\MPLog-*.log`:
# plain text, reachable by a raw-NTFS read regardless of its ACL, but the format
# is undocumented — reverse-engineered, versioned with the Defender platform and
# known to change between releases. This project's rule is that parsers are
# written against a specification, and there is none. The event log is
# documented, stable, and the route every other DFIR tool uses.

# --------------------------------------------------------------------------
# Signature — the main defence against drowning the report in system files
# --------------------------------------------------------------------------

[features.signed_microsoft_catalog]
group = "signature"
log_lr = -6.7
benign_rate = """
4,717 of 4,719 catalog-signed System32 images chain to a Microsoft root on
the reference laptop
"""
rationale = """
Catalog-signed by a catalog that itself chains to a MICROSOFT root. Most of
System32 is signed this way rather than with an embedded signature, so a scoring
engine that only understands embedded signatures reports half of Windows as
unsigned and buries the real finding. This is the single most important negative
weight in the table.

The "chains to a Microsoft root" qualifier is load-bearing and was not always
checked. CatRoot holds third-party OEM driver catalogs alongside Microsoft's own
— on the reference machine, 4,717 of 4,719 catalogs are Microsoft's and exactly
two are not (ManyCam's oem36.cat, OpenVPN's oem40.cat). Handing those two this
weight would let anyone who can get a catalog into CatRoot buy Microsoft-strength
exoneration for a binary; they collect signed_trusted_publisher instead."""

[features.signed_trusted_publisher]
group = "signature"
log_lr = -3.9
benign_rate = """
UNMEASURED: the exonerating direction has no denominator. 83 of the laptop
case file's 113 recorded signature verdicts and 98 of the VM's 227 are
EmbeddedValid, but that is the rate among the handful of candidates whose
bytes the signature pass actually read, not among benign files, and -3.9
was derived from neither
"""
rationale = """
Valid Authenticode chaining to a trusted root that is not Microsoft's — either an
embedded signature, or a catalog signed by a third party. Strongly exonerating,
but deliberately weaker than the Microsoft case: signing certificates are stolen
and abused, and signed malware is a well-established category."""

[features.signature_invalid]
group = "signature"
log_lr = 4.2
benign_rate = """
0 of the 113 signature verdicts recorded in the laptop case file and 0 of
the 227 in the VM case file are a tampered or malformed PKCS#7. The 3
laptop and 4 VM Unknown verdicts are the `signature_unverifiable` row, not
this one
"""
rationale = """
TAMPERING, and now only tampering. The file's Authenticode hash disagrees with
the one inside the signature, the PKCS#7 is malformed, a signed attribute does
not bind the signature to its content, or a link in the chain carries a
signature that its stated issuer did not produce. Every one of those is a claim
about THE FILE that the tool established by arithmetic it performed itself.
Benign software essentially never ships in that state: it means the bytes were
modified after signing, or a certificate was stapled on to make an unsigned file
look signed to a casual glance.

MEASURED, reference laptop, 29,629 PE files under System32, SysWOW64 and both
Program Files trees: exactly ONE. `Program Files (x86)\\Nox\\bin\\Qt5Core.dll`,
SHA-1 Authenticode hash mismatch. 1 in 29,629 is 3.4e-5, so the largest value
any assumption about malware can produce here is ln(1 / 3.4e-5) = 10.3. +4.2 is
well inside that; the number is left where it was.

WHAT THIS ROW NO LONGER COVERS, and why that was the defect. It used to also
score `SignatureStatus::Untrusted` — a signature that verifies perfectly whose
chain ends at a certificate authority this build does not carry. That is not a
statement about the file. It is a statement about `mm-sign/src/trust.rs`, which
holds 18 roots exported from ONE Windows 11 build 26100 machine. Windows itself
does not ship every root — it fetches them on demand through the AuthRoot
program — so "we do not have that root" is the NORMAL state for any CA a given
machine has not met: an enterprise internal authority, a regional CA, a public
root newer than the export, a cross-signed intermediate whose root rotated. On a
corporate estate, where internally-signed tooling is routine, +4.2 on every one
of them is not one false positive but a report made of them. Measured, an
otherwise ordinary binary with an untrusted chain scored 0.9935.

The two shapes that arrive as `Untrusted` are now told apart and priced
separately: `signature_self_signed` below, and — for a chain to an unrecognised
CA — the same zone-dependent `unsigned_*` rows an unsigned file gets, because
"no trusted signature exists for this file" is precisely and only what both
establish. Both clean machines carry the untrusted-chain shape ZERO times in the
directories Windows owns; all four instances on the reference laptop are in
`Program Files (x86)`.

MEASURED IN BOTH DIRECTIONS, 2026-08-24, `examples/rescore.rs --signatures`.

  (a) THE REAL VERDICTS. The four `Untrusted` binaries the reference laptop
      actually has — `Program Files (x86)\\Nox\\bin\\{nox-tool,nvapi,portCheck,
      unzipcomplete}.exe`, NoxPlayer, signed by Duodian Online Technology under
      Certification Authority of WoSign — go from 0.0038 to 0.0006. The one
      genuine tampering finding on the same machine, `Nox\\bin\\Qt5Core.dll`
      (SHA-1 Authenticode hash mismatch), stays at 0.0038. Both clean datasets
      still report NOTHING: laptop 17,544 candidates, prior -9.7725, strongest
      0.2364; VM 2,143 candidates, prior -7.6700, strongest 0.3385. Identical to
      the run before this change, because neither report carries an `Untrusted`
      verdict of its own — which is exactly why the bound below matters.

  (b) THE CORPORATE ESTATE, as a bound nothing can exceed: EVERY candidate on
      each dataset declared signed by an authority this build does not carry.

          machine   old (+4.2)                 new (zone rows)
          laptop    46 at/over 0.50, max .8736    1 at/over 0.50, max .5333
          VM       171 at/over 0.50, max .9597   98 at/over 0.50, max .9597

      The laptop's worst case under the old row was `SamsungMagician.exe` at
      0.8736 — a scheduled task, a real vendor, and an accusation of tampering.
      The new column is not a new exposure either: it is EXACTLY the
      "everything unsigned" bound already recorded against
      `unsigned_in_system_zone` (1 and 98), because that is now the same code
      path. The tool's worst case did not grow; one way of reaching it was
      removed.

THE VERIFICATION BAND DOES NOT MOVE. `pipeline::select_for_verification` reads
`max_log_lr_in_group("signature")`, which is 4.2 before and after — this row
kept it, and `unsigned_in_system_zone` sits on it too. Not one extra file is
read or hashed.

Deliberately NOT used for an expired certificate either — see signature_expired,
which is a different claim about a different failure."""

[features.signature_self_signed]
group = "signature"
log_lr = 2.6
benign_rate = """
0 of the 113 signature verdicts recorded in the laptop case file and 0 of
the 227 in the VM case file terminate at their own signing certificate
"""
rationale = """
The signature verifies and the chain is ONE CERTIFICATE LONG: issuer equal to
subject, the signing certificate its own authority. The signer vouched for
himself and nothing outside the file vouches for him.

THIS IS THE HALF OF THE OLD `signature_invalid` THAT WAS A REAL FINDING, and the
distinction is available offline, which is the only reason it can be made at
all. `verify.rs` already builds the chain and already knows how long it got;
`ChainResult::SelfSignedTop` now carries `self_signed_leaf`, true exactly when
the self-issued certificate the walk terminated at IS the leaf. A `makecert`
dropper is one certificate deep. An enterprise internal CA is two or three, with
a distinct root the walk reached through an intermediate. Those are different
observables and the tool can see which it has.

WHY +2.6 AND NOT +4.2. Measured, reference laptop, 29,629 PE files: ZERO
self-signed leaves. A zero-event observation cannot set a weight, only bound it
— the rule of three gives a 95% upper bound of 3/29,629 = 1.0e-4 on the benign
rate, which would license anything up to ln(1/1.0e-4) = 9.2, a number no
measurement here supports. And that census is from a consumer laptop; the
population this row must not libel is the corporate one, where a line-of-business
application signed with a self-signed certificate pushed into Trusted Publishers
is a real, dull thing. So the denominator is deliberately assumed an order of
magnitude worse than anything measured — 1e-3, one binary in a thousand
self-signed benignly — against P(self-signed | malicious) of roughly 0.015, most
malware being unsigned rather than self-signed. ln(0.015 / 0.001) = 2.7. +2.6.

IT CANNOT BE A DISCOUNT. `set.offer` keeps one member per group, and the
untrusted path offers this row AND the zone-appropriate `unsigned_*` row, so the
score is the stronger of the two. A dropper in System32 cannot buy its way out
of `unsigned_in_system_zone` (+4.2) by stapling on a self-signed certificate —
it still collects 4.2. In a user zone it collects 2.6 rather than the 1.1 an
unsigned file gets, which is the increment self-signing actually earns.

BELOW `signature_invalid` (+4.2) ON PURPOSE, so the signature group's maximum
does not move and `pipeline::select_for_verification` reads exactly the same set
of files it read before. The wall-clock cost of this whole change is zero."""

[features.signature_expired]
group = "signature"
log_lr = 1.2
benign_rate = """
UNMEASURED: how often a benign signature is expired AND carries no
countersignature. Neither case file records the sub-case apart from the
valid one -- all 108 laptop and 223 VM valid verdicts are undifferentiated
-- and the machine's certificate store was never censused for expiry
"""
rationale = """
The signature is cryptographically sound and chains to a trusted root, but the
signing certificate was outside its validity window at the moment of signing and
no countersignature establishes otherwise.

This used to be scored as signature_invalid (+4.2), which was wrong twice over.
It is not a tampering claim: the bytes match the signature and the publisher is
established. And once certificate validity is evaluated at the COUNTERSIGNED
signing time rather than at "now" — which is what mm-sign does, and what the
design document calls the single largest trap in this work — the state stops
being common. Measured over 29,629 signed binaries on the reference machine, an
early build that checked against "now" reported 17,383 of them Expired (47.5%,
exactly as the document predicted); checking against the timestamp brought that
to 2. Both survivors were legitimate third-party software with a SHA-1 signature,
no countersignature of any kind, and a leaf that lapsed in 2020 — old, not
malicious. PowerShell's Get-AuthenticodeSignature declined to decide on both.

So the value is low and positive: mildly odd, worth showing an analyst, nowhere
near an accusation. Note this is also what an expired CATALOG produces, where the
lapsed certificate belongs to a third party's list rather than to the file."""

[features.signature_unverifiable]
group = "signature"
log_lr = 0.0
benign_rate = """
3 of the 113 signature verdicts recorded in the laptop case file and 4 of
the 227 in the VM case file. Weighted at exactly 0.0, so the rate cannot
move a score in either direction
"""
rationale = """
The signature check did not complete — the certificate chain ran out below the
embedded trust store, the file is not a PE this build can parse, or CatRoot could
not be read. Scored at EXACTLY ZERO, on purpose, and present in the table only so
that the report can say we looked and could not tell.

Failure to verify is not evidence in either direction. Reporting it as "unsigned"
would put +3.4 on every file in System32 the moment a damaged or malware-deleted
CatRoot made the catalog index unusable; reporting it as "signed" would exonerate
on the strength of a check that never ran. Both are worse than saying nothing,
which is what this weight does. It exists as a row rather than as silence because
an analyst reading a candidate needs to see the difference between "no signature"
and "we could not check"."""

[features.unsigned_in_system_zone]
group = "signature"
log_lr = 4.2
benign_rate = """
15 of 28,260 native PE images under \\Windows are unsigned on the
reference laptop, 0.053%
"""
rationale = """
Unsigned, native, and in one of the directories Windows itself owns: `System32`,
`SysWOW64`, the `WinSxS` component store, or `\\Windows` generally. Practically
everything shipped there is signed, so an unsigned native image there is
genuinely out of place.

ALSO CARRIES THE UNTRUSTED-CHAIN POPULATION, since `signature_invalid` stopped
doing so. The claim this row rests on is "no trusted signature exists for a
native image in a directory where essentially everything is catalog-signed", and
that is established equally by a file with no signature and by a file whose
chain ends at an authority this build does not carry. Pooling costs nothing
measurable: the untrusted-chain count in these directories is 0 on both clean
machines — all four instances on the reference laptop are in
`Program Files (x86)` — so the benign rate stays 15 of 28,260. The wording
`features.rs` emits differs, because saying "unsigned" about a signed file would
be a false sentence in the report.

WHY THIS IS NO LONGER ONE ROW WITH PROGRAM FILES. Until now a single
`unsigned_in_conventional_zone` at +3.4 spanned both, and the two benign
populations were measured to differ by three hundred and sixty times.

MEASURED, reference laptop, live, 2026-08-24. Every `.exe/.dll/.sys/.scr/.cpl/
.ocx` under each root — 73,468 files — verified by `mm-sign` against the
machine's own `CatRoot` (`mm-sign/examples/unsignedpop.rs`), and split by
whether the PE declares a COM descriptor in data directory 14, because a
managed assembly is strong-named rather than Authenticode-signed and is priced
by `unsigned_managed_assembly` instead:

    zone                       native   unsigned      rate     managed  unsigned
    System32                    6,150          5    0.081%          95         0
    SysWOW64                    3,000          7    0.233%          40         0
    WinSxS                     18,254          3    0.016%       1,465         3
    \\Windows\\Microsoft.NET        183          0    0.000%       1,421         0
    \\Windows\\assembly (GAC)         -          -         -       1,318     1,303
    \\Windows other                673          0    0.000%          12         0
    ---- THIS ROW              28,260         15    0.053%
    Program Files               7,014      1,837   26.190%      10,547       399
    Program Files (x86)         3,508        174    4.960%       5,955       416
    ---- the other row         10,522      2,011   19.113%

`ln(0.19113 / 0.00053) = 5.89`. One number cannot be right for both: it was too
low where the evidence is strong and, against a 19% benign rate, higher than any
probability can produce where it is weak.

Undecided files are excluded from the denominators rather than counted either
way — 23 in `System32`, 20 in `SysWOW64`, 142 under Program Files, all
`Unknown`, all weighted at exactly zero — and so are the 13,638 `WinSxS` images
this unelevated walk could not open at all. Unknown is not a claim in a census
either.

THREE OF THE FIFTEEN ARE THE VERIFIER'S OWN ERROR, which is worth knowing before
raising a weight that pays for its verdicts. All fifteen were re-checked against
the OS, which consults the same `CatRoot`: the twelve in `System32`/`SysWOW64`
came back `NotSigned`, confirmed; the three in `WinSxS` — `crtdll.dll`,
`expsrv.dll`, `vbajet32.dll`, all old x86 side-by-side components — came back
`Valid`. `mm-sign` calls three catalog-signed files unsigned, 0.011% of this
population. The true rate for the row is 12/28,260 = 0.042%; the rate the tool
will act on is 0.053%; the higher of the two is what this number is set from.

WHAT THE TWELVE ACTUALLY ARE, because composition decides whether a tail is
evidence or a benign mechanism firing at scale. Five are Microsoft's own D3D and
DXGI debug layers in `SysWOW64`, which ship unsigned. Five are ImDisk, a
third-party virtual disk driver that installs `imdisk.exe`, `imdisk.cpl` and
`imdsksvc.exe` straight into `System32`. Two are OpenSSL's `libcrypto-3-x64.dll`
and `libssl-3-x64.dll`. Three sources, not a mechanism.

WHY +4.2 AND NOT THE 7.2 THE BASE RATE SUPPORTS. `ln(0.7 / 0.00053) = 7.2`, and
two measurements cap it well below that.

* THE IMDISK CEILING, which is the real bound. `%SystemRoot%\\system32\\imdsksvc.exe`
  is on the reference laptop: unsigned, native, and registered as a service. Its
  evidence vector is `persistence_service +3.4`, this row, and
  `name_unique_on_machine +1.0` — which is, feature for feature, the
  side-loaded-DLL-as-a-service cell of `examples/planted.rs`. Nothing available
  offline separates a benign one from a planted one. It crosses 0.50 when
  `prior + 4.4 + this row >= 0`, so a machine reports it whenever it has fewer
  than `e^(4.4 + this row)` candidates: 2,441 at +3.4, 5,432 at +4.2, 8,103 at
  +4.6, 17,544 — the reference laptop itself — at +5.37. The laptop stays
  clean at +4.2: `imdsksvc.exe` goes 0.1163 -> 0.2364 and is the machine's
  strongest candidate of any kind. The VM, at 2,143 candidates, would have
  reported such a file at +3.4 already. Above +4.2 the added exposure buys less
  than it costs.

  RESTATED ON A CLEAN DATASET, 2026-08-24. The two figures above used to read
  `18,537 ... at +5.43` and `0.1163 -> 0.2266 ... strongest system-directory
  candidate`, from `malmathic-case/report.json` — a run of the reference laptop
  that carried 993 candidates belonging to this project's own build tree, two of
  which sat ABOVE `imdsksvc.exe` in the ranking. (That file was destroyed on
  2026-08-27 and cannot be re-read; the superseded figures are left here as the
  record of what was retracted, not as something to check.) Excluding them
  (`report.self-excluded.json`) leaves 17,544 rebuilt candidates and a prior of
  -9.7725, so the break-even weight falls from 5.43 to 5.37 and this file's
  score rises from 0.2266 to 0.2364 — a smaller machine scores everything on it
  slightly higher. The decision is unaffected in both directions and the
  constraint got CLEARER, not weaker: with the contamination gone, the file this
  weight is set by is the top of the clean machine, so the ceiling and the
  binding case are the same file. Headroom to 0.50 is 1.17 log-odds, not the
  1.03 the contaminated run reported.
* THE VERIFICATION BAND. `pipeline::select_for_verification` reads every
  candidate within `max_log_lr_in_group("signature")` of the threshold. +4.2 is
  exactly `signature_invalid`, so the group maximum does not move and not one
  extra file is read or hashed — the wall-clock cost of this change is zero.
  Above it the cost is measured and steep. Bands counted on both clean datasets,
  with each candidate's signature evidence removed first so the numbers are the
  ones the pass would see when it decides:

      headroom   laptop band   VM band
      4.2 (now)           15       216
      4.8                 54       275
      5.5                210       715

  At the ~16 ms per file this project measured reading and hashing its 861
  unconditional arrivals, +4.8 would cost about 0.6 s on the laptop and 0.9 s on
  the VM, and +5.5 about 8 s on the VM — where the jump is every service binary
  in `System32`, which sits in one cluster just below that line. Two tests
  already pin the group maximum at 4.2.

NOT SPLIT FURTHER, and the reason is the event count rather than a preference.
`System32` (0.081%), `SysWOW64` (0.233%), `WinSxS` (0.016%) and the rest of
`\\Windows` (0.000%) are five, seven, three and zero events. Splitting a
fifteen-event tail four ways would be fitting noise; the four agree to within a
factor of fifteen and all sit two to three orders of magnitude below Program
Files, which is where the real boundary is.

WHAT IT BUYS, from `examples/planted.rs` at the VM's prior of -7.6700 (a
2,143-candidate rebuild; the machine is 2,256-2,448 today, so every cell below
is ~0.03 optimistic and the ORDERING, which is what the paragraph argues from,
is unchanged) — a DLL
side-loaded into `System32`, which is the shape this row exists for and which
used to produce the tightest reported cell in the whole table:

                        nothing   COM server   COM hijack   service
    before (+3.4)         0.037        0.078        0.822     0.532
    after  (+4.2)         0.078        0.158        0.911     0.717

The service cell was 0.532 and is 0.717, and it is no longer scored below the
same DLL in `Program Files` — which was the tell that one row was covering two
populations. Packed as well, it goes 0.903 -> 0.954.

WHAT IT COSTS IF THE VERDICT IS WRONG, measured rather than waved at, because
this row now pays more for a verdict than any other incriminating one.
`examples/rescore.rs --signatures` was run over both clean datasets with every
conventional-zone candidate declared unsigned — a bound nothing can exceed. The
laptop goes from 4 candidates at or above 0.50 to 1 (its worst case is in
Program Files, and that row came down); the VM goes from 6 to 98 (its worst case
is the system directories, and this row went up). That is the exposure, and it
is the reason the number stops at 4.2. It is a bound and not a forecast: the
pipeline turns an unreadable `CatRoot` into UNKNOWN rather than into unsigned,
and mm-sign's measured false-unsigned rate on this population is 3 in 28,260.

WITH REAL VERDICTS rather than the bound: all 3,462 measured verdicts from the
census were replayed into the laptop's report, and nothing reached 0.50 —
strongest 0.2473, `imdsksvc.exe` 0.2120.

`installed_outside_component_store` (+1.6) shares this group and is superseded
by this row exactly as before — the gap only widened. It fires only in
`System32`/`SysWOW64`, so the Program Files half of the split does not reach
it."""

[features.unsigned_in_program_files]
group = "signature"
log_lr = 1.3
benign_rate = """
2,011 of 10,522 native PE images under both Program Files trees are
unsigned on the reference laptop, 19.1% -- three hundred and sixty times
the system-zone rate, which is why one row could not price both
"""
rationale = """
Unsigned, native, and under `Program Files` or `Program Files (x86)`. Split off
from `unsigned_in_system_zone` because the benign rate here is not approximately
the same as in the system directories — it is 360 times higher.

MEASURED, reference laptop, live, 2026-08-24, the same census printed beside
that row: 1,837 of 7,014 native PE images under `Program Files` are unsigned
(26.19%), and 174 of 3,508 under `Program Files (x86)` (4.96%). Pooled, 2,011 of
10,522 — 19.11%.

WHY +3.4 WAS NOT MERELY TOO HIGH BUT IMPOSSIBLE. This column is
`ln(P(feature | malicious) / P(feature | benign))`. The denominator is measured
at 0.191 and the numerator is a probability, so the largest value any assumption
about malware can produce is `ln(1 / 0.191) = 1.66`. +3.4 asserts a ratio of 30,
which needs `P(unsigned | malicious) = 5.7`. Nothing rescues it. +1.3 is
`ln(0.7 / 0.191)`.

THE COMPOSITION, because "one laptop's software" is the usual objection to a
Program Files census and here it does not hold. The 1,837 are Git for Windows
(554), MSIX packages under `WindowsApps` (549 of 2,228 — a quarter of the
Microsoft Store's own payload), OpenSSL (364), a CAD suite (188), AMD's driver
stack (127), then LibreOffice, 7-Zip, a VPN client, AnyBurn, ImDisk. Ten vendors
and
Microsoft's own app store. Program Files is simply not a place where everything
is signed, and dropping the three developer packages still leaves 12.3%.

THE OTHER DENOMINATORS SAY THE SAME OR WORSE. Of the 1,593 native
`Program Files` candidates in the reference laptop's own report, 735 are
unsigned — 46%, which would cap this row at 0.78.

WHERE IT UNDER-PRICES, deliberately. Condition on the shape that matters — a
file something has registered — and the benign rate collapses: of the 81 native
`Program Files` candidates carrying a persistence registration, 2 are unsigned,
2.5%, and that slice alone would support +3.4. Unsigned and registered are
NEGATIVELY associated among benign files here, 2.5% against 19%, so a single
marginal weight under-counts the case this tool cares about by
`ln(0.191 / 0.025) = 2.0` and over-counts nothing. This row cannot see the
registration; naive Bayes multiplies marginals; and an under-scored candidate
still appears in the ranked list while an over-scored benign file is a false
accusation. Pricing the joint case properly needs an interaction row, the way
`persistence_targets_scratch_space` prices one — not a marginal set from the
slice that flatters it.

NOT SPLIT AGAIN INTO x86 AND x64. 26.19% against 4.96% is a five-fold difference
on large counts and it is real, but it is a fact about which vendors still ship
32-bit rather than a fact about Windows: `Program Files (x86)` here is Steam,
Nox and the Windows Kits, `Program Files` is where the developer tooling and the
Store apps live. Pooling hands `Program Files (x86)` the lower of the two
weights, which is the conservative direction, and a machine with a different
software mix would move that boundary rather than confirm it.

WHAT IT COSTS, from `examples/planted.rs` at the VM's prior of -7.6700, on a
sample still on disk in Program Files or side-loaded beside a signed executable:

                        none    Run key      task    service
    before (+3.4)      0.187      0.849     0.894      0.873
    after  (+1.3)      0.027      0.409     0.507      0.458

Two of those three cells stop being reported on persistence alone. It is the
price of not asserting a likelihood ratio no probability can produce, it is
stated here rather than discovered later, and the shapes that still clear the
threshold in this zone are the ones carrying a second fact: packed (0.873 with
a service), timestomped (0.990), a random name (0.903), a COM hijack (0.774
with no persistence value at all), or having run and vanished.

WHAT IT DOES NOT COST. Nothing on either clean dataset moves: the strongest
`Program Files` candidate on the reference laptop is
`EtwHostServiceUpdater.exe`, which is managed and priced by
`unsigned_managed_assembly`, and the 739 unsigned `Program Files` candidates
there carry no other evidence and sat at 0.005 before this change."""

[features.unsigned_managed_assembly]
group = "signature"
log_lr = 1.7
benign_rate = """
25 of 25 managed assemblies sampled in the conventional zones are
unsigned; strong-naming rather than Authenticode is the norm there
"""
rationale = """
Unsigned, in a conventional zone, and the image declares a COM descriptor in
data directory 14 — it is a managed .NET assembly. Stands in for
`unsigned_in_system_zone` or `unsigned_in_program_files` — whichever the zone
would otherwise have used — rather than adding to either.

WHY IT IS A SEPARATE ROW. .NET has its own identity mechanism. An assembly is
strong-named, and the loader checks the strong name, not Authenticode. Publishers
who Authenticode-sign their native binaries routinely ship their managed ones
without, and Microsoft does it too: the legacy GAC is unsigned by design.

MEASURED, reference laptop (live, walked 2026-08-23, PE headers read directly).
PEs in the four conventional zones, and how many carry no embedded certificate:

                       PEs   managed   no cert   of those, managed
    System32          6,273       95     4,219          79
    SysWOW64          3,060       40     2,229          28
    WinSxS           19,736    1,465    13,556         498
    \\Windows other    3,611    2,751     1,885       1,471
    Program Files    17,622   10,549     2,288         417
    Program Files x86 9,546    5,955       687         430

"No certificate" is not "unsigned" — a catalog covers most of Windows — so the
populations were sampled through a catalog-aware check (`Get-AuthenticodeSignature`,
which consults CatRoot):

    System32/SysWOW64/WinSxS, 300 sampled     300 Valid, 0 NotSigned
    outside them, managed,    120 sampled     108 NotSigned  (90%)
    outside them, native,     120 sampled     101 NotSigned  (84%)

So every truly unsigned PE in a conventional zone on this machine is outside the
system directories, ~4,230 of them, and about 2,090 — 49% — are managed. Managed
images are 35% of the conventional-zone population but 49% of its unsigned half.

WHERE THE EFFECT IS, precisely, because it is not uniform and pretending it were
would be the same error this row exists to correct. Share of each class that is
truly unsigned:

    \\Windows outside the system dirs   managed 48%   native ~9%    5.3x
    Program Files                      managed  4%   native  22%   the other way
    Program Files (x86)                managed  7%   native   6%   level

The 5.3x is `\\Windows\\assembly` — the legacy GAC, 1,315 assemblies, 25 of 25
sampled NotSigned — plus `\\Windows\\Microsoft.NET` (146). That block is on every
Windows machine in the world, which is what makes it worth a row; the Program
Files columns are one laptop's software and swing either way. The number is set
from the \\Windows measurement, ln(5.3) = 1.67 below 3.4, and applied everywhere
conventional. In Program Files that is deliberately conservative and costs some
detection on unsigned .NET software, which is the direction this project errs.

THE CASE THAT SETTLED IT. The reference laptop's third-strongest candidate on a
machine known to be clean is
`C:\\Program Files\\JetBrains\\ETW Host\\16\\Updater\\EtwHostServiceUpdater.exe`
at 0.1385 — a scheduled task (+3.6), unsigned in a conventional zone (+3.4), a
unique name (+1.0). Its headers say it is a managed assembly. It is unsigned
because it is .NET. Under this row it falls to 0.0285, and the laptop's strongest
conventional-zone candidate becomes `imdsksvc.exe`, which is native and unsigned
and keeps the full +3.4.

NOT APPLIED IN USER ZONES. `unsigned_in_user_zone` is +1.1 already and the benign
managed population there was not measured. Discounting a .NET dropper in
`AppData\\Local\\Temp` on the strength of a census taken in Program Files would be
reasoning past the evidence.

WHAT THIS COSTS, from `examples/planted.rs` at the VM's prior of -7.6700. A
managed sample still on disk in Program Files, or a managed side-loaded DLL
beside a signed executable:

                        Run key    task   service
    native (before)      0.483    0.582    0.532
    managed (after)      0.146    0.203    0.172

Two cells that were reported are not any more. That is the price, it is stated
here rather than discovered later, and it is the direction this project errs in:
an under-scored candidate still appears in the ranked list, an over-scored benign
file is a false accusation. Every other row is untouched — location, persistence,
lifecycle, packing, Mark of the Web, the machine baseline — and the report still
prints the sentence saying the file is unsigned. A managed sample that also ran
and vanished, or was timestomped, or is packed, clears the threshold on the same
evidence it did before.

The alternative, an exclusion for `\\Windows\\assembly`, would have covered the GAC
and missed Microsoft.NET, WindowsPowerShell, the Windows Kits and Steam."""

[features.unsigned_in_user_zone]
group = "signature"
log_lr = 1.1
benign_rate = """
8,167 of 8,167 native PE images in user temp are unsigned, and 2,833 of
26,912 across the user zones generally, on the reference laptop
"""
rationale = """
Unsigned and in a user directory. Only weakly incriminating on its own: plenty
of legitimate small tools, game mods and in-house utilities are unsigned. This
value is deliberately low — treating "unsigned" as strong evidence is the
classic way a triage tool floods an analyst with noise.

WHAT THE CLEAN CORPUS ACTUALLY SAYS ABOUT IT: nothing, and that is worth
writing down. This row fired on 3 candidates in `malmathic-case/report.json`
and on 0 in the VM's. All 3 were this project's own harness binaries — unsigned
`cargo` output in the agents' scratchpad — so with the reference dataset
self-excluded the row has NEVER fired on a benign file this project has
measured. +1.1 is an expert prior with no clean-machine firing behind it, and
it is small enough that this costs little; it is recorded here so nobody quotes
"measured on the reference laptop" for it.

The 3 cannot be recounted: `report.json` was destroyed on 2026-08-27 by an
`--image` run that defaulted `--out` into this repository. The 0 can — it is
`VM_TESTS/test_1` — and the 0 is the half the weight rests on. The count of 3
is now a claim about a file that is gone, and is kept only because it is the
reason this paragraph says the row has no clean-machine evidence behind it."""

# --------------------------------------------------------------------------
# How the file arrived
# --------------------------------------------------------------------------
#
# `pipeline::arrived_out_of_band` measures two anomalies in the `$MFT` record —
# no I/O of its own — and until now used them ONLY to admit a candidate. An
# unreferenced executable in `System32` or `Program Files` becomes a candidate
# because it did not get there the way its neighbours did, and then carried no
# evidence of having done so, which is why the side-loaded-DLL row of
# `examples/planted.rs` was the weakest in the table.
#
# They are TWO features and not one, and the reason is a measurement rather than
# a preference. Reference laptop, live, 2026-08-24, every `.exe/.dll/.sys/.scr/
# .cpl/.ocx` under each root, hard-link counts from `mm-env/examples/nlink.rs`
# and signature verdicts from a catalog-aware check:
#
#   rule                                  population   fires    rate   unsigned
#   System32+SysWOW64, link count 1            8,579     412   4.80%      13
#     (756 DriverStore images excluded)
#   Program Files, created >7d after its       26,912     449   1.67%      17
#     own directory
#
# The rates are within a factor of three of each other, and that similarity is
# the trap. What separates the rules is how each one sits against the SIGNATURE
# claim, and there the two are opposites:
#
#   * System32. All 8,167 images with a link count of two or more verified
#     Valid — 8,167 of 8,167, no exceptions. Every unsigned image in those
#     directories is therefore among the 412. Unsigned IMPLIES arrived out of
#     band, exactly, on 8,579 real files. On the half of the population where a
#     weight would matter, the arrival claim is already contained in the
#     signature claim, and paying both is one fact counted twice.
#
#   * Program Files. 17 of the 449 that fire are unsigned, 3.8%, against a
#     zone-wide unsigned rate of 10.5% (2,833 of 26,912). Firing this rule makes
#     a benign file about 2.8x LESS likely to be unsigned, not more. The two
#     claims are independent — if anything negatively associated — so they may
#     be added.
#
# Hence one row in the `signature` group and one in a group of its own. Averaging
# them into a single "arrived out of band" weight would have double-counted in
# System32 and under-counted in Program Files at the same time.

[features.installed_outside_component_store]
group = "signature"
log_lr = 1.6
benign_rate = """
coincides exactly with `unsigned_in_system_zone` on all 8,579
System32/SysWOW64 images measured, which is why it shares that group
rather than adding to it
"""
rationale = """
The file is in `System32` or `SysWOW64` and its `$MFT` record has one hard link,
so it is not a projection of a `WinSxS` component-store file. Windows servicing
installs every genuine component as a link into the store; a file with one link
was written there by something else.

MEASURED, reference laptop, live, 2026-08-24. 9,335 PE images under `System32`
and `SysWOW64`; 756 of them under `DriverStore`, which is excluded because the
store legitimately holds unlinked driver packages; 8,579 left. 412 have a link
count of one — 4.80%. Read with `mm-env/examples/nlink.rs`, which asks Win32 for
the same field the `$MFT` record header carries.

WHY IT IS IN THE `signature` GROUP, which is the whole decision here. Every one
of the 8,167 images with two or more links verified Valid — all 8,167, no
exceptions — so all 13 unsigned images in those directories are inside the 412.
Unsigned implies this feature, exactly, on the measured population. Adding
+1.6 on top of `unsigned_in_system_zone`'s +4.2 would be the same fact
priced twice, and this project's false-positive history is made of exactly that.
Sharing the group means the stronger claim survives and this one is still
printed as an explanation.

WHAT IT THEREFORE CHANGES, stated plainly because the answer is "almost nothing".
Of the 412: 13 are unsigned and keep +3.4; 399 are signed and keep -6.7 or -3.9,
which beat +1.6 on magnitude. The row scores only where the signature check did
not complete — `signature_unverifiable`, weighted at exactly 0.0 — or where the
file was never verified at all. That is not an empty case: a damaged image, or a
`CatRoot` a dropper has deleted, is precisely the state in which "this is not a
component-store file" is the only thing known about a `System32` binary, and
before this row the answer there was silence. It is also what the report gains
either way, since a superseded offer keeps its sentence.

The composition says the same thing from the other side. 381 of the 412 are
signed by Microsoft — Defender platform updates, `SecurityHealth`, the printer
spool drivers, the appraiser. Microsoft's own out-of-band installers write
straight into `System32` without going through the component store, and that is
the 4.80%. A benign mechanism firing at scale is not evidence, and pricing it as
though it were is how the stock `Winlogon\\Shell` came to sit at 0.99.

WHY NOT SIMPLY 3.04, the marginal ln(1/0.0480). Because the marginal is the
wrong number for the population this row actually scores over: files we tried to
verify and could not, which was not measured. It is also held below
`unsigned_in_system_zone` on purpose, and below `signature_invalid` (+4.2), so
that `max_log_lr_in_group` for the signature group is still 4.2 and the
verification band in `pipeline::select_for_verification` does not move a
candidate. The zone split raised the unsigned row to exactly 4.2 for the same
reason and left the band where it was.

CONFIRMED, not merely argued. All 412 files were replayed into the reference
laptop's report through `examples/rescore.rs --arrivals`, each carrying the
signature verdict measured on it at the same time. The strongest candidate in
the system directory moved from 0.1163 to 0.1122 — downward, and only by the
prior shift that the extra candidates cause. The row changed no verdict, which
is what the measurement said it would do, and that is the honest result rather
than a disappointing one: the admission was the whole value in this zone.

NOT extended to `WinSxS`, where 44.5% of images have one link because the store
holds the masters of components not currently projected, and which is not on any
loader search path."""

[features.arrived_after_its_directory]
group = "arrival"
log_lr = 1.8
benign_rate = """
861 arrivals admitted across the laptop's candidates; the clean ceiling
the replay produces is 0.2287 and nothing reaches 0.50
"""
rationale = """
The file is in `Program Files` and its `$SI` creation time is more than seven
days later than the creation time of the directory holding it. An application's
files are laid down with the directory that holds them; a DLL dropped next to a
signed executable so the loader picks it up is written into a directory that
already existed.

MEASURED, reference laptop, live, 2026-08-24. 26,912 PE images under
`Program Files` and `Program Files (x86)`; 449 fire — 1.67%. Hard links say
nothing in this zone (94.9% of images have one, because nothing hard-links
application files), which is why the rule is about time instead.

INDEPENDENT OF THE SIGNATURE, which is why it is in a group of its own while
`installed_outside_component_store` is not. 17 of the 449 are unsigned, 3.8%,
against 10.5% unsigned across the zone: a file that fires this rule is LESS
likely to be unsigned than an average one. There is no double-count to avoid,
and if the association is anything it is conservative.

THE COMPOSITION, which argued for a smaller number and not a narrower rule. 290
of the 449 (65%) are stock Windows components — Defender ATP 114, Common Files
82, Windows Defender 43, Windows Media Player 22, Internet Explorer 12, Photo
Viewer 9, Mail 6, Windows NT 2 — firing because servicing writes into a
directory created at OS install. That is a benign mechanism at scale. It is NOT
handled by excluding those names: a vendor-name exclusion is unmeasurable, it
would be wrong on the next machine, and it is unnecessary here because all 290
are Microsoft-catalog-signed and collect -6.7, which no arrival weight can
reach. What the composition does argue is that 1.67% overstates how remarkable
the rule is, and the weight is set well under the marginal because of it.

WHY 1.8 AND NOT ln(1/0.0167) = 4.09. Because a clean machine sets the ceiling
and the marginal does not, and the ceiling was measured rather than guessed at.
All 861 files the two admission rules fire on were replayed into the reference
laptop's report through `examples/rescore.rs --arrivals`, each carrying the
signature verdict measured on it at the same moment: 89 attached to candidates
the report already held and 772 became the candidates the rule creates. Result:
19,309 candidates, prior -9.8683, strongest 0.3389, NOTHING at or over 0.50.
With both new weights set to 0.0 — admission alone, the state before this
change — the strongest is 0.2557. So the whole cost of this weight on a machine
known to be clean is 0.2557 -> 0.3389.

THE 0.2557 ENDPOINT WAS CONTAMINATED, re-measured 2026-08-24. It is one of this
project's own harness binaries — `dev_prefetch-*.exe` in the agents' scratchpad,
the same file that held the unfiltered laptop's ceiling — read at the arrival
run's prior of -9.8683 instead of -9.8275. Replaying the identical 861 arrivals
into `report.self-excluded.json` gives 18,316 candidates, prior -9.8155, and a
ceiling of 0.2287 on `imdsksvc.exe`, still with NOTHING at or over 0.50. The
`WHAT SITS AT 0.3389` paragraph below is unaffected in kind — the files it names
are Samsung's and are not this project's — but its 0.3389 is stale for a
different reason: the +3.4 generic unsigned row it quotes has since been split by
zone, and `unsigned_in_program_files` pays 1.3 there, so those two files read
0.0621 today. What the clean replay says about the WEIGHT is unchanged: the row
raises nothing on either clean machine past that machine's own ceiling, and the
ceiling is set by a file this row does not fire on.

WHAT SITS AT 0.3389, because a ceiling is only useful with a name on it:
`Samsung Magician`'s `UTF16StrReplace.exe` and `WaitHelpWindow.exe` — unsigned
(+3.4), an execution artifact with no file behind it (+3.0), this rule (+1.8),
a unique name (+1.0). The +3.0 is an artifact of the replay and not of the
machine: both files are on the volume today, and the census that found them
says so. They are the shape this rule is meant to find, sitting in a directory
of unsigned helper binaries that a signed installer dropped months after
creating it, and 0.3389 is the right answer for them — visible in a ranked
list, not an accusation.

The file that was expected to bind, `SamsungMagician.exe`, does not: it fires
the rule, but firing the rule is what puts it inside the signature band, its
Samsung certificate verifies, and -3.9 carries it to 0.0125. That is the
mechanism this weight was designed around and it is worth stating, because it
is why 1.8 is affordable at all — every file this rule lifts is a file the
pipeline then reads and verifies, and a benign one usually answers back harder
than the rule pushed.

THE VM, which cannot be measured and is therefore bounded. Neither the link
count nor the parent directory's creation time survives in a report, and that
volume is not in reach. The bound assumes EVERY candidate image in both zones
fires its rule and that none of them has a signature to argue back — 2,871 rows
— and comes out at strongest 0.2279, nothing at or over 0.50. Read at the VM's
own undepressed prior of -7.6700 the two zone maxima go from 0.0366 to 0.159
(system directory) and from 0.0248 to 0.133 (Program Files). A file the rule
admits that is in no report at all is bounded by its shape: unsigned (+3.4), a
unique name (+1.0) and this row (+1.8) is 6.2 against that prior, or 0.187.

WHAT IT BUYS. `examples/planted.rs`, side-loaded DLL still on disk, at the VM's
prior of -7.6700:

                     bare   Run key    task  service
    before          0.037     0.483   0.582    0.532
    after           0.187     0.849   0.894    0.873

    COM server      0.078 -> 0.338      COM server + packed  0.409 -> 0.807
    COM hijack      0.822 -> 0.965      nothing but packed   0.237 -> 0.652

Three cells that were not reported now are: a side-loaded DLL on a Run key, one
registered as an ordinary COM server and packed, and one that is merely packed.
The bare cell stays at 0.187 and should: unsigned and late is a lead, not a
finding. The row that could not be seen AT ALL before the admission rule existed
is no longer the weakest in the table.

WHAT IT DOES NOT CATCH. A DLL dropped into an application that updated itself
afterwards, or into one installed at the same moment as the intrusion, leaves no
gap. A creation time rewritten to match the neighbours is invisible here — but
rewriting `$SI` without `$FN` is what `timestomped` admits on, so the two rules
cover each other's gap.

A per-directory variant — "created after every sibling image" — was measured and
rejected despite firing on only 27 files: it fails outright when two files are
dropped at once, since neither is then later than the other, and it cannot see a
DLL dropped into a directory that had no other executable."""

# --------------------------------------------------------------------------
# Location
# --------------------------------------------------------------------------

[features.executable_in_user_temp]
group = "location"
log_lr = 2.6
benign_rate = """
10,036 of the reference laptop's rebuilt population of 17,847 candidates
and 20 of the VM's rebuilt population of 2,256. The most populous zone on
the reference machine by a factor of three, and the zone 15 of the
laptop's clean top-20 sit in
"""
rationale = """
Executable under AppData\\Local\\Temp — the most common staging directory for
malware on Windows. Held down by how much legitimate traffic passes through it:
every installer and updater in existence writes executables there."""

[features.executable_at_volume_root]
group = "location"
log_lr = 3.8
benign_rate = """
4 of the reference laptop's rebuilt population of 17,847 candidates and 3
of the VM's rebuilt population of 2,256. Genuinely near-empty on both
machines, which is the population +3.8 was written against
"""
rationale = """
Executable sitting directly at the volume root. Effectively nothing legitimate
installs to C:\\, while droppers and worms do it routinely."""

[features.executable_in_recycle_bin]
group = "location"
log_lr = 3.5
benign_rate = """
0 of the reference laptop's rebuilt population of 17,847 candidates and 2
of the VM's rebuilt population of 2,256
"""
rationale = """
An executable inside $Recycle.Bin. Users delete installers, so this happens
innocently, but it is also a deliberate hiding place — and either way the bytes
are still recoverable, which is what we care about."""

[features.executable_in_windows_temp]
group = "location"
log_lr = 3.0
benign_rate = """
20 of the reference laptop's rebuilt population of 17,847 candidates and
27 of the VM's rebuilt population of 2,256. Every executed candidate there
on both machines is gone, which is what the scratch-space lifecycle row is
for
"""
rationale = """
Executable in SYSTEM's scratch space. Writable by anything running as SYSTEM and
a frequent drop location for privileged payloads.

WHAT COUNTS AS THAT SPACE. Four directories, not one, and the other three used
to score as ordinary \\Windows at +1.2 — a third of the location evidence for a
payload dropped by a privileged process. That was a detection gap rather than a
false positive, which is why it stayed hidden while the false-positive work went
on around it:

    \\Windows\\Temp                       the original
    \\Windows\\SystemTemp                 added in Windows 10 1903, and now where
                                         most of what used to go to \\Windows\\Temp
                                         actually goes
    \\Windows\\CbsTemp                    the servicing stack's scratch, written
                                         by TrustedInstaller
    \\Windows\\ServiceProfiles\\LocalService\\AppData\\Local\\Temp
    \\Windows\\ServiceProfiles\\NetworkService\\AppData\\Local\\Temp
                                         the two built-in service accounts' temp
                                         directories — `AppData\\Local\\Temp` in
                                         every sense except that the profile is
                                         under \\Windows instead of \\Users

MEASURED, both clean datasets. `SystemTemp` holds 20 candidates on each machine
and they are one thing on each: Chrome's updater unpacking installers
(`GoogleUpdater_chrome_Unpacker_BeginUnzipping*`), plus Defender's
`MpRecovery.exe` and `MpSigStub.exe` on the laptop. `CbsTemp` exists on the
reference laptop and holds no candidates on either machine; the two
`ServiceProfiles` temp directories hold none either.

CONSEQUENCE ON THE CLEAN DATASETS, which is the whole reason the weight did not
have to move:

    VM       SystemTemp candidates   0.0144 -> 0.3385   machine strongest 0.3385, UNCHANGED
    laptop   SystemTemp candidates   0.0027 -> 0.0559   machine strongest 0.2636, UNCHANGED

(The laptop's "machine strongest" column was measured on the contaminated
`report.json`; on `report.self-excluded.json` it reads 0.2364, held by
`imdsksvc.exe`. The column is an INVARIANT here, not a bound — it records that
reclassifying SystemTemp moved no machine ceiling — and neither ceiling carries
a `\\Windows\\SystemTemp` row, so the statement holds on either file.)

The VM number looks alarming until you see what it lands on. 0.3385 was already
the VM's strongest score, held by six files in \\Windows\\Temp — the same Chrome
and Defender and vcredist unpacking, one directory over. Reclassifying did not
raise the ceiling on either clean machine by any amount; it made functionally
identical behaviour score identically wherever it happens, which is what the
zone was supposed to mean. Nothing crosses 0.50 on either dataset.

WHAT IT BUYS, from `examples/planted.rs` at the VM's prior of -7.6700 — a sample
dropped in `\\Windows\\SystemTemp`, which is the gap this closes:

                            none   Run key     task   service
    as \\Windows (before)    0.037     0.483    0.582     0.532
    as SYSTEM temp (after)  0.071     0.652    0.737     0.696

Two more cells reported, and the bare `Run key` cell crosses. Note the net is
smaller than +3.0 minus +1.2 would suggest: leaving `Zone::WindowsOther` also
leaves `is_conventional_for_executables`, so an unsigned file here now collects
`unsigned_in_user_zone` (+1.1) instead of `unsigned_in_system_zone` (+4.2).
That is correct and not a leak — "essentially everything shipped here is signed"
was never true of a scratch directory.

ONE MORE CONSEQUENCE, because this zone is also an admission rule: `worth_observing`
keeps an executable in `Zone::WindowsTemp` whether or not anything referenced it,
so three more directories now admit unreferenced executables. Bounded, and
measured rather than assumed — the reference laptop holds 0 executables in
`CbsTemp`, 0 in `SystemTemp` and 0 in `\\Windows\\Temp` when walked today, because
all three are cleaned; the 20 SystemTemp candidates in each dataset were caught
mid-update and every one of them was already referenced by an execution
artifact. Neither dataset's candidate count moved when the zone changed."""

[features.executable_in_user_appdata]
group = "location"
log_lr = 1.5
benign_rate = """
999 of the reference laptop's rebuilt population of 17,847 candidates and
49 of the VM's rebuilt population of 2,256
"""
rationale = """
Executable under a user's AppData, outside Local\\Temp. AppData\\Roaming is where
persistent user-scope malware most commonly lives, and until this row existed a
dropper there collected nothing at all for its location while the same file one
directory away in AppData\\Local\\Temp collected +2.6.

MEASURED, and the measurement is why this is the SMALLEST location weight in the
table rather than something near Temp's:

  On disk, reference laptop (live, walked 2026-08-23, C:\\Users only):
      user AppData    43,995 executables    of 116,062 under C:\\Users
      user temp       34,449 executables
      user Downloads       1 executable
  Machine-wide that is ~22% of every executable on the laptop — AppData holds
  MORE executables than Local\\Temp does. It is not a rare place. It is where
  Electron apps, Discord, Teams, VS Code, JetBrains, OneDrive, Python and half
  of what a developer installs put themselves.

  Among scored candidates:
      VM, from WinRE (3,744 candidates, 3,503 with an executable extension):
          user AppData    44 candidates / 38 executables   1.1% of executables
          user temp       20 candidates / 17 executables   0.5%
      Reference laptop (20,263 candidates, 19,993 executables):
          user AppData   965 candidates / 965 executables  4.8% of executables
          user temp   10,883 candidates / 10,877          54.4%

  The two views disagree about which of the two zones is busier, which is
  exactly why the number is placed by the on-disk share rather than by the
  candidate share: the candidate population is shaped by what the harvester
  chose to keep (Temp is full of DELETED executables, and deleted executables
  are collected on purpose), while the on-disk share is what a dropper's
  neighbours actually look like.

CONSEQUENCE ON THE CLEAN DATASETS: nothing crosses 0.50 in either. Re-scoring
both reports with this row added, the highest-scoring AppData executable rises
from 0.014 to 0.061 on the VM (OneDriveSetup.exe) and from 0.003 to 0.012 on the
laptop (Telegram's updater). The nearest AppData candidate on either machine
needs +4.2 to reach the threshold; this row is worth a third of that. Zero
candidates on either machine change side.

CONSEQUENCE ON THE DROPPER: at the VM's own base rate of ln(1/3744) = -8.23, a
dropper in AppData\\Roaming with a Run key (+3.2) that no longer exists on disk
(+3.0) under a name found nowhere else (+1.0) summed to +7.2 and scored 0.26 —
under the threshold and unreported. With this row it sums to +8.7 and scores
0.62. The same file in AppData\\Local\\Temp scores 0.83, and it should still
score higher: Temp is where nothing is meant to persist, while AppData is where
user-scope software legitimately installs.

Below `executable_rare_for_zone_on_this_machine` (+2.2) on purpose, and in the
same group. On a machine that barely uses AppData the machine's own measurement
is the better evidence and wins; this row only decides the case on machines
where AppData is busy, which is where it should be weak."""

[features.executable_in_user_downloads]
group = "location"
log_lr = 1.6
benign_rate = """
8 of the reference laptop's rebuilt population of 17,847 candidates and 8
of the VM's rebuilt population of 2,256
"""
rationale = """
Executable in a user's Downloads. Where the payload usually arrives — but also
where every installer the user ever fetched sits, so the weight stays low.

MEASURED. On disk the reference laptop holds exactly 1 executable in Downloads
out of 116,062 under C:\\Users, so this zone is genuinely near-empty there — but
that is a fact about one tidy machine, not about Downloads, and pricing the row
off it would be fitting to a sample of one. Among candidates both clean datasets
hold exactly 8 executables in Downloads: 0.23% of the VM's executable candidates
and 0.04% of the laptop's. Every one of the sixteen is an installer or a tool
fetched deliberately — ChromeSetup.exe, python-3.11.0-amd64.exe, Git-2.54.0-64-
bit.exe, 7z2601-x64.exe, jadx-gui, Ghidra's decompile.exe, Sandboxie's driver.
That list is what this row will fire on, on every machine, forever.

CONSEQUENCE ON THE CLEAN DATASETS: nothing crosses 0.50. On the VM the top
Downloads candidate rises from 0.014 to 0.067; on the laptop it does not move at
all, because `executable_rare_for_zone_on_this_machine` (+2.2) already fires
there and supersedes this row inside the shared `location` group. That is the
intended shape — a machine that measurably does not use Downloads gets the
stronger, measured claim, and this fixed row only applies where the machine's own
evidence is silent.

Set just above AppData because arriving from outside is a slightly narrower fact
than living in a user-scope install directory, and well below Local\\Temp (+2.6)
because a downloaded installer is the single most ordinary executable a user
profile contains."""

# --------------------------------------------------------------------------
# The four zones that used to collect nothing.
#
# `zone.rs` has always classified ProgramData, the user profile outside AppData,
# \\Windows outside System32/WinSxS/Temp, and everything else — and `from_path`
# had no row for any of them, so an executable in any of those places scored
# exactly zero for its location. That is why a service running from ProgramData
# and still present on disk scored 0.104 and was never reported.
#
# All four are MEASURED below against the same two clean datasets and the same
# on-disk census used to place AppData at +1.5 and Downloads at +1.6. Three of
# them come out as the smallest rows in the group, because they are the zones a
# clean machine actually fills. ProgramData is the exception, and it is the
# exception on the census rather than on a hunch: 166 executables out of 199,242.
# --------------------------------------------------------------------------

[features.executable_in_programdata]
group = "location"
log_lr = 2.6
benign_rate = """
794 of the reference laptop's rebuilt population of 17,847 candidates and
10 of the VM's rebuilt population of 2,256. 166 of 166 autostart entries
in this zone across both clean machines are Windows Defender's own
Platform directory, and the VM's clean ceiling of 0.3271 is one of them
"""
rationale = """
Executable under \\ProgramData. The sanctioned machine-scope data directory, and
a normal home for machine-scope malware precisely because parts of it are
world-writable by inheritance while the path itself is unremarkable.

MEASURED, on-disk census of the reference laptop (the tool's own `zone` module
over the full MFT: 1,748,931 files, 199,242 with an executable extension), and
independently re-walked 2026-08-24:

    ProgramData          166 executables      0.083% of the machine's
    user profile      43,857                 22.01%
    user AppData      42,752                 21.46%
    user temp         26,167                 13.13%
    elsewhere            811                  0.41%
    volume root            4  /  Downloads 1  /  Windows temp 0  /  recycle bin 0

ProgramData is the third-emptiest zone on a clean Windows — two orders of
magnitude sparser than AppData, and 158 times sparser than the user temp
directory this row is now level with — which is why it is worth more than
AppData's +1.5 rather than less.

BUT THE COUNT IS ONE VENDOR. Of those 166, 154 (93%) are under
\\ProgramData\\Microsoft, and most of that is Defender's own platform directory,
which exists on every Windows in the world. Among scored candidates the
domination is worse:

    VM, from WinRE   12 executable candidates of 3,503 (0.34%) — 9 are Defender
    laptop, live    800 executable candidates of 19,993 (4.00%) — 786 are Defender

Strip that one directory and the zone holds 3 candidates on the VM (0.09%) and
14 on the laptop (0.07%): Package Cache (WiX bundle caches), Visual Studio,
a VPN client's updater, OBS, Samsung. That short list is what this row fires on,
on every machine, forever — and every entry on it is an installer or an updater
that put itself somewhere it is entitled to be.

RAISED FROM +2.2 TO +2.6 ON 2026-08-24, and the reason is that the thing which
held it at 2.2 turned out to be a defect rather than a fact. The rationale used
to read:

    CAPPED BY THE MARGIN [...] The highest-scoring clean ProgramData candidate
    across both datasets is Microsoft's own MpDefenderCoreService.exe on the VM
    [...] it scores that high because WinRE could not verify its catalog
    signature. [...] At +2.6 it would be 0.23.

That file has no catalog signature to fail to verify. It carries an EMBEDDED
Authenticode signature, which `mm-sign` checks against its own embedded trust
store and which needs no CatRoot at all — measured directly with
`mm-sign/examples/scan` on this laptop's copies, all Valid, `Microsoft Windows
Publisher`, chaining to `Microsoft Root Certificate Authority 2010`. What
actually stopped the check was that Windows had Compact-OS (WOF) compressed the
file, so the reader handed the verifier a hole full of zeroes and it answered
"not a PE image this build can parse". That defect is fixed in
`mm-raw::wof`, and the cap it produced does not survive it.

THE CEILING RE-MEASURED, through `examples/rescore.rs --signatures`, which
replays a report with the verdict the fixed reader produces instead of the one
frozen into the report on the day it ran. Strongest clean ProgramData candidate:

                       at +2.2, as the report was written    with the read fixed
    VM, from WinRE     0.2554  MpDefenderCoreService.exe      0.0113
    laptop, live       0.0259  a VPN client's updater         0.0259 (unchanged)

The laptop does not move because the laptop never had the defect: its whole WOF
population is 55 files, 0.02% of the volume, all Chrome Beta `.pak` resources
and not one of them an executable. On the VM the single file that set this
weight falls by 1.63 log-odds and takes the zone's ceiling with it, from 1.63
log-odds below the threshold to 4.47.

AND THE CEILING IS NO LONGER WHAT CAPS THIS ROW, which is the finding that
matters. Sweeping the weight and re-measuring both datasets at each value — with
the signature verdicts a real run would have reached, since raising this row
pushes more of the zone into `select_for_verification`'s band and a benign file
there answers back with -3.9:

    weight   VM ProgramData   laptop ProgramData   VM machine   laptop machine
      2.2         0.0113            0.0259           0.3385         0.2636
      2.6         0.0103            0.0381           0.3385         0.2636
      3.0         0.0152            0.0559           0.3385         0.2636
      3.5         0.0248            0.0889           0.3385         0.2636

The "laptop machine" column is the contaminated 0.2636 — this project's own
harness binary. On `report.self-excluded.json` it reads 0.2364 at every one of
those four values, held by `imdsksvc.exe`, which carries no ProgramData row and
so cannot move under this sweep either. The column says the same thing on the
clean file, which is why the conclusion below survives the re-derivation: this
row was NOT set by the laptop's ceiling, and the three arguments that did set it
are named immediately after.

The VM column falls between 2.2 and 2.6 rather than rising, because at +2.47 the
Package Cache installers cross into the verification band, get read, and collect
-3.9 — the same mechanism `arrived_after_its_directory` documents. Neither
machine's own ceiling moves at any of these values, and nothing reaches 0.50.
Under the incident-window bound (every candidate with a creation time assumed
inside the window, `rescore --window`) the zone peaks at 0.0590 on the VM and
0.0462 on the laptop at +2.6, against 0.1335 and 0.0889 at +3.5.

SO WHY 2.6 AND NOT 3.5, given that the census argues ln(1/0.00083) = 7.1 and the
clean-machine ceiling permits 3.5. Three things, none of them the ceiling:

  * THE FIX MIGHT NOT LAND, and this row must survive that. When this value was
    chosen, `mm-raw::wof` decoded the three XPRESS Compact-OS algorithms and NOT
    LZX, and nobody had read the VM's disk to find out which one Windows used on
    those two files. If they were LZX the read still failed,
    `signature_unverifiable` was still 0.0, and MpDefenderCoreService.exe was
    still the strongest ProgramData candidate on a clean machine: replayed at
    the rebuilt VM prior of -7.6700 with the signature unreadable it came to
    0.3385 at +2.6 — level with that machine's own ceiling and not a finding —
    against 0.433 at +3.0 and 0.557 at +3.5. +3.5 would have made Windows
    Defender the top finding on a clean recovery console the moment the
    decompressor met an algorithm it did not implement. +2.6 is the largest
    value that survives its own worst case, and that is what picked it out of
    the range the ceiling allows. Pinned by
    `defenders_own_service_stays_far_below_the_threshold_from_winre`.

    THE FIX HAS SINCE LANDED, and the worst case this value was chosen against
    no longer happens. `mm_core::lzx` decodes LZX, so both of the VM's Defender
    binaries are read and verified. `MpDefenderCoreService.exe` carries a valid
    embedded Microsoft signature and takes `signed_trusted_publisher` (-3.9),
    which moves it from 0.3385 to 0.0102; `KslD.sys` moves from 0.0366 to
    0.0008. The clean VM's ceiling falls with it, from 0.3385 to 0.2554 — six
    python-installer and VMware drag-and-drop binaries in the user temp
    directory — and the headroom to the 0.50 bar goes from 0.67 log-odds to
    1.07. BOTH FIGURES ARE HISTORICAL (2026-08-24, over a 2,143-candidate
    rebuild of VM_TESTS/test_1). The machine is 2,256 candidates today and the
    thinnest clean headroom in the tree is 0.2711, on a different file and a
    different dataset; see the header block. The conclusion this paragraph
    draws — that the fix moves the ceiling DOWN, so +2.6 was safe to choose
    before it existed — is unaffected by the restatement, which is why the
    value stays. Measured, not projected: the two signature verdicts were read off the
    same Defender binaries on the reference laptop with `mm-sign`'s `scan`, and
    the VM report was replayed through `rescore` with those two observations
    substituted. The value stays at +2.6 — nothing here argues it upward, and
    the paragraph above is the reason it was safe to choose before the fix
    existed.

  * THE ZONE IS SANCTIONED, and today's census says so more strongly than the
    old one did. All 166 ProgramData executables on the reference laptop verify
    Valid through a catalog-aware check — 166 of 166, zero unsigned, 154 signed
    by Microsoft and the rest by Samsung, OBS and the .NET installers. Software
    is ENTITLED to install here, which is exactly what is not true of
    `AppData\\Local\\Temp` (+2.6), `\\Windows\\Temp` (+3.0) or the volume root
    (+3.8). Frequency argues this row far above the temp directories; sanction
    argues it below. Level with user temp is where the two meet, and it is as
    far as the argument reaches. Being 158x sparser than user temp is why it no
    longer sits BELOW it; being a place installers legitimately write is why it
    does not go past it.

  * THE ONE BENIGN SHAPE NO SIGNATURE CAN ANSWER. Every file above is held down
    by a signature, and `select_for_verification` only reads files that still
    exist. A ProgramData executable that ran and was then cleaned up can never
    be exonerated, and that is an ordinary shape: the laptop's ceiling here is
    `C:\\ProgramData\\Vendor VPN\\cache\\vendor-update\\vendor-2026.4-beta1.exe`,
    a self-updating application's cached installer, carrying
    `executed_but_now_absent` (+3.0), a unique name (+1.0) and this row. It
    reads 0.0381 on the laptop at +2.6 — but the laptop has 18,537 candidates
    and the VM has 2,143, and transplanted to the VM's prior of -7.6700 the same
    shape reads 0.176 at +2.2, 0.255 at +2.6, 0.339 at +3.0 and 0.458 at +3.5.
