# Provenance — Mark of the Web
#
# Its own group, and not a sub-case of location or signature. Where a file came
# FROM is a fact about its history; where it LIVES and who signed it are facts
# about its present state, and the three can be true or false in any
# combination. A signed installer downloaded to Temp is all three at once and
# none of them restates another, so they are allowed to add.
#
# MEASURED ON THE REFERENCE MACHINE (healthy Windows 11), by walking every file
# and asking each one for its Zone.Identifier stream:
#
#   * 1,400,439 files under \Users. 78 carry a Zone.Identifier — 0.0056%.
#     ALL SEVENTY-EIGHT claim ZoneId=3. Zero claim 4, zero claim 0, 1 or 2.
#   * 151,357 executables (.exe .dll .msi .sys .scr .com .bat .cmd .ps1 .vbs
#     .js .jar .hta) across \Users, \ProgramData, both Program Files trees and
#     \Windows\Temp. Exactly ONE carries a Zone.Identifier — 0.0007%.
#   * The rate is wildly uneven by directory, which is the whole story:
#     \Users\<u>\Downloads 8 of 14 files (57%), \Desktop 0 of 2,136,
#     \AppData\Local\Temp 0 of 74,194.
#   * Of the 78 streams, 64 carry a ReferrerUrl and only 7 carry a HostUrl.
#     Most referrers are a LOCAL PATH — the archive Explorer extracted the file
#     from — not a web address. The longest real HostUrl measured is 201
#     characters, which is why values are capped at 256 rather than at 80 and
#     why the report wraps a URL instead of truncating it.
#   * Stream sizes: 26 to 283 bytes, mean 87. 26 bytes is a bare
#     "[ZoneTransfer]\r\nZoneId=3\r\n" with no URL at all.
#
# The uneven distribution is why the raw rarity is NOT the log-likelihood ratio.
# A Mark of the Web is vanishingly rare across a whole machine and common in the
# handful of directories candidates actually come from, so conditioning on
# "this file is already a candidate" removes most of the apparent power. The
# weights below are set from that conditional view rather than from 1/151,357,
# which would have bought a nearly-decisive weight for the ordinary act of
# downloading something.
# --------------------------------------------------------------------------

[features.shared_digest_renamed_copy]
group = "duplication"
log_lr = 3.0
benign_rate = """
14 of 17,847 rebuilt reference-laptop candidates (0.078%), and 0 of each of the
six clean VM datasets: test_1 0/2,256, test_2 live 0/2,256, test_2 WinRE
0/2,371, test_3 0/2,448, test_5 0/2,415, test_6 0/2,847. 14 of 32,440 clean
candidates in total, 0.043%. The 14 are two families and both are named in the
rationale. Strongest benign carrier 0.1694, against that machine's clean
ceiling of 0.2333, so it does not become the ceiling. On the two clean VM
images run end to end -- WIN11-LAB-000004 and -000006 -- 167 candidates
each have their bytes at a second path, none fires this row, and both runs
report NOTHING FOUND. It fires twice on test_7 and both are the ransomware
dropper
"""
rationale = """
The same bytes are on this volume at a second path, under a DIFFERENT NAME and
in a DIFFERENT ZONE. One file, written twice, and renamed on the way.

WHAT WAS ALREADY THERE AND SCORED NOTHING. `mm_report::text::render_same_bytes`
has printed "the same bytes are also on this volume at:" inside a finding's
block since the shared-bytes round, and its own doc comment called it "an
identity statement, not evidence". That is right about DUPLICATION and wrong
about this shape. On the ransomware image finding [2]
`\\Users\\Alice\\AppData\\Roaming\\svchost.exe` (p = 0.65) is byte-identical to
C633 `\\Users\\Alice\\Desktop\\954d8fcd...3932c.exe` (p = 0.34), which UserAssist
records running three times. The report said so and neither score moved.

WHY THE TWO CONDITIONS ARE THE ONES THEY ARE. Measured by rebuilding every
report in the tree under today's admission rules --
`cargo run --release --example rescore -- <report>` -- because the
report-as-written is NOT a usable census here and that is worth stating: the
laptop report predates `graph::build`'s path-contradiction rule, so files that
are two candidates today were one candidate then, and a count taken from the
file on disk finds 0 duplicate digests where the rebuild finds 480 linked
candidates. `examples/mine.rs` takes the as-written count and
`examples/dupcensus.rs` re-hashes the laptop's own files; both UNDERCOUNT for
that reason and neither is what this row is priced on.

  rule                                              laptop  6 clean VMs  test_7
  one digest at >=2 located paths                      480       144-167     169
  ... and >=2 zones and >=2 DISTINCT NAMES              14             0       2

Duplication is ordinary. Renaming is not, and neither is crossing a zone; the
CONJUNCTION is what nearly nothing benign does. The three shapes it throws out:

  * SAME NAME, TWO ZONES -- Google's `updater.exe` machine-wide and per-user,
    VMware's `vmnat.exe` in `System32` and in Program Files, Figma's agent.
    This is an installer's own second copy and it is the commonest of the
    three;
  * RENAMED, ONE ZONE -- Chrome's `setup.exe` and `chrmstp.exe`, the Store's
    two binaries, Edge's `notification_helper.exe` and
    `passkey_authenticator_plugin.exe`, Git's `git.exe`/`git-lfs.exe`/
    `scalar.exe`, `bzip2`/`bunzip2`/`bzcat`. One product shipping one
    executable under several entry-point names;
  * AN UNLOCATED NAME -- 11 of the 22 two-zone groups on EVERY VM dataset are
    a driver a service registration names by bare module name, alongside the
    walk's real path for it: `vmci.sys` and `\\Program Files\\Common
    Files\\VMware\\...\\vmci.sys`. That is one file under one name, not two, so
    `graph::link_shared_digests` refuses an unlocated path outright.

THE 14 THAT DO FIRE, ALL OF THEM, because a benign rate with no names in it is
a number nobody can check:

  * `\\Users\\analyst\\Downloads\\platform-tools\\adb.exe` and
    `\\Program Files (x86)\\Nox\\bin\\nox_adb.exe` -- Nox ships Google's ADB
    under its own name. 2 candidates, 0.1694 and 0.0011;
  * setuptools' four launcher stubs, `cli.exe`/`cli-32.exe`/`gui.exe`/
    `gui-32.exe`, where the 32- and 64-bit stubs are byte-identical, across
    three embedded Pythons -- CPython 3.11, pgAdmin's and LibreOffice's.
    12 candidates, none above 0.0050.

Both are the same benign act: a program vendoring somebody else's executable
and renaming it. It is real, it is measured, and at 0.078% of the busiest
machine in this tree it does not reach a tenth of the way to the bar.

WHY 3.0, WHICH IS DELIBERATELY LOW. At a benign rate of 4.3e-4 a log_lr of 3.0
asserts P(feature | malicious) = 0.0087 -- that fewer than one malicious file
in a hundred is a renamed second copy. Both malware datasets in this tree carry
it, so the observed rate is not 0.0087 and the honest likelihood ratio is
several nats larger. The gap is the safety margin, and it is there because the
denominator is measured on seven machines and the two benign families found so
far are exactly the kind of thing more machines would find more of.

It is also below `ln(750) - CHEAPEST_UBIQUITOUS_ROW`, so it cannot convict
alone on the smallest machine any guard here may assume, and it needs no
`convicts_alone`.

WHAT IT MOVES, AND WHAT IT DOES NOT. It moves NONE of the eight planted shapes
the plant matrix measures, because none of them has a twin -- this is not the
row that separates a lone dropper from ImDisk, and it must not be sold as one.
`examples/rescore.rs` carries a ninth shape, `appdata-temp-run-copied`, and its
control `appdata-temp-run-copied-same-name`, so the difference is readable off
the harness rather than argued.

What it does is make the SECOND COPY scoreable. Run end to end against
`WIN11-LAB-000005.vmdk` the ransomware image goes from three findings to
four: `AppData\\Roaming\\svchost.exe` from 0.65 to 0.97, and C633 --
`Desktop\\954d8fcd....exe`, the copy the user actually double-clicked, which
UserAssist says ran three times and which the report had ranked 633rd -- from
0.34 to 0.63 and into the findings. The two clean images in the same chain
still report NOTHING FOUND.

WHERE THE DIGESTS COME FROM, and the one case that needed a second pass. The
census runs in `build_and_score`, before a single file has been read, so it
sees only what artifacts remember. That is enough on the ransomware image,
where both halves of the pair are Amcache's SHA-1. It is NOT enough on test_4:
`\\Windows\\TEMP\\server.exe` has no artifact digest at all -- Defender had
removed the file and its Run key -- and the only digest it ever gets is the one
this tool computes from the bytes it recovers. So the pipeline runs the census
a second time after acquisition, against the SAME incident window, and
re-scores only the candidates whose shared-digest facts actually changed. That
second pass is also what turns `identical SHA-1` into `identical SHA-256` on
the ransomware pair once both files have been read.

NO LOOP IS POSSIBLE, and this is the place a scoring loop would form if one
could. The observation carries a path and a digest; the scorer compares a zone
and a file name. Neither candidate's probability, evidence or rank is an input
to the other's, so two copies collecting this about each other is two
independent readings of one filesystem fact and not a feedback path. Pinned by
`mm-score/tests/shared_digest.rs`, which scores the pair repeatedly in both
orders and asserts nothing moves.
"""

[features.downloaded_from_internet_zone]
group = "provenance"
log_lr = 0.8
benign_rate = """
78 of 1,400,439 files on the reference laptop carry an Internet-zone Mark
of the Web, and 1 of 151,357 in the executable population
"""
rationale = """
The file carries a Mark of the Web claiming ZoneId=3: something downloaded it
from the internet.

Deliberately weaker than being unsigned in a user directory (1.1), and for a
reason worth stating plainly: essentially all malware is downloaded, and
essentially all downloads are benign. The first fact is what makes the feature
fire on the right files; the second is what caps it. Read as a likelihood ratio,
roughly P(MotW | sample) ~ 0.35 against P(MotW | benign candidate) ~ 0.16, which
is ln(0.35/0.16) = 0.8.

The numerator is well under one on purpose. A great many samples reach a machine
with no Mark of the Web at all: fetched by certutil, curl or a PowerShell
downloader rather than by a browser; extracted by 7-Zip or WinRAR, which do not
propagate the stream the way Explorer does; written by an already-resident
process; or carried in over SMB or USB. Absence of a Mark of the Web is
therefore not evidence of anything either, and no negative weight exists for it.

Measured: 1 of 151,357 executables on the reference machine, 78 of 1,400,439
files under \\Users, and 8 of the 14 files in its Downloads folder. See the
block comment above for why the last number governs and the first two do not.

AND MEASURED AGAIN, ON WHAT THE PIPELINE ACTUALLY SEES — which is the number
that should be argued with first. A full run produced "Zone.Identifier (MotW)
0 observations". Not a low rate: zero. The stream is read only for files that are
already candidates AND whose MFT record carries a named $DATA, and of the 19,530
located candidates in that run, 5,818 still existed and **0 of them carried any
alternate data stream at all** (checked directly with `Get-Item -Stream`). Every
one of this machine's 78 Marks of the Web sits on a file in Documents or
Downloads that never becomes a candidate.

So the false-positive rate of this feature on a healthy machine is 0 of 20,227,
and so is its true-positive rate, and its exercise rate. That gate is the correct
design — every installer a user ever downloaded has a Mark of the Web, so it must
never be a REASON to become a candidate — but it means the weight has never once
been applied to real data on this machine. The read path itself is no longer
unproven: `testimage::tests::an_alternate_data_stream_is_read_back_by_name`
builds a Zone.Identifier into a synthetic volume and reads it back through
`Volume::read_named_stream` and the real `ntfs-core`, which is what the live test
would have shown had it not needed Administrator.

The value of this feature is not the 0.8. It is the URL that travels with it,
which the report prints on its own line whether or not this weight survives
grouping — see `render_origin` in mm-report. Temper even that: only 7 of the 78
streams measured carried a HostUrl at all, and most referrers named a local
archive rather than a web address. A Mark of the Web usually says WHEN and
THROUGH WHAT a file arrived, and only sometimes says from where."""

[features.downloaded_from_restricted_zone]
group = "provenance"
log_lr = 2.2
benign_rate = """
0 of 1,400,439 files on the reference laptop and 0 of 151,357 in the
executable population
"""
rationale = """
ZoneId=4 — the restricted-sites zone. Set when the source was classified as
restricted by policy or by the browser, rather than merely as external.

Genuinely uncommon: 0 of 151,357 executables on the reference machine, and 0 of
1,400,439 files under \\Users — all 78 Marks of the Web found there claim zone
3. That is a zero, not a small number, so this weight is an expert prior with no
supporting observation behind it and is set low accordingly — below
`executable_in_user_temp`, nowhere near an accusation.

Unlike ZoneId=3 this value is not self-serving. The stream is written by whatever
performed the download, so an attacker who writes their own can claim any zone;
one that wanted to look harmless would write 0, not 4. A 4 therefore usually
means the machine's own policy or SmartScreen said so, which is a second
opinion rather than the attacker's."""

[features.download_origin_recorded]
group = "provenance"
log_lr = 0.0
benign_rate = """
4 of 3,744 VM candidates and 0 of 19,270 laptop candidates carry a Mark of
the Web at all. Weighted at exactly 0.0, so the rate cannot move a score
in either direction
"""
rationale = """
A Zone.Identifier stream is present but claims the local machine, the intranet,
a trusted site, a zone id Windows does not define, or no readable ZoneId at all.

Scored at EXACTLY ZERO, on purpose, and present in the table only so the URLs in
the stream reach the report. None of those zones asserts the file came from
anywhere hostile, and the stream is written by the downloader, so a claim of
"local" from a file we are already suspicious of is worth precisely nothing —
writing ZoneId=0 is the cheapest anti-forensic act available to a dropper, which
is exactly why believing it in the exonerating direction is not on offer either.
There is no negative weight here and there should not be one.

The same shape as `signature_unverifiable`: a row that carries an explanation
and moves no score, because the alternative — folding "we could not tell" into
either "it came from the internet" or "it came from here" — is a claim we do not
have."""

# --------------------------------------------------------------------------
# Runtime (live systems only)
# --------------------------------------------------------------------------

[features.unbacked_executable_memory]
group = "runtime"
log_lr = 6.8
benign_rate = """
UNMEASURED: unmeasurable from here. Nothing in this tree constructs
ObservationKind::UnbackedExecutableMemory, so the population has never
existed to be counted; offline analysis of a cold disk cannot see process
memory at all. This row is listed in PRODUCERLESS in
`mm-score/src/weights.rs` and the build fails if a producer appears before
a benign rate does
"""
convicts_alone = """
Yes, and it is the least consequential of the three: nothing in this tree
constructs the observation, so the row cannot fire at all. It is listed in
PRODUCERLESS in `mm-score/src/weights.rs` and the build fails if a
producer appears before a benign rate does -- so this justification is a
placeholder that must be rewritten as a real one at that moment, not
before. The claim it would make, if a live-memory pass ever existed, is
that executable memory backed by no file on disk is what the loader does
not do and what injected code always does.

Above the 5.6201 ceiling by 1.18, which is the largest excess in the
table. If this row ever becomes producible that number has to be argued
against a measured machine rather than against this sentence.
"""
rationale = """
A running process holds executable memory with no file behind it — injected code
or an unpacked payload. Nearly decisive, and uniquely valuable because the memory
copy is the UNPACKED form, which is exactly what a crypter was hiding. Only
observable on a live system.

NO PRODUCER, and this is the heaviest row in the table that nothing can reach:
+6.8, above `quarantined_by_av`'s reach on either clean prior when combined with
anything at all. Nothing in this tree constructs
`ObservationKind::UnbackedExecutableMemory`. It is not waiting on unfinished
work either — this tool analyses a cold disk from WinRE and has no live process
to look into, so the observation is out of scope rather than pending.

The weight is LEFT AS IT WAS on purpose. Repricing an unreachable row against no
measurement would be exactly the move this audit exists to stop, in the other
direction. What has changed is that the row is listed in PRODUCERLESS in
`mm-score/src/weights.rs`: if a producer ever appears, the build fails and says
that a benign rate has to be counted before this number ships."""

[features.running_from_user_directory]
group = "runtime"
log_lr = 1.6
benign_rate = """
UNMEASURED: and the little that is known argues the weight is wrong.
Nothing in this tree constructs ObservationKind::ProcessRunning. 10,036 of
the laptop's 17,847 candidates are in user temp alone, so `a process
running from a user directory` has a large benign population that has
never been counted. Listed in PRODUCERLESS in `mm-score/src/weights.rs`
"""
rationale = """
A live process is running this image out of a user directory.

NO PRODUCER. Nothing in this tree constructs `ObservationKind::ProcessRunning`,
and a cold disk has no running processes, so this is out of scope rather than
pending. Listed in PRODUCERLESS in `mm-score/src/weights.rs`; the build fails if
a producer arrives before a measurement does.

The weight is left as it was, for the same reason `unbacked_executable_memory`'s
is. What the location census does say is that the row is probably too high: over
half the laptop's candidates are in user temp alone, so `running from a user
directory` describes the majority of that machine, not an anomaly in it."""
