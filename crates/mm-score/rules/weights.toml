into the graph, not how incriminating one is once it is there."""

[features.persistence_com_hijack]
group = "persistence"
log_lr = 4.8
benign_rate = """
NO LONGER ZERO, AND THE ROW'S ONLY FIRING EVER WAS WRONG. 0 redirections
across 4,303 per-user COM registrations on both clean machines -- and then,
on 2026-08-28, 1 redirection on each of five links of the WIN11-LAB
chain (-000002, -000003, -000004, -000006 and the live -000005), all of
them the same benign entry, all of them reported at p = 0.9994 as the only
finding on the machine. Measured precision of this row across every dataset
in the tree: 0 of 5.

The carrier is the innocent shape the `rationale` below already named as
the reason this is 4.8 rather than 5.4 -- "an application installed both
machine-wide and per-user at different versions or paths registering the
same CLSID from both". OneDrive is that application. It registered
CLSID {71DCE5D6-4B57-496B-AC21-CD5B54EB93FD}\\LocalServer32 per-user out of
AppData\\Local\\Microsoft\\OneDrive\\21.220.1024.0005, the machine-wide
install 23.038.0219.0001 under Program Files (x86) superseded it, and the
per-user registration was removed. Read straight off the image, every cell
of it -- nk, vk, value list and data -- is unallocated, so the RECOVERY was
correct and this is not the allocated-cell defect the last round fixed. What
was wrong is that a per-user entry recovered from a FREED cell was compared
against a LIVE machine-wide one and called a redirection.

It is not one. This row's claim is a claim about the registry's search
order: HKCU\\Software\\Classes is read before HKLM\\Software\\Classes, so the
per-user entry silently wins. A freed cell is not in the search order. It
shadows nothing. `pipeline::promote_com_hijacks` now requires BOTH halves of
the comparison to come from allocated cells, which returns this row to its
measured state: never observed on real data.

The weight is left at 4.8 because the live-on-live comparison it prices was
not what fired -- it has still never fired -- and because the shape that did
fire can no longer reach it.
"""
rationale = """
A per-user COM registration REDIRECTS a class that is also registered
machine-wide, to a different file (T1546.015). HKCU\\Software\\Classes is
searched before HKLM, so the class silently loads this module instead of the one
the machine installed — the actual COM hijack, and the thing the 0.8 entry above
was never able to see.

FIRING RATE, both clean machines: 0. The laptop offers 4,302 per-user
registrations to compare against 11,082 machine-wide CLSIDs, and 4,268 of them
name exactly the machine-wide target (Windows propagates the same registration
into the user hive); the remaining 34 are CLSIDs no machine-wide entry claims at
all — PowerToys, Discord, Google Updater, NordVPN registering their own classes,
which is not a redirection of anything. The VM offers 1 per-user registration,
also a novel CLSID. Zero redirections across 4,303 per-user registrations is the
measurement this weight rests on.

Why 4.8 and not the 5.4 the Winlogon values get, given a measured rate of zero:
the comparison has an innocent shape that neither of these two machines
happened to exhibit — an application installed both machine-wide and per-user at
different versions or paths registering the same CLSID from both. Chrome,
Chromium and Google Updater are all present on the laptop and none of them did
it, but one clean-machine pair is not enough to price that risk at zero. 4.8
sits above scheduled task (3.6) and service (3.4) and below Winlogon; it cannot
carry a finding alone against a prior near -8, which is the intended behaviour
for a feature with no positive observations behind it yet.

The 32-bit mirror is deliberately collapsed: a CLSID's machine-wide targets from
Classes\\CLSID and Classes\\Wow6432Node\\CLSID are pooled, and a per-user entry
counts as a redirection only if it matches NEITHER. A 64-bit process and a
32-bit process legitimately load different DLLs for one class, and comparing
them separately would invent a hijack out of that."""

