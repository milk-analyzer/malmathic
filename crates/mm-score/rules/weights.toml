    would be a coin toss on a machine with nothing wrong with it. That is the
    number this row is set by now, and it is a hypothesis about a machine that
    has both few candidates and a self-updating application — which is most
    small machines.

EQUAL TO `executable_rare_for_zone_on_this_machine` (+2.2) until this change and
now above it, which is a deliberate exception to the group's rule that the
machine's own measurement outranks a fixed claim. It is safe here for the reason
it was already safe as a tie: the rarity feature's threshold is five executables
in the zone, and Defender's platform directory alone puts 154 there on a real
Windows, so there is no measured claim in ProgramData for this row to override.
On the stripped install where there would be, the analyst loses nothing —
`append_detail` folds the superseded "one of only N executables anywhere in
ProgramData on this machine" sentence into the surviving evidence. Pinned by
`programdata_outranks_the_measured_claim_and_keeps_its_sentence`.

WHAT IT BUYS, from `examples/planted.rs` at the VM's prior of -7.6700, an
unsigned sample still on disk in ProgramData:

                          none   Run key     task   service
    at +2.2              0.033     0.458    0.557     0.507
    at +2.6              0.049     0.557    0.652     0.606

One cell that was missed is now reported (a Run key), and the service cell stops
being a coin toss. The margin is what this is really about: `ProgramData +
service, still on disk` totals +7.7 at 2.2, which breaks even at a prior of
-7.70 — 2,208 candidates, against the VM's 2,143. One more candidate directory
on the next run and the cell is lost. At 2.6 it totals +8.1 and breaks even at
3,294 candidates. Defender's own platform directory is in ProgramData, so this
is the zone where a privileged payload is least conspicuous.

CONSEQUENCE ON THE CLEAN DATASETS: nothing crosses 0.50 in either, and neither
machine's ceiling moves — 0.3385 on the VM and 0.2636 on the laptop (0.2364 on
the self-excluded laptop dataset), all unchanged from before this edit. The zone's own top FALLS on the VM, 0.0113 ->
0.0103, for the verification-band reason above, and rises on the laptop,
0.0259 -> 0.0381."""

