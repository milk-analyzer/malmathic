# --------------------------------------------------------------------------
# Location, CONDITIONED ON THE FILE BEING AN AUTOSTART TARGET
#
# The two rows below are the only interaction terms in this table, and they
# exist because a naive-Bayes fusion cannot express a conjunction. Every row
# above prices "the file is in AppData" against ALL of a machine's executables,
# where AppData holds 22% of them — a base rate that closes the road to any
# useful weight. These price the same location against a different and far
# narrower population: the machine's own autostart entries. Those are different
# numbers, and the second is the informative one.
#
# THE MEASUREMENT, made three ways and agreeing each time. Every non-COM
# persistence entry on both clean datasets, counted as distinct
# (mechanism x target path) pairs — Run, RunOnce, service, scheduled task,
# Winlogon, IFEO, BootExecute, LSA provider:
#
#     reference laptop   821 entries   6 point into a user profile (0.73%)
#                                      0 point into scratch space  (0.00%)
#     VM, from WinRE     678 entries   0 point into a user profile (0.00%)
#                                      0 point into scratch space  (0.00%)
#
# and independently, by enumerating the live reference machine directly rather
# than through a report — every Run/RunOnce value, every scheduled-task action
# with an Execute path, every Win32 service image path:
#
#     Run + RunOnce       12 entries    3 into AppData   (25%)
#     scheduled tasks     85 entries    2 into AppData   (2.4%)
#     services           296 entries    0 into a profile (0%)
#     Startup folders      1 entry      1 into AppData   (100%)
#     ------------------------------------------------------------
#     total              394 entries    6 into a profile (1.5%)
#
# The Startup-folder row was added when the harvester for it was written, and
# it is the reason the total moved from 393 to 394. Both scopes were enumerated
# on that machine — `%ProgramData%\\...\\Programs\\StartUp` and the profile's own
# — and between them they hold TWO files, one of which is the `desktop.ini`
# every Windows install has. The single real entry is `DeepL auto-start.lnk`,
# pointing at
# `%APPDATA%\\0install.net\\desktop-integration\\stubs\\<hash>\\auto-start.exe`,
# which is Authenticode-signed by DeepL SE and validates. It is a sixth benign
# file of exactly the shape the five below have: a per-user installer that
# cannot write to Program Files.
#
# Its effect on the arithmetic is nil — 1.3% becomes 1.5%, and ln(0.30/0.015)
# is 3.00 against the 3.14 this row is set at, inside the rounding this table
# already carries. Its effect on the SCORE of that file is the thing to notice:
# replayed through `examples/rescore.rs --startup`, `auto-start.exe` goes from
# 0.0000 to 0.0015. It picks up `persistence_run_key` (+3.2) and this row
# (+3.1), which supersedes the `executable_in_user_appdata` (+1.5) it used to
# carry, and `signed_trusted_publisher` (-3.9) still holds it three orders of
# magnitude below the threshold. That is the mechanism working as designed on
# the only real Startup entry either dataset has.
#
# THE STARTUP FOLDER GETS NO ROW OF ITS OWN, in this table or in the
# `persistence` group. One entry is not a population, and the mechanism is the
# same order of evidence as a Run key — so `PersistenceKind::StartupFolder`
# shares `persistence_run_key` (+3.2). What it does NOT share is the sentence;
# see `persistence_feature` in `features.rs`.
#
# THE BENIGN POPULATION, named, because the benign population is what sets the
# weight. It is five files and they are all of them:
#
#     C:\\Users\\<u>\\AppData\\Local\\Discord\\Update.exe          Run key
#     C:\\Users\\<u>\\AppData\\Local\\FigmaAgent\\figma_agent.exe   Run key
#     C:\\Users\\<u>\\AppData\\Local\\Google\\GoogleUpdater\\...\\updater.exe
#                                                            Run key + task
#     C:\\Users\\<u>\\AppData\\Local\\PowerToys\\PowerToys.exe      task
#     C:\\Users\\<u>\\Downloads\\Sandboxie-Plus\\SbieDrv.sys       service
#
# Four of the five are per-user installers that cannot write to Program Files;
# the fifth is a driver a user registered from the directory they unzipped it
# in. All four still on disk are validly Authenticode-signed by their publisher
# (Discord Inc., Figma Inc., Google LLC, Microsoft Corporation), which is what
# keeps them down: `signed_trusted_publisher` is -3.9 against these rows' +3.1.
# `stock_windows.rs` names all five, so the next person to touch these weights
# breaks a test naming a real program.
#
# WHAT IS DELIBERATELY EXCLUDED, each for a measured reason:
#
#   * ProgramData. 4 entries on the laptop and 4 on the VM, and it is Windows
#     Defender's `Platform\\<version>` directory every single time — MsMpEng.exe,
#     NisSrv.exe, MpDefenderCoreService.exe as services, MpCmdRun.exe as four
#     scheduled tasks. That is on every Windows install in the world. A row here
#     would fire on Defender on every machine and nothing else. `location` keeps
#     `executable_in_programdata` (+2.6) for it and this pair stays out.
#   * COM registrations, both `ComServer` and `ComHijack`. The AppData population
#     is 22 distinct files on the laptop against the five above — four times as
#     many, and they are shell extensions and preview handlers (PowerToys alone
#     is 15 DLLs), Chromium's notification_helper, Discord, camoufox, 0install.
#     Registration is how every context-menu entry on Windows is installed;
#     `persistence_com_server` is already +0.8 for exactly that reason, and
#     conditioning on it would import that population wholesale.
#   * `\\Windows` outside the system directories. 2 entries on each machine, and
#     it is a conventional zone.
#   * `Zone::Other` — a secondary volume, or a path we failed to resolve. 0
#     non-COM entries, but 230 COM registrations across the two datasets land
#     there solely because `%CommonProgramFiles%` is not a variable the path
#     normalizer expands. A row covering `Other` would be hostage to that gap.
#   * No location claimed at all. Unknown is not a claim and scores zero: the 8
#     `Unlocated` entries on each machine are the stock Winlogon Shell/Userinit
#     values and the LSA package list, which name a module and not a place.
# --------------------------------------------------------------------------

[features.persistence_targets_user_profile]
group = "location"
log_lr = 3.1
benign_rate = """
6 of 1,499 autostart entries across both clean datasets point into a user
profile directory, and 5 of 393 on the laptop alone
"""
rationale = """
An autostart entry — Run/RunOnce, service, scheduled task, Winlogon, IFEO —
whose target sits in a user profile: AppData, Downloads, or the profile itself.
The single most ordinary shape malware takes, and the one this table could not
express until it had an interaction term, because a Run key carries one weight
no matter where it points and AppData carries one weight no matter what starts
it. Neither marginal discriminates. The conjunction does.

MEASURED, all three censuses in the block comment above this row: 6 of 1,499
autostart entries across the two clean datasets (0.40%), and 5 of 393 by direct
live enumeration of the reference laptop (1.3%). Five distinct benign files, all
named there, all publisher-signed.

THE ARITHMETIC. The weight is ln( P(target in a user profile | autostart entry,
malicious) / P(same | autostart entry, benign) ). The denominator is taken as
1.3% — the LARGER of the two measurements, from the census that enumerated the
machine itself rather than the candidates a report happened to admit. The
numerator is taken as 0.30, which is a deliberate understatement: it assumes
that seven times out of ten a malicious autostart entry points somewhere OTHER
than the user's own profile. ln(0.30 / 0.013) = 3.14.

The honest range is wider in the incriminating direction. Using the pooled
0.40% and a realistic 0.70 for user-scope malware — which cannot write to
Program Files or System32 at all — the same arithmetic gives +5.1. This row is
set at the conservative end of its own measurement on purpose, because the
evidence is six benign entries on two machines and the population it could
surprise us with, an UNSIGNED per-user application with a Run key, is one that
plainly exists in the wild and simply is not on either of these two machines.

GROUP: `location`, not `persistence`. It therefore SUPERSEDES
`executable_in_user_appdata` (+1.5), `executable_in_user_downloads` (+1.6),
`executable_in_user_profile` (+1.0) and `executable_rare_for_zone_on_this_machine`
(+2.2) — which is precisely the double-count the group rule exists to stop,
since "the file is in AppData" and "the autostart entry points into AppData" are
one fact stated twice and the second is the better-conditioned statement of it.
It deliberately does NOT suppress `persistence_run_key` (+3.2),
`persistence_service` (+3.4) or `persistence_scheduled_task` (+3.6), and that is
not a double-count either: those price P(an autostart entry exists) and this
prices P(its target is in a profile | an autostart entry exists). That
factorisation is exactly what a conjunction is supposed to decompose into.

CONSEQUENCE ON THE CLEAN DATASETS: nothing crosses 0.50, and the ceiling on
neither machine moves. The five benign files above rise to 0.089 (SbieDrv.sys,
the highest), 0.029, 0.013, 0.013, 0.009 — leaving 2.3 log-odds of headroom on
the worst of them. The VM has no candidate this row can fire on at all.

DETECTION GAIN, from `examples/planted.rs` at the VM prior: an unsigned sample
still on disk in AppData\\Roaming goes none/Run key/task/service
0.017/0.295/0.385/0.338 -> 0.017/0.675/0.756/0.717, and in Downloads
0.019/0.316/0.409/0.361 -> 0.019/0.675/0.756/0.717. Six cells cross the
threshold; the `none` column does not move at all, which is the point — the row
is about the conjunction and cannot fire without an autostart entry.

RESTATED 2026-08-28, because those cells are stated at a prior that no longer
exists. -7.6700 was a 2,143-candidate rebuild of VM_TESTS/test_1. The hardest
VM machine in `mm_score::machine::MEASURED_MACHINES` is now VM_TESTS/test_7 --
the ransomware run, 2,868 candidates, prior -7.9614 -- and a prior is a
constant added to every candidate, so the whole table moves by exactly -0.2914
log-odds and nothing about the sample or the weights changes:

  \\AppData\\Roaming   none 0.013 / Run 0.608 / task 0.698 / service 0.654
  \\Downloads          none 0.014 / Run 0.608 / task 0.698 / service 0.654

All six autostart cells still clear 0.50, which is what this row was added for,
and the weakest of them has gone 0.675 -> 0.645 -> 0.608 as larger datasets
entered the table. That direction is not an accident: every dataset added since
has been bigger than the one it displaced as the bound, and a bigger machine is
a lower prior. `stock_windows.rs`'s
`the_appdata_and_downloads_rows_clear_the_threshold_at_the_vm_prior` pins these
six numbers against that table rather than against a remembered float, so the
next dataset that moves them fails the build instead of moving them quietly.

WHAT IT STILL DOES NOT DO: at the reference laptop's prior of -9.83, which is
what 18,537 candidates cost (the laptop rebuilds to 17,847 and -9.7896 today,
which does not change the conclusion), the same AppData + Run key shape reaches 0.193 and
is still missed. Closing that would take a weight this measurement does not
support."""

[features.persistence_targets_scratch_space]
group = "location"
log_lr = 4.3
benign_rate = """
0 of 1,499 autostart entries across both clean datasets point into scratch
space
"""
rationale = """
The same interaction, against scratch space rather than a profile: an autostart
entry whose target sits in `AppData\\Local\\Temp`, `\\Windows\\Temp` and its three
siblings, the volume root, or the recycle bin. Nothing is installed to these
places. A program that arranges to be started from one has, at minimum, been
installed by something that did not clean up after itself.

MEASURED, and the measurement is a zero: 0 of the 1,499 autostart entries on the
two clean datasets point into any of these four zones, and 0 of the 393 entries
enumerated live on the reference laptop. Not a small number — none. By the rule
of three that bounds the benign rate at 0.16% with 95% confidence on the pooled
1,892 entries, and the weight uses that bound rather than the zero, because a
zero divides. ln( 0.15 / 0.0016 ) = 4.5, rounded DOWN to 4.3.

The numerator, 0.15, is again a deliberate understatement — most malware that
persists does not persist from a temp directory, because a temp directory is not
where you put something you want to survive. What makes the row worth having is
not how often malware does this but how completely a clean machine does not: the
laptop has 34,449 executables in `AppData\\Local\\Temp` and 20 candidates in
`\\Windows\\SystemTemp`, and not one of them is registered to start.

GROUP: `location`, alongside its sibling above and for the same reason. It
SUPERSEDES `executable_in_user_temp` (+2.6), `executable_in_windows_temp`
(+3.0), `executable_in_recycle_bin` (+3.5) and `executable_at_volume_root`
(+3.8), and stacks with the persistence mechanism's own weight.

CONSEQUENCE ON THE CLEAN DATASETS: exactly none, measured rather than assumed.
No candidate on either machine carries an autostart entry pointing into any of
these zones, so no score moves. In particular the VM's 27 `\\Windows\\Temp` and
`\\Windows\\SystemTemp` candidates — which hold that machine's ceiling at 0.3385
— have no persistence entry between them and are untouched.

DETECTION GAIN at the VM prior: `AppData\\Local\\Temp` goes
0.049/0.557/0.652/0.606 -> 0.049/0.873/0.907/0.891 and `\\Windows\\SystemTemp`
0.071/0.652/0.737/0.696 -> 0.071/0.873/0.907/0.891. No new cell crosses that was
not already across; what this row buys is margin on cells that were clearing by
0.05, which is the difference between a finding and a coin toss."""

# --------------------------------------------------------------------------
# Baseline — anomaly measured against this machine, not against a rule
# --------------------------------------------------------------------------

[features.lone_executable_among_documents]
group = "baseline_context"
log_lr = 4.1
benign_rate = """
0 of the laptop's rebuilt 17,847 candidates and 0 of the VM's rebuilt
2,256, re-measured 2026-08-25 — the laptop's recomputed against its
volume with `rescore --census` rather than replayed, so this is now a
count and not a carry-over. On the VOLUME rather than among candidates the
shape is not rare at all: 379 of the laptop's 205,440 executables
(0.1845%) are the only executable in a directory holding ten or more
non-executables, and not one of them is a candidate
"""
rationale = """
The only executable in a directory that otherwise holds a substantial number of
non-executable files. This is the shape of a payload dropped into a user's
document or download folder, and it is measured against this machine's own
directory contents rather than asserted by a rule.

THE ONLY TWO FIRINGS IN THE WHOLE CLEAN CORPUS WERE THIS PROJECT'S OWN BUILD
OUTPUT, and that is the most important thing known about this row. Across both
clean datasets — 20,263 candidates on the reference laptop and 2,143 on the VM
— it fires exactly twice, on
`...\\scratchpad\\dev-prefetch\\target\\...\\deps\\dev_prefetch-*.exe`: a `cargo`
`deps` directory holding 57 files, of which one is an `.exe` and the other 56
are `.d`, `.rlib`, `.rmeta` and `.pdb`. Those two firings, at +4.1, are what put
this project's own harness at the top of the reference laptop's ranking (0.2636)
and are the reason that ranking had to be re-derived at all. Remove them —
`malmathic-case/report.self-excluded.json` — and the row fires on 0 of 19,270
and 0 of 2,143.

WHAT THAT DOES AND DOES NOT LICENCE. It does not license changing 4.1: two
firings on one developer's machine is not a benign rate, and lowering the weight
on that basis would be an unmeasured change in the exonerating direction. It
does license retiring the sentence "measured against this machine's own
directory contents" as an argument for the VALUE — the mechanism is measured,
the weight is an expert prior — and it names the false-positive shape precisely
enough to watch for: a BUILD directory is a directory of many small
non-executables with one executable in it, so this row will fire on any
developer's machine, in user temp, at +4.1, which is more than any location row
in the table except the volume root. The detail string it prints stays honest
about what it saw ("the only executable among 57 files in <dir>"); it is the
feature's NAME that says "documents" when what it measures is "non-executable
siblings".

WHAT ONE WRITTEN FILE BUYS, measured 2026-08-25 in examples/planted.rs at the
VM prior. An unsigned service payload alone among twenty documents scores
0.993; write ONE more .exe into the same directory and it is 0.707. The row is
a cliff, and the attacker's side of it costs one file. Nothing here proposes
softening that — a graded version would be a weight nobody has measured — but
the price is now written down instead of assumed.

THE OTHER SENTENCE IS SOUND. "The only executable among N files in <dir>" is
exactly what the walk established, so unlike `name_recurs_on_machine` this row
never claimed more than it saw. What was missing was the benign rate above and
the price here."""

[features.executable_rare_for_zone_on_this_machine]
group = "location"
log_lr = 2.2
benign_rate = """
decided against the volume's own population rather than a fixed rate, and
now counted as well: 7 of the laptop's 17,847 candidates (0.04%),
recomputed against its volume with `rescore --census`, and 2 of the VM's
2,256 (0.09%), replayed. On the VOLUME, 5 of the laptop's 205,440
executables (0.0024%). It contributes to a clean ceiling of 0.2333 on the
laptop and 0.3271 on the VM, and fires on neither ceiling file
"""
rationale = """
This machine has only a handful of executables anywhere in this zone, and this
is one of them. On a developer's machine the same location would be unremarkable
and this feature correctly stays silent — which is precisely what a fixed rule
cannot do.

STILL REACHABLE after the `Zone::Unlocated` change, which was the open question
about it. Measured on the reference Windows 11 machine — 1,748,931 files,
199,242 with an executable extension, classified by the tool's own `zone`
module. Executable counts in the zones this feature can fire in (the
non-conventional ones, since a conventional zone is excluded by construction):

    Windows temp        0      recycle bin         0
    volume root         4  ←   user Downloads      1  ←
    ProgramData       170      user temp      26,167
    user profile   43,857      user AppData   42,752
    elsewhere         811

Two zones are at or under the threshold of five, so it fires on 5 files out of
199,242 — 0.0025%. It is one of the quietest features in the table, and the
`Zone::Unlocated` guard is not what silences it: a bare module name never had a
zone to be rare in.

MOVED from `baseline_context` to `location`, on the strength of the same
measurement. Four of those five firings are at the volume root, where
`executable_at_volume_root` (+3.8) already fires — and "nothing legitimate
installs to C:\\" and "this machine has only four executables at C:\\" are the
same observation stated twice. In separate groups they added to +6.0; in one
group the stronger location weight survives, the rarity sentence still reaches
the analyst, and the arithmetic stops double-counting. The same collision exists
for `\\Windows\\Temp` (+3.0) and `$Recycle.Bin` (+3.5), which are likewise
near-empty on an ordinary machine.

Where the feature is genuinely independent it still scores on its own. That is
no longer true of ProgramData, which as of 2026-08-24 carries +2.6 and outranks
this row inside the shared group — and it costs nothing, because the rarity
threshold is five executables in a zone and Defender's platform directory alone
puts 154 in ProgramData on any real Windows, so this row could not have fired
there anyway. AppData, a user profile and a secondary volume carry +1.5, +1.0
and +1.0, all below this row, so on a machine that measurably does not use one
of them the measured claim is still the one that survives.

Incidentally measured and worth an analyst's attention: two of the four
"executables" at the volume root are `hiberfil.sys` and `swapfile.sys`, which
are not executables at all — they end in `.sys`, which the extension list treats
as loadable. That is a defect in the extension list rather than in this weight,
but before this regrouping those two files collected +3.8 and +2.2 on every
Windows machine in existence for being the pagefile.

WHAT SIX WRITTEN FILES BUY, measured 2026-08-25 in examples/planted.rs at the VM
prior, in `elsewhere` — the one zone whose fixed row (+1.0) is below this one, so
that the threshold can be seen at all. An unsigned service payload in a zone
holding one executable scores 0.495; at five, still 0.495; at six the row is
gone and it is 0.228. The price is 1.2 net, not 2.2, because
`executable_outside_standard_zones` (+1.0) takes over inside the shared group
when the measured claim stands down.

AND IT IS ONLY AVAILABLE WHERE THIS ROW IS THE BEST LOCATION EVIDENCE. In
ProgramData (+2.6), or a user profile with an autostart entry (+3.1), a stronger
fixed row already supersedes this one and writing six files buys the attacker
nothing whatever. That is the group rule doing exactly what it was put there for.

THE SENTENCE IS SOUND. "One of only N executables anywhere in the <zone> on this
machine" is what the walk established and no more; the row's exposure is the
threshold, not the claim."""

[features.compact_os_compressed_executable]
group = "signature"
log_lr = 0.6
benign_rate = """
0 of 16,177 laptop and 0 of 3,396 VM executables are Compact-OS compressed
in a zone where that is not how executables are stored
"""
rationale = """
An executable whose bytes are held Compact-OS (WOF) compressed, on a volume where
that is not how executables are stored.

WHAT IT IS FOR. `compact /c /exe:LZX <file>` needs no administrator and takes one
command. It used to leave the file's bytes in a `WofCompressedData` stream that
this build could not decode, so every reader downstream answered UNKNOWN — and
UNKNOWN scores zero. For an executable it converted whichever unsigned row the
zone would have used — `unsigned_in_system_zone` (4.2), `unsigned_in_program_files`
(1.3), `unsigned_in_user_zone` (1.1) — into `signature_unverifiable` (0.0). Making
that free was a documented one-command bypass of the whole signature stage, and
this row is what stopped it being free.

WHAT IS LEFT OF THAT. `mm_core::lzx` decodes LZX now, so `compact /c /exe:LZX`
buys nothing at all: the sample is read, hashed and verified like any other file
and takes its zone's unsigned row in full. `planted`'s bypass table prints the
compressed column identical to the plain one in every cell, which is the
assertion rather than the claim. What this row still answers is the residual: a
Compact-OS backing whose bytes cannot be produced even so — `WOF_PROVIDER_WIM`,
where the bytes are not in the file at all, or an algorithm number no version of
Windows has used yet. That population is ZERO on both clean datasets, which is
the reason the weight is NOT re-priced upward now that the Defender constraint
below has stopped binding: a row that fires on a population nobody has measured
is exactly what this table refuses to price. The constraint that still binds is
the second one below — it must stay under every unsigned row, the lowest of
which is `unsigned_in_user_zone` at 1.1.

WHY 0.6, AND NOT 2.0. This row shipped at 2.0 and 2.0 was wrong, in two ways that
were measured rather than argued.

  FIRST, IT REPORTED A CLEAN MACHINE. The VM's `MpDefenderCoreService.exe`, in
  `ProgramData\\Microsoft\\Windows Defender\\platform\\4.18.26040.7-0`, carries
  `persistence_service` (+3.4), `executable_in_programdata` (+2.6) and
  `name_unique_on_machine` (+1.0) — 7.0 against that machine's prior of -7.67,
  i.e. 0.339, the machine's ceiling. Its signature came back
  "not a PE image this build can parse", which is what a Compact-OS file looks
  like to a build that cannot decode it, and is the symptom this row prices. At
  2.0 it lands on 1.33 — 0.791, ranked first on a clean recovery console, with
  Windows Defender named as the finding. Crossing 0.50 also seeds an incident
  window, and the `$MFT` creation times of MpDefenderCoreService.exe, NisSrv.exe,
  MsMpEng.exe, MpCmdRun.exe and KslD.sys on that machine are all inside one
  second, so `created_in_incident_window` (+1.8) then lifts NisSrv.exe and
  MsMpEng.exe to 0.5325 apiece: THREE findings, all of them Defender, before
  anything is planted. That is not a tuning error, it is the tool naming the
  antivirus as the malware.

  THE HEADROOM SENTENCE HERE WAS WRONG AND IS REPLACED. It read "the headroom
  is exactly 7.67 - 7.0 = 0.67 log-odds, and no weight above it is safe on the
  population this project has actually measured". -7.67 is -ln(2143), a
  2026-08-24 rebuild of VM_TESTS/test_1 that no longer describes any machine;
  every VM dataset today holds 2,256-2,448 candidates, so the real headroom on
  a HEALTHY machine is wider (0.72-0.80) and the row was never in danger there.

  On a DEGRADED machine it is far worse than 0.67, and that is the number that
  should have been here. The +7.0 stack reaches even odds at e^7.0 = 1,096
  candidates, and a real clean volume gets below that: replay VM_TESTS/test_1
  with the Amcache, ShimCache and Prefetch unreadable and it rebuilds to 829
  candidates, where MpDefenderCoreService.exe REPORTS at p = 0.5695 with this
  row priced at ZERO. No value of this weight prevents that. It is a defect of
  `persistence_service` and `executable_in_programdata`, not of this row, and it
  is pinned by
  `the_defender_service_stack_convicts_on_its_own_below_1096_candidates` in
  `mm-score/src/features.rs` so that it is a number in the build rather than a
  thing somebody once noticed.

  The test `a_compact_os_unknown_cannot_report_the_defender_binaries_on_a_clean_vm`
  holds the achievable half of that arithmetic against this table — every
  measured dataset, at the prior its real population implies — and fails the
  build if anyone raises this row past it.

  SECOND, IT PAID MORE FOR IGNORANCE THAN FOR KNOWLEDGE. Read
  `examples/planted.rs`'s bypass table across, at 2.0: a ProgramData service
  payload the tool CAN read and finds unsigned scores 0.606; the same payload
  compressed, whose signature is unknowable, scored 0.791. Program Files, service:
  0.458 read, 0.629 unreadable — not reported when read, reported when unread.
  A file the tool cannot check must never outscore the same file checked and found
  at its worst. 0.6 is below every unsigned row in the table (the smallest is
  `unsigned_in_user_zone` at 1.1), so compressing a payload can no longer buy an
  attacker more than being caught unsigned would have cost him. The test
  `compressing_a_file_never_scores_more_than_reading_it_unsigned` pins that.

WHAT 0.6 STILL BUYS. Outside the directories Windows owns the bypass is now
strictly a loss for the attacker: 0.6 collected against 1.1 or 1.3 forfeited. In
the system zone the remainder is 4.2 - 0.6 = 3.6 and is NOT closed; closing it
needs the LZX decoder, not a bigger number, because any number large enough to
cancel 4.2 also reports Defender. That is the honest state of it.

WHY IT IS MEASURED AGAINST THE MACHINE. `mm-env`'s `compactpop` walked 375,002
files on the reference laptop and found 55 Compact-OS files; `Program Files`
walked on its own, with no file it could not open, gives 104,562 files, 17,370
executables, 55 compressed files (all LZX), ZERO compressed executables, and all
55 of them in ONE directory — Chrome Beta's `Locales`. That single table sets two
of the four gates: zero of 17,370 is why a compressed executable is unusual, and
55-in-one-directory is why gate 4 exists.

The earlier, narrower census agrees: across 277,002 files on the reference
laptop — the Windows directory, Program Files, Defender's directory — 55 are
Compact-OS backed and NOT ONE EXECUTABLE ANYWHERE IS: 0 of 16,177 in System32,
0 of 3,396 drivers, 0 of 123,221 in WinSxS, 0 of 590 in Defender's platform
directory. All 55 are Chrome `.pak` resources, which are not executables and
never candidates. A fresh `compactpop` run this round over Defender's three
directories on that laptop — 659 files, 174 executables — found zero compressed
files of any kind, so the laptop's Defender is not compressed and the VM's is.
The VM holds two compressed executables, both Defender's own. So the entire
observed population of Compact-OS-compressed executables across both real
machines is two files, and both of them are Microsoft's antimalware service — a
population from which no positive likelihood ratio can honestly be estimated at
all. 0.6 is priced as the largest number that cannot report that population, not
as a measured LR.

But on a machine with Compact OS actually enabled — a 32 GB eMMC laptop, a WinPE
image — most of Windows is stored this way and the identical fact means nothing.
So the feature is gated four ways, and the gates are the whole design:

  1. the compression is WHY nothing could be checked. A compressed file this
     build can decode is verified like any other and its verdict is the better
     answer; there is no UNKNOWN there to price;
  2. at most five compressed executables on the volume — few;
  3. under 1% of this volume's executables — a minority, so a Compact-OS
     install silences the row outright;
  4. not compressed along with its own directory. An installer compresses a
     directory; `compact /c /exe:LZX <one file>` compresses a file, and all 55
     Compact-OS files on the reference laptop are of the first kind.

Gates 1, 2 and 4 are the three that could not be evaluated for the VM's Defender
binaries from a finished `report.json`, which is why the weight is now set so
that it does not matter whether they hold.

WHY IT IS IN THE `signature` GROUP. Because it is a refinement of the signature
claim, not a second independent one: it is the fact that turned up INSTEAD OF a
verdict. In that group it supersedes `signature_unverifiable`'s 0.0, so
compressing a payload is no longer free — and it is superseded in turn by any
real verdict, so a compressed binary this build CAN decode keeps whatever its
signature says. Defender's compressed binaries are the case that matters, and
after this round it is settled rather than conditional: XPRESS and LZX are both
decoded, both binaries verify, and gate 1 keeps this row silent for them
entirely.

WHAT IT DOES NOT CLOSE. The system zone, as above — which needed a decoder for
WOF LZX, and now has one. `wofpin` measured that `RtlCompressBuffer` produces no
format reproducing Compact OS's LZX on-disk size; `lzxcab` measured that
`makecab /D CompressionType=LZX /D CompressionMemory=15` produces real Microsoft
LZX at the same 32 KiB window, giving a codec oracle; and this round got the
framing oracle too, out of a `WIM_COMPRESS_LZX` WIM that `wimgapi.dll` will write
without any privilege, checked against the SHA-1s the WIM itself records. See
`mm_core::lzx` for those measurements and for the single inference that remains —
that a Compact-OS chunk is byte-identical to a WIM chunk, established through 25
exact compressed-size equalities and two crafted probe pairs rather than by
reading a `WofCompressedData` stream, which still needs Administrator or WinRE.
`mm_raw::wof` carries the commands that would replace that inference with a
fixture."""

[features.name_unique_on_machine]
group = "name_frequency"
log_lr = 1.0
benign_rate = """
MEASURED, 2026-08-25, over three populations. ON THE VOLUME: 336,049 of the
reference laptop's 1,910,059 files (17.6%) and 26,245 of its 205,440
executables (12.8%) carry a name no other file carries — walked with
mm-env/examples/filecensus.rs, counted with mm-score/examples/namestudy.rs.
AMONG CANDIDATES: 1,662 of the laptop's 17,847 (9.31%), recomputed against
that volume with `rescore --census`, and 1,149 of the VM's 2,256 (50.93%),
replayed. AT THE TOP OF THE RANKING: 19 of the laptop's top 20 and 17 of
the VM's top 20
"""
rationale = """
No other file on the machine carries this name. Genuine system binaries almost
always appear more than once, because the component store keeps originals
alongside the live copy. Weak on its own — most user documents are unique too.

IS IT EARNING ANYTHING? The audit's objection was that it fires on nearly every
file at the top of a ranking, which is the opposite of what a discriminator
does. Measured: it does — 19 of 20 and 17 of 20 — and it is still
discriminating inside the population, because only 9.31% of the laptop's
candidates carry it. Both are true at once: the features that put a file at the
top of this list co-occur with a unique name, and most candidates do not have
one.

WHAT IT COSTS AND WHAT IT BUYS, measured with `rescore --zero`:

    withheld            laptop ceiling   VM ceiling
    no                      0.2333          0.3271
    yes                     0.1007          0.1517

and on the detection side, from examples/planted.rs at the VM prior, an unsigned
service payload in AppData\\Roaming still on disk scores 0.707 with the row and
0.470 without it — the difference between reported and missed. It lifts clean
and malicious alike, which is what a row this close to universal at the top of a
ranking must do.

WHY IT STAYS AT EXACTLY +1.0. The two clean machines disagree about the benign
rate by a factor of five (9.31% against 50.93%). Taking P(unique | malicious) as
near 1 for a freshly written dropper, the laptop's rate implies ln(1/0.0931) =
2.37 and the VM's implies ln(1/0.5093) = 0.67. +1.0 sits between them and nearer
the weaker of the two; moving it would be fitting to whichever machine was
measured last."""

[features.name_recurs_on_machine]
group = "name_frequency"
log_lr = -1.2
benign_rate = """
MEASURED, 2026-08-25. ON THE VOLUME: 1,346,830 of the reference laptop's
1,910,059 files (70.5%) and 163,791 of its 205,440 executables (79.7%)
carry a name three or more files share. AMONG CANDIDATES, recomputed
against that volume with `rescore --census`: 15,596 of the laptop's 17,847
(87.4%) under the old rule, 15,355 (86.04%) under the twelfth round and
15,354 (86.03%) under the thirteenth. The
VM's 784 of 2,256 (34.75%) are replayed from its report, because the VM's
volume is not here to recompute against
"""
rationale = """
The name appears several times across the machine, the pattern of a real system
binary with component-store copies. Mildly exonerating.

THE SENTENCE USED TO OUTRUN THE EVIDENCE, and the gap was one `copy` command
wide. `Baseline` stored a bare FNV-1a name hash with no location, so three
copies in three user-writable directories produced exactly the count that
System32-plus-its-WinSxS-originals produces — and the row answered with "the
pattern of a real system file" about the dropper's own name.
`name_unique_on_machine` (+1.0) already stands down at the second copy, so two
`copy` commands bought 2.2 log-odds in the exonerating direction and the
sentence that explained the file away.

THE RULE NOW. `Baseline` counts, per name, how many occurrences sit in a zone
`Zone::is_conventional_for_executables` admits, and the row is offered only when
that count exceeds the candidate's own contribution to it — so at least one
OTHER copy has to sit where Windows and installers actually ship executables. It
is not a claim about where this file sits: a redistributable runtime in a user
directory with forty copies under Program Files still collects the row.

WHAT THE DATA SAYS, from mm-score/examples/namestudy.rs over 1,910,059 files:
204,244 names recur three times or more; 34,336 of them have a copy in a
conventional zone and 169,908 have none. Among files with an executable
extension the split is 130,632 occurrences against 33,159, and the 33,159 are
node_modules, Python virtualenvs and cargo target directories — the same
user-writable places a dropper writes to. From the other side, 5,386 of the
5,932 distinct executable names in System32 (90.8%) recur three times or more,
so the population the sentence describes keeps the row.

WHY ONE CONVENTIONAL COPY AND NOT TWO. 2,519 of the 34,336 recurring names with
a conventional copy have exactly one, covering 8,634 executable occurrences —
software installed once, in the one place it belongs, with its other copies in a
cache or a user profile. Requiring two would withdraw the row from all of them
to close nothing an attacker could not reach with the same privilege, so one is
the bar. The self-exclusion below is what stops that one copy being the
candidate itself.

COST ON THE CLEAN DATASETS: 241 of the laptop's 17,847 candidates lose the row
(117 for having no conventional copy at all, 124 more for the self-exclusion),
and the machine's ceiling does not move — 0.2333, nothing reported. The VM's
volume cannot be recomputed against, so the bound was taken from the other side:
withholding this row from ALL 784 of its carriers with `rescore --zero` leaves
that machine at 0.3271 with nothing reported, which is strictly worse than
anything this rule can do to it.

WHAT AN ATTACKER STILL BUYS, from examples/planted.rs at the VM prior, an
unsigned service payload still on disk in AppData\\Roaming:

    decoy copies                  0        1        2        3
    old rule                  0.707*   0.470    0.211    0.211
    this rule                 0.707*   0.470    0.470    0.470
    decoys in Program Files   0.707*   0.470    0.211    0.211

The first copy still costs the file its +1.0 and that is NOT closed — one `copy`
takes 0.707 to 0.470, from reported to missed. What is closed is everything
after it: the second and third copies now buy nothing, where they used to buy a
further 1.2. Two cells the old rule lost are recovered — AppData\\Local\\Temp
and \\Windows\\SystemTemp with a service, back at 0.746 and reported at two
decoys where they were 0.470 and missed. THE RESIDUAL is the last row: an
attacker who can already write to Program Files gets the full 2.2 back, because
his decoys then satisfy the rule. That is a strictly larger assumption than the
evasion started with, and it is not closed.

THIRTEENTH ROUND: THE ROW MAY NOT EXCUSE A FILE FOR WEARING A NAME THE ROW IS
COUNTING SOMEBODY ELSE'S COPIES OF. On the detonated image the user's dropper,
sitting in the roaming AppData directory under the name svchost.exe, took +6.0
from system_binary_name_outside_system_dir and then gave 1.2 of it straight
back: "svchost.exe appears 9 times on this machine, 8 of them where Windows and
installers ship executables -- the pattern of a real system file". Those eight
ARE a real system file. They are the file being impersonated. The +6.0 row had
already established that this candidate is not one of them, and the exoneration
then discounted it BECAUSE the borrowed name is a common one, which is the whole
mechanism of the disguise. 7.4 of evidence against a prior of 8.0, and the
cryptor's dropper was not reported.

The two rows are in different groups (name_frequency and masquerade) so
one-per-group never made them compete. The fix is not a group merge -- that
would also swallow name_unique_on_machine (+1.0), which is independent of the
masquerade claim -- and not a suppression keyed on the other row having fired,
which would depend on extraction order. It is in the COUNT, which already knew:
when the name is one of the twenty in SYSTEM_BINARIES and the candidate is
outside that name's home, every conventional-zone occurrence being counted is a
copy of the genuine Windows binary, so the count is evidence about the
impersonated and none about the impersonator. The row is withheld there, and the
number is moved into the masquerade row's own sentence, where it says the
opposite of what it used to.

MEASURED, 2026-08-28.
WHOLE VOLUME, reference laptop, 2,008,253 files walked with filecensus: 130 files
carry one of the twenty names. 128 are at home (System32, SysWOW64, WinSxS, and
the Windows root for explorer.exe). TWO are not, and both are benign: BigNox's
own regsvr32.exe under Program Files (x86), and a services.exe test fixture
inside a cargo registry checkout of the evtx crate. Neither is a candidate the
rule can reach except the first.
CANDIDATES: laptop, recomputed with rescore --census over 17,847 candidates,
15,355 carried the row and now 15,354 do -- exactly one file changes, the BigNox
copy, 0.0068 to 0.0221 against a 0.50 bar. The machine ceiling is unmoved at
0.2333 with nothing reported. VM_TESTS/test_3: 1,358 carriers before and after,
strongest 0.2309, nothing reported. VM_TESTS/test_4: 1,355 carriers before and
after, both njRAT stages still found at 0.9973 and 0.9804. The three clean links
of the detonation chain (-000002, -000004 and the -000006 snapshot) rescore with
ZERO evidence rows changed on any of their 2,707 / 2,846 / 2,846 candidates: no
file on any of them wears one of the twenty names outside its home.
ON THE MALWARE IMAGE: one candidate of 2,868 loses the row, and it is the
dropper. It goes 7.4 to 8.6 of evidence, p 0.36 to 0.65, and is reported. The
genuine Windows System32 svchost.exe on the same image keeps its -1.2."""

# --------------------------------------------------------------------------
# Masquerade
# --------------------------------------------------------------------------

[features.system_binary_name_outside_system_dir]
group = "masquerade"
log_lr = 6.0
benign_rate = """
1 file across both clean datasets after the where-it-belongs table was
added -- BigNox's own copy of regsvr32.exe, held to 0.0221 (0.0065 when
the recurrence discount still applied to it; see the thirteenth round in
name_recurs_on_machine). RE-MEASURED 2026-08-28 over the whole reference
laptop rather than over its candidates: of 2,008,253 files, 130 carry one
of the twenty names and 128 of those are at home, so the population this
row can reach at all is TWO files -- the BigNox copy and a services.exe
test fixture in a cargo registry checkout. Zero carriers on VM_TESTS
test_3 and test_4 and on all three clean links of the detonation chain
(-000002, -000004, -000006); the single carrier on the detonated -000005
is the ransomware dropper. Before the where-it-belongs table this row
fired on the stock explorer.exe on both machines, reaching 0.116
under WinRE conditions
"""
convicts_alone = """
Yes. Like `persistence_ifeo` and unlike `quarantined_by_av`, this is a
present structural fact about the file rather than a recorded opinion
about it: a binary calling itself `svchost.exe` while sitting in
the roaming AppData directory is misrepresenting what it is, right now, and the
misrepresentation is the evidence. There is no benign reason to be named
after a Windows system binary outside the directory Windows puts it in,
and the one carrier in six datasets is a vendor shipping a genuine copy of
regsvr32.exe, held to 0.0065 by the where-it-belongs table.

Above the 5.6201 ceiling by 0.38, so on a 750-candidate machine an
unaccompanied masquerade reports at p = 0.59. Accepted: naming yourself
`lsass.exe` in a temp directory is a thing an analyst must be shown even
when nothing else about the file is known.
"""
rationale = """
Carries the name of a known Windows binary (svchost.exe, lsass.exe, services.exe
and friends) while living somewhere Windows never puts it. This is a deliberate
disguise with essentially no innocent explanation, and it is one of the highest-
confidence single features available without reading file contents.

THE NUMBER IS UNCHANGED; WHAT IT FIRES ON WAS WRONG. The rule used to read
"outside System32, SysWOW64 and WinSxS", which is not the same sentence as
"somewhere Windows never puts it", and the difference accused a real file. Both
clean datasets record this row firing on `%SystemRoot%\\explorer.exe` — Explorer,
in the directory that is its home — held under the threshold only by its
trusted-publisher signature (-3.9) and its component-store copies (-1.2),
reaching 0.0015 on the VM and 0.0003 on the laptop. On a WinRE run whose catalog
store cannot be read, `signature_unverifiable` is 0.0 and the same stock file
reached 0.116. WinRE is this tool's primary scenario, so the bug bit hardest
exactly where the tool is meant to be used.

This is the `Winlogon\\Shell` failure again: a rule that had never met the
legitimate case. The fix is not a lower weight — a system binary name in a user
temp directory really is worth +6.0 — but a table of where each of the twenty
names actually belongs, in `mm-score/src/features.rs`.

MEASURED, reference laptop (Windows 11 26200), every file under \\Windows
carrying one of the twenty names:

    \\Windows\\System32     18 of the 20 names
    \\Windows\\SysWOW64      7 names
    \\Windows\\WinSxS      every name, in servicing copies and their `\\r` twins
    \\Windows              explorer.exe, and nothing else on the list

One name needed a second home. The Windows-root arm is directory-exact, not
zone-wide: `\\Windows\\explorer.exe` is home, `\\Windows\\Tasks\\explorer.exe` is
still accused, and so is `\\Windows\\SysWOW64`'s sibling names in any other
\\Windows subdirectory.

WHAT STILL FIRES ON THE CLEAN DATASETS, after the fix: one file across both,
`\\Program Files (x86)\\BigNox\\BigNoxVM\\RT\\regsvr32.exe` — an Android emulator
shipping its own copy of regsvr32. That is a correct firing. A third-party
product placing a system binary's name in its own install directory is worth an
analyst's glance, and it is held to 0.0065 by everything else about it: the name
recurs on the machine (-1.2) and nothing else about the file is remarkable. The
VM now has no firing at all, where it previously had one — Explorer's."""

[features.rich_header_checksum_invalid]
group = "binary_identity"
log_lr = 2.0
benign_rate = """
8 of 5,929 files carrying a Rich header under System32 on the reference
laptop fail the checksum — 0.135%, and all eight are Oracle
VirtualBox drivers, one vendor whose post-build processing rewrites the stub.
The other 5,921 verify, which is also what says the checksum is implemented
correctly: an arithmetic error would fail nearly all of them, not eight.
71 further files carry no Rich header at all and are not counted here — a
missing header is ordinary (MinGW, Go, Delphi, and anything not linked by
Microsoft's linker produce none) and is NOT this feature.
"""
rationale = """
The Rich header records which Microsoft toolchain components built the image,
and the key stored beside it is a checksum computed by the linker over the DOS
stub and the toolchain entries. The two agree only if the linker wrote both and
nothing edited the file afterwards.

They therefore disagree in exactly two situations: the header was lifted out of
another binary and pasted in, or the bytes under it were edited after linking.
The first is a known masquerading move — a dropper carrying a genuine Microsoft
build fingerprint looks, to anything that reads that fingerprint, like it was
built at Microsoft. The second means the file is not what its own headers say.

The numerator is an expert prior and a weak one: nobody has counted how often
real malware forges this header, and the technique is rare. 2.0 says the author
judged a forged header roughly seven times likelier on a malicious file than on
a benign one, given that 0.135% of benign files here trip it. It sits below
pe_structural_anomaly (2.8) deliberately: an entry point outside every section
was never observed benign at all, and this was, on one vendor's drivers.

What would close it: a labelled corpus. Until then the denominator is measured
and the numerator is a judgement, which is the usual shape in this table.

It sits in binary_identity, beside no_version_resource, rather than among the
name-based masquerade rows: only the strongest row in a group scores, and a
forged toolchain fingerprint is a fact about the bytes that should add to a
suspicious name, not be silenced by one.
"""

