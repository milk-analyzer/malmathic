[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pymalmathic"
version = "0.1.0"
description = "Python bindings for the malmathic forensic core: Windows artifact parsers, raw NTFS image reading, PE analysis"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/milk-analyzer/malmathic"

[project.optional-dependencies]
test = ["pefile"]
