[workspace]
resolver = "2"
members = [
    "crates/mm-core",
    "crates/mm-env",
    "crates/mm-raw",
    "crates/mm-harvest",
    "crates/mm-sign",
    "crates/mm-score",
    "crates/mm-report",
    "crates/malmathic",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/milk-analyzer/malmathic"

[workspace.dependencies]
mm-core = { path = "crates/mm-core" }
mm-env = { path = "crates/mm-env" }
mm-raw = { path = "crates/mm-raw" }
mm-harvest = { path = "crates/mm-harvest" }
mm-sign = { path = "crates/mm-sign" }
mm-score = { path = "crates/mm-score" }
mm-report = { path = "crates/mm-report" }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

ntfs-core = "0.9"
nt_hive2 = "4.2"

sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"

[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
