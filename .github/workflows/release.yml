name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    name: malmathic.exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Build x86-64
        run: cargo build --release -p malmathic
      - name: Build ARM64
        run: cargo build --release -p malmathic --target aarch64-pc-windows-msvc
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/malmathic.exe "dist/malmathic-${{ github.ref_name }}-windows-x86_64.exe"
          cp target/aarch64-pc-windows-msvc/release/malmathic.exe "dist/malmathic-${{ github.ref_name }}-windows-aarch64.exe"
          cd dist && sha256sum *.exe > "malmathic-${{ github.ref_name }}.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: dist/*

  wheel:
    name: pymalmathic wheel
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release
      - uses: actions/upload-artifact@v5
        with:
          name: wheel
          path: bindings/python/target/wheels/*.whl

  release:
    name: publish
    needs: [binaries, wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
